<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1615" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Todo Cal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f66'/%3E%3Cpath d='M7 12h18M7 18h10' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M22 16l3 6h-6z' fill='white'/%3E%3C/svg%3E">
<title>Todo Calendar</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="app-bar">
  <div class="brand"><i></i>Todo Calendar</div>
  <nav class="tabs" aria-label="Views">
    <button data-view="runway">Runway</button>
    <button data-view="week">Blocks</button>
    <button data-view="deck">Focus</button>
  </nav>
  <button class="tcl-btn primary" id="add">+ Task</button>
  <button class="tcl-btn menu-btn" id="menu" aria-label="Menu">⋯</button>
</header>
<main id="view"></main>
<nav class="tabbar" aria-label="Views">
  <button data-view="runway"><svg viewBox="0 0 24 24"><path d="M3 8h12M3 14h7M3 20h15"/><path d="M17 4v6l4-3z"/></svg>Runway</button>
  <button data-view="week"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 13h3v5H8zM14 11h3v3h-3z"/></svg>Blocks</button>
  <button data-view="deck"><svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="15" rx="2"/><path d="M8 3h8"/><circle cx="12" cy="13.5" r="3"/></svg>Focus</button>
</nav>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
