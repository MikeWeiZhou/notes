na Travel Guide","date":"2026-04-19","likes":"28","stance":"against","says":"Local says skip with 1-2 days: real old street is 300 m, mostly new fake-old buildings."},{"ref":"YT 27","platform":"YT","platformName":"YouTube","url":"https://www.youtube.com/watch?v=sAihlkTABbg","title":"CIQIKOU ANCIENT TOWN 🇨🇳 | Exploring Old Chongqing’s Historic Streets | Chongqing Vlog","author":"Camp & Chill","date":"2026-10-04","likes":"0","stance":"neutral","says":"Plain walk-through vlog exploring Ciqikou Ancient Town."},{"ref":"TT 12","platform":"TT","platformName":"TikTok","url":"https://www.tiktok.com/@wandriftchina8/video/7664921117026503958","title":"🎉 Visiting Chongqing for the first time?","author":"WandriftChina (@wandriftchina8)","date":"2026-07-21","likes":"137","stance":"mixed","says":"Beautiful, but it has become very commercial."},{"ref":"TT 30","platform":"TT","platformName":"TikTok","url":"https://www.tiktok.com/@chongqing_insights/video/7665915613537225998","title":"5 famous spots in Chongqing underrated o","author":"Chongqing_insights (@chongqing_insights)","date":"2026-07-24","likes":"54","stance":"against","says":"Definitely overrated: packed with identical snack stalls and tourist souvenirs."},{"ref":"IG 3","platform":"IG","platformName":"Instagram","url":"https://www.instagram.com/reel/DN4_zN-khtk/","title":"Honest Ranking of Chongqing Pt.1 - deinfluencing you from overhyped spots in Cho","author":"brandneweats","date":"2025-08-28","likes":"39,751","stance":"against","says":"On Ciqikou: ancient towns in China all end up really commercialized."},{"ref":"IG 7","platform":"IG","platformName":"Instagram","url":"https://www.instagram.com/reel/DVqDYx1AZn9/","title":"去了N次重庆，总结下来，只有这6个地方最值得去#重庆旅游攻略 #Chongqing #重庆旅游 #重庆","author":"lukedoris06","date":"2026-03-09","likes":"501","stance":"against","says":"Dismisses it as the tourist shopping street found all over the country."}],"posNote":"from a map listing with this name","q":"listing","areaShort":"Near Ciqikou","where":"Near Ciqikou 磁器口 · 600 m from Ciqikou 磁器口 station · 13.7 km from your hotel. Distances are straight lines.","px":2584,"py":5056},{"id":"md_jiangtan","layers":["mustdo"],"en":"Grand Theatre riverside (Jiangtan Park)","zh":"江滩公园 · 大剧院","short":"Grand Theatre riverside","zhShort":"大剧院江滩","amapq":"重庆大剧院","nonspicy":false,"n":6,"for":5,"against":0,"mixed":0,"notes":[{"page":"mustdo","from":"must-dos research","what":{"t":"Riverside park used to view and photograph Hongyadong's night lights from across the water.","r":["XHS 12","XHS 29","IG 12","TT 9"]},"good":[{"t":"Better photos of Hongyadong than from inside it","r":["XHS 12"]},{"t":"View described as absolutely stunning","r":["TT 9"]},{"t":"Avoids the Hongyadong crowds","r":["IG 12","XHS 12"]}],"bad":[],"tips":[{"t":"Navigate to 'Grand Theater' rather than to the park name","r":["IG 12","TT 3"]},{"t":"Metro Line 6 to Grand Theater Station, then turn around to face the river view","r":["TT 9"]}],"refmap":{"IG 12":"https://www.instagram.com/reel/DOZ4HMljOBg/","TT 3":"https://www.tiktok.com/@hello.china.guide3/video/7704643118515244294","TT 9":"https://www.tiktok.com/@thechongqingguy/video/7619310017799572758","XHS 12":"https://www.rednote.com/discovery/item/69dcba11000000001e00e3ac?xsec_token=ABA-pkcijxDjeAdaFtCC59ANe9fkra8tYYack5Yc-FFs8=&xsec_source=pc_search&type=video","XHS 29":"https://www.rednote.com/discovery/item/6abf94300000000015008149?xsec_token=ABAv8rWbY-cIOdyp661c1ujChR0U-yjT3PIwvOmgJtLds=&xsec_source=pc_search&type=video"}},{"page":"extra","from":"web research, 16 Nov","what":{"t":"The stretch of Jiangbeizui Riverside Park on the Jialing bank below the Grand Theatre, directly across the water from Hongyadong. It is the free across-the-river position for Hongyadong, Qiansimen Bridge and the Yuzhong skyline in one frame.","r":["S1","S2","S20","S24"]},"good":[{"t":"Frontal view of Hongyadong with Qiansimen Bridge in the same frame. A 2025 Sina post calls this bank the best Hongyadong position, and an April 2026 visitor came here for the head-on shot.","r":["S2","S6","S5"]},{"t":"The posts you already saved say photos from here look better than from inside Hongyadong, and you skip its crowd.","r":["S24","S28","S25"]},{"t":"Free, open around the clock, nothing to book.","r":["S1"]},{"t":"Room to work. In April 2026 the bridge railings and Hongyadong's ground floor were packed while this bank was the usable alternative; a 2022 photographer found an empty patch here and set up a tripod to wait for dark.","r":["S6","S3"]},{"t":"Turn round and the lit Grand Theatre and bridge are behind you; Trip.com posts also list Raffles City among the views. Your TikTok source makes the same point from the station: get off, turn round, the view is there.","r":["S3","S1","S26"]},{"t":"Short approach: sources put the river 4 to 6 minutes from Grand Theatre station.","r":["S1","S4"]},{"t":"On Saturdays the 20:30 drone show is visible from here with fewer people than on your Nanbin Road side.","r":["S11","S10"]}],"bad":[{"t":"Paid-photo touts. A 2024 guide warns there are many here, a 2023 post describes lots of vendors and photographers, and one Trip.com post says agree the price first (a tout's ad on that page quoted 68 yuan for 10 photos). Many of the Douyin route videos are posted by guides and photographers too.","r":["S4","S5","S1","S17"]},{"t":"The last stretch is stone steps down through the 保定门 archway, and no source mentions a lift. Hard on tired legs coming back up. A 2025 Sina post says the alternative is to follow the riverside road downhill from the theatre.","r":["S3","S17","S2"]},{"t":"Do not count on the pebble beach in November. The lowest trail and the stones sit in the reservoir drawdown zone and are exposed in spring and summer; a 2021 post gives February to May for walking onto the riverbed, one Trip.com post says April to October. The Three Gorges reservoir began refilling on 10 September, so expect to shoot from the promenade. I could not confirm this week's water level.","r":["S14","S15","S1","S21"]},{"t":"If the rocks are out, they are wet and slippery and there are drainage ditches in the dark. Trip.com posts say stay back from the edge and keep out of the water.","r":["S1"]},{"t":"November air: mostly overcast with mist and drizzle, so the far bank can look soft and flat, and steps get slippery. Nights run about 10-12°C with a damp river wind.","r":["S16","S1"]},{"t":"Trip.com posts say nothing to eat is sold on the bank, and none of the sources I read mentions toilets down there. Sort both out before you go down.","r":["S1"]}],"tips":[{"t":"For Didi, enter 重庆大剧院停车场 (Grand Theatre car park); two guides give this as the taxi drop-off. For walking navigation use 保定门. The park is about 6 km long and one Trip.com listing shows an address far along it, so the park name alone may drop you on the wrong stretch; your saved posts say to navigate to the Grand Theatre. I found no sourced drive time from Nanbin Road, so check the app's estimate.","r":["S2","S19","S1","S13","S28","S27"]},{"t":"By metro it is Line 6 to 大剧院 (Grand Theatre). Sources disagree on the exit: Exit 1 (city government account, May 2026, and Douyin videos), Exit 2 (2023 and 2025 guides), Exit 3-1 (Bendibao, November 2026), Exit 5 (some Trip.com posts). All are a few minutes from the river, so follow the signs.","r":["S13","S17","S2","S19","S5","S11","S1"]},{"t":"Route down: from the car park side, cross the road, take the stone steps opposite, go through the round archway (保定门), then the stairs on the left bring you to the water's edge.","r":["S3","S17","S22"]},{"t":"Where to stand: at the riverside railings looking roughly south across the Jialing for the frontal Hongyadong shot. Shift along the bank toward the bridge to stack bridge and Hongyadong together. Under the bridge suits a very wide lens (a 2021 post says 14mm); a phone's 3x or a telephoto compresses Hongyadong against the Yuzhong towers.","r":["S1","S6","S15","S22"]},{"t":"Timing this week: sunset is 17:58 and dusk ends about 18:23. Since 17 October 2026 Hongyadong lights up at 18:30 and goes dark at 23:00, so be in place by 18:00 and you get the last blue in the sky as it switches on. Older guides that say 19:30 or 20:00 predate the change.","r":["S9","S7","S8"]},{"t":"The bridge lights are a separate switch and sources disagree: on between about 19:00 and 20:00, off anywhere from 21:30 to 22:30. For everything lit at once, 20:00 to 21:30 is the safe window.","r":["S2","S5","S6","S17","S20","S1"]},{"t":"Weekday evenings are the easy ones; Trip.com posts say weekends and holidays get very busy. One post suggests 20:30 to 22:30 for a quieter bank.","r":["S1"]},{"t":"Drone show: regular shows are Saturdays at 20:30 for about 20 minutes, next on 21 and 28 November; specials on Fri 20 and Sun 22 November have no announced time yet. Rain cancels. From this bank the angle is side-on, so some patterns look skewed. Afterwards expect metro queues; one post says wait 20-30 minutes.","r":["S10","S12","S11","S1"]},{"t":"Getting back: Line 6 is listed as running until 23:00 and 上新街 on your side of the Yangtze is on the same line, via 小什字. I did not confirm the walk from 上新街 to the Sheraton, so a Didi from the Grand Theatre car park is the low-effort way home.","r":["S18","S23","S4","S19"]},{"t":"Allow 45 to 60 minutes on the bank for photos, plus the steps; Trip.com suggests 1 to 3 hours if you stroll. Wear non-slip shoes and bring a light jacket. After rain, puddles on the paving give reflections.","r":["S1","S22","S5"]}],"refmap":{"S1":"https://hk.trip.com/moments/poi-jiangbeizui-riverside-park-136173932/","S2":"https://www.sina.cn/news/detail/5244158400792751.html","S3":"https://www.sohu.com/a/546129638_105999","S4":"https://www.sohu.com/a/788805026_586102","S5":"https://c.m.163.com/news/a/I9KFF2UO0544DQ5F.html","S6":"https://www.sina.cn/news/detail/5292069779935616.html","S7":"https://www.sohu.com/a/1089060488_121106884","S8":"https://i.ifeng.com/c/8xJeR9rec6k","S9":"http sts warn of touts, slippery rocks, busy weekends."},{"ref":"S2 · web research","platform":"Web","platformName":"Sina News","url":"https://www.sina.cn/news/detail/5244158400792751.html","title":"原来拍摄洪崖洞最佳的机位在江北嘴江滩公园，洪崖洞通常19：30-23：00亮灯…","author":"探哥日记","date":"2025-12-15","likes":"","stance":"for","says":"Calls it the best Hongyadong position; Exit 2, navigate to 保定门, or taxi to the Grand Theatre car park and take the steps."},{"ref":"S3 · web research","platform":"Web","platformName":"Sohu","url":"https://www.sohu.com/a/546129638_105999","title":"千厮门大桥下新建的江北嘴江滩公园，成了拍摄洪崖洞夜景的绝佳处","author":"寰驽斋主","date":"2022-05-12","likes":"","stance":"for","says":"Photographer walked down stone steps from the car park, found a quiet patch, set up a tripod; bridge and theatre lit about 20:00."},{"ref":"S4 · web research","platform":"Web","platformName":"Sohu","url":"https://www.sohu.com/a/788805026_586102","title":"重庆洪崖洞游玩攻略：洪崖洞几点开灯？要门票吗？附夜景拍照机位+景点介绍","author":"嗨周末","date":"2024-06-27","likes":"","stance":"mixed","says":"Lists the Grand Theatre riverside park as a night position but warns of many paid-photo touts; about 6 minutes from the station."},{"ref":"S5 · web research","platform":"Web","platformName":"NetEase (163.com)","url":"https://c.m.163.com/news/a/I9KFF2UO0544DQ5F.html","title":"解锁洪崖洞两岸，免费拍照机位攻略","author":"aDe游摄天下","date":"2023-07-14","likes":"","stance":"for","says":"Pebble bank by the Grand Theatre frames bridge and Hongyadong together; Exit 2 then 保定门; many vendors and photographers; bridge lights off 22:30."},{"ref":"S6 · web research","platform":"Web","platformName":"Sina News","url":"https://www.sina.cn/news/detail/5292069779935616.html","title":"重庆纪行：洪崖洞拍摄机位全覆盖","author":"武汉老羊倌","date":"2026-04-26","likes":"","stance":"for","says":"Bridge railings and Hongyadong ground floor were packed; went down to the Grand Theatre bank for the frontal view; bridge lights off 22:00."},{"ref":"S7 · web research","platform":"Web","platformName":"Sohu","url":"https://www.sohu.com/a/1089060488_121106884","title":"注意！洪崖洞开关灯时间变更！","author":"川渝本地消息","date":"2026-10-17","likes":"","stance":"neutral","says":"From 17 October 2026 Hongyadong is lit 18:30 to 23:00, timed to follow sunset."},{"ref":"S8 · web research","platform":"Web","platformName":"ifeng.com","url":"https://i.ifeng.com/c/8xJeR9rec6k","title":"注意！洪崖洞开关灯时间有调整","author":"","date":"2026-10-18","likes":"","stance":"neutral","says":"Confirms the new Hongyadong lighting period of 18:30 to 23:00 starting 17 October 2026."},{"ref":"S9 · web research","platform":"Web","platformName":"Gaisma","url":"https://www.gaisma.com/en/location/chongqing.html","title":"Chongqing, China - Sunrise, sunset, dawn and dusk times, table","author":"","date":"2026-11-15","likes":"","stance":"neutral","says":"Mid-November Chongqing: sunset 17:58, dusk 18:23; a week later 17:56 and 18:21."},{"ref":"S10 · web research","platform":"Web","platformName":"Chongqing Bendibao","url":"http://cq.bendibao.com/xiuxian/20261029/168679.shtm","title":"2026重庆无人机表演11月最新消息","author":"","date":"2026-10-29","likes":"","stance":"neutral","says":"Regular drone shows on Saturdays 7, 14, 21, 28 November at 20:30; specials on 6, 12, 20, 22 November; Jiangbeizui park is a listed viewpoint."},{"ref":"S11 · web research","platform":"Web","platformName":"Chongqing Bendibao","url":"http://cq.bendibao.com/xiuxian/202547/151590.shtm","title":"2026重庆无人机表演最佳观看地点（附交通路线）","author":"","date":"2026-11-13","likes":"","stance":"mixed","says":"Jiangbeizui side (theatre terrace, riverside park, Exit 3-1) has fewer people but a side-on angle that weakens some patterns."},{"ref":"S12 · web research","platform":"Web","platformName":"chongqing.guide","url":"https://chongqing.guide/zh-Hant/guides/chongqing-drone-show/","title":"重慶無人機表演：時間表、今日場次與2026年11月安排","author":"","date":"2026-11-15","likes":"","stance":"neutral","says":"Shows 21 and 28 November run 20:30-20:50; 20 and 22 November times pending; expect crowd control and metro queues afterwards."},{"ref":"S13 · web research","platform":"Web","platformName":"Sina Finance (重庆发布)","url":"https://finance.sina.cn/2026-05-04/detail-inhwtewk9990124.d.html?vt=4","title":"太好逛，超出片！重庆两江四岸6处打卡地，走起→","author":"重庆发布","date":"2026-05-04","likes":"","stance":"for","says":"City government account: park runs about 6 km along Beibin Road east of the Grand Theatre; Line 6, Exit 1, short walk."},{"ref":"S14 · web research","platform":"Web","platformName":"The Paper (Chongqing Daily reprint)","url":"https://www.thepaper.cn/newsDetail_forward_19201435","title":"重庆江滩消落区如何二度变身网红打卡地？","author":"","date":"2022-07-27","likes":"","stance":"neutral","says":"Park sits in the reservoir drawdown zone; ground below 175 m floods seasonally and the lowest trail is exposed only in spring and summer."},{"ref":"S15 · web research","platform":"Web","platformName":"Dianping","url":"https://m.dianping.com/discovery/650589526","title":"重庆暑假游攻略🔥洪崖洞新旧机位大盘点","author":"Drinky小键键","date":"2021-07-09","likes":"","stance":"for","says":"Jiangbeizui bank gives reflections; riverbed walkable February to May; under the bridge suits a 14mm lens; telephoto from the station exit."},{"ref":"S16 · web research","platform":"Web","platformName":"TravelChinaGuide","url":"https://www.travelchinaguide.com/cityguides/chongqing/weather-november.htm","title":"Chongqing Weather in November","author":"","date":"","likes":"","stance":"neutral","says":"November is mostly overcast with misty mornings, drizzle that leaves steps slippery, and night lows around 10-12°C."},{"ref":"S17 · web research","platform":"Web","platformName":"Douyin","url":"https://www.douyin.com/shipin/7373112029944580150","title":"江北大剧院怎么下江滩-抖音","author":"","date":"","likes":"","stance":"neutral","says":"Route videos, many by guides and photographers: Line 6 Exit 1, cross the road, stairs down through an archway, turn left to the river."},{"ref":"S18 · web research","platform":"Web","platformName":"Chongqing Bendibao","url":"https://m.cq.bendibao.com/traffic/64979.sh Y"}},{"page":"extra","from":"web research, 17 Nov","what":{"t":"A terraced hillside of hotpot tables on the back of Nanshan, reached by car only: you go for the lit-up slope and the scale, not for a skyline panorama or the best pot in town. It works on a midweek November evening (no queue reported on weekdays) provided you take a low terrace, because every table is up flights of steps with no lift.","r":["S5","S6","S8","S9"]},"good":[{"t":"Midweek it is easy: a Thursday-evening visitor (Apr 2025) found no wait at all, and a Jan 2026 visitor walked in without booking and was seated straight away.","r":["S5","S2"]},{"t":"It is not all open air. A Jan 2026 visitor was offered indoor or outdoor seating, open tables sit under giant umbrellas, there are roofed pavilions, and 2020 comments mention private rooms with air-conditioning higher up.","r":["S2","S6","S15","S22"]},{"t":"Foreign visitors report an English menu, patient staff and quick service off-peak (food in about 15 minutes); you order by marking a paper menu and handing it over.","r":["S2","S5"]},{"t":"The broth and fresh offal get better marks than the 'mid' verdict suggests: fresh duck blood, fresh tripe, duck intestine, coriander meatballs and brown-sugar rice cakes are the dishes named again and again.","r":["S3","S20","S12"]},{"t":"Split 鸳鸯 pot with a clear side is available, and there is soy milk, sweet jelly and a sesame-oil dip to take the edge off the heat.","r":["S12","S5","S17"]},{"t":"The record is real and dated: Guinness lists 5,851 seats as of 26 July 2022. Table counts vary by source: 888 (2023, 2025 articles) against 700-odd (2020, 2024 Chinese reports).","r":["S1","S16","S19","S18","S23"]}],"bad":[{"t":"Steps are the real cost for tired legs: the lowest tables are one to two storeys up, the top ones five to six, with no lift and (one Jan 2026 reviewer) poor handrails. Entrance to table is quoted at ten minutes, up to thirty for the far terraces.","r":["S6","S5","S13","S16"]},{"t":"What glows is mostly the venue itself. Several write-ups promise the city skyline from the upper terraces, one 2026 guide says it is not a view restaurant at all, and no source says which way the terraces face, so do not bank on a river-and-towers panorama.","r":["S19","S18","S17","S9"]},{"t":"Google Maps misleads: the listing at 黄桷渡 136 (by the 江南游乐园 in 南坪, which is where a sister branch is said to be) is not the hill, and two visitors (Nov 2025, Jan 2026) say the Google pin sent them wrong. Navigate by the Chinese name in Amap or Didi.","r":["S6","S2","S10"]},{"t":"A tour-group stop: one Oct 2025 reviewer found it built for photos, with a menu heavy on offal; another calls the setting bare and the decor tacky. Service and delivery slow down at peak because every dish is carried up the stairs.","r":["S5","S6","S10","S15"]},{"t":"Mosquitoes on the hillside (a Nov 2026 article still says bring repellent) and wind on the terraces after dark; live music plus table-side song requests make it loud.","r":["S14","S13","S5","S15"]},{"t":"Weekends are a different place: car park full, traffic jams on the mountain road, queues of 40-plus tables reported (2023) and waits over 40 minutes after 6 pm. None of that should apply on a Tuesday or Wednesday in November.","r":["S2","S4","S17"]}],"tips":[{"t":"Timing for a 17:57 sunset: leave the Sheraton by about 16:30 (16:45 at the latest) to be at a table around 17:15-17:30, which is what visitors advise. No source gives the minute the lights switch on, only 'at dusk'. If you are already past that today, the lights are the show anyway, so going after dark loses only the twilight changeover; otherwise keep it for tomorrow.","r":["S6","S17","S21"]},{"t":"Getting there: Didi or taxi is the only sensible way. No source gives a fare from 南滨路; from Jiefangbei visitors quote about 30 minutes and ¥21-35, and your hotel is on the same side of the river. Type 枇杷园食为鲜火锅(南山总店) as the destination; listings give the address as 黄金公路, opposite 龙井超市 (also written 文峰正街老厂金竹村).","r":["S13","S2","S3","S4","S8","S11"]},{"t":"Getting back: order the Didi from the entrance when you finish; a Jan 2026 visitor got one to the centre for ¥35 without trouble (the app asked for the last four digits of the phone number and for the pick-up to be set to the current spot). Older comments also say cars are easy to find here.","r":["S2","S8","S15"]},{"t":"Skip the bus: it is Line 3 to 四公里, then bus 380 or 383 to 窝子沟 and a 700 m walk before the stairs even start.","r":["S12","S3"]},{"t":"Where to sit with tired legs: ask at the entrance for a low terrace, or for the 2nd-3rd floor of the curved building on the right as you face the garden, which one guide says has the best look across the lit slope. The top terraces are the widest view but the longest climb; pavilion seats go first.","r":["S9","S7","S14","S15"]},{"t":"Booking: not needed midweek, but a call costs nothing: 023-62483138 is the booking line given by several guides and by the Google listing; Ctrip also shows mobiles 177-8205-2975 and 199-2293-3678. Pavilions and private rooms are the ones that need reserving. No mini-programme booking turned up in my search.","r":["S8","S9","S5","S2","S22"]},{"t":"Hours disagree: 09:00-24:00 on Trip.com/Ctrip and in a Nov 2025 blog (which matches your IG note), 10:00-22:00 on a listing updated Nov 2026, 10:00-23:00 and 11:00-01:00 elsewhere. Lunch is served on any of them; nobody states a last-order time, so do not plan to arrive after about 20:30 without phoning.","r":["S4","S3","S7","S10","S17","S20"]},{"t":"Budget ¥100-160 a head: listings say ¥114-115, one Apr 2025 couple paid ¥450 for two. Only one source prices the menu (Nov 2025): spicy broth ¥70, marbled beef ¥48, tofu pudding ¥10, rice cakes ¥28 in another post, and a ¥138 conveyor-belt buffet that also suits a solo diner. Dip and tea charges are not published; check the printed menu.","r":["S3","S10","S5","S7","S13","S21","S8"]},{"t":"Order the 鸳鸯 pot and say 微辣: one Dec 2025 visitor found the red side very numbing while a Nov 2025 blogger found it tamer than expected, so start low. Trip.com lists mobile payment and cards as accepted; have Alipay or WeChat ready.","r":["S6","S7","S12","S4"]},{"t":"Bring a jacket and repellent, wear shoes with grip for the stone steps, and if it is raining ask for a covered pavilion or an indoor table rather than an umbrella table.","r":["S13","S14","S2","S6"]}],"refmap":{"S1":"https://www.guinnessworldrecords.com/world-records/547490-largest-hotpot-restaurant-seat-capacity","S2":"https://you.ctrip.com/food/chongqing158/337657-dianping.html","S3":"https://gs.ctrip.com/html5/you/foods/Chongqing158/337657.html","S4":"https://www.trip.com/restaurant/china/chongqing/detail/pipayuan-372387/","S5":"https://wanderlog.com/place/details/6276181/shiweixian-hot-pot","S6":"https://wanderlog.com/place/details/7369133/pi-pa-yuan-shi-wei-fresh-hotpot","S7":"https://thetravelintern.com/chongqing-itinerary-first-timers/","S8":"https://chongqing.guide/en/guides/best-hotpot-restaurants/","S9":"https://www.chinahighlights.com/chongqing/top-hotpot-restaurants.htm","S10":"https://www.cnpp100.com/shop/20300.html","S11":"https://m.map.360.cn/?pid=9f29260c4875c3c9","S12":"https://www.topchinatravel.com/china-food-restaurant/the-best-hot-pot-restaurants-in-chongqing.htm","S13":"https://www.trip.com/moments/poi-pipayuan-372387/","S14":"https://www.sina.cn/a/article/niyrprm0704579.html","S15":"http://m.lythw.com/chongqing/g9963.html","S16":"https://www.odditycentral.com/?p=78648","S17":"https://dolphinunion.com/post/chongqing-thematic-hotpot-shops-9-unique-spots-by-environment/","S18":"https://www.canyin88.com/zixun/2020/11/28/82079.html","S19":"https://www.islands.com/1902163/pipa-yuan-hot-pot-chongqing-china/","S20":"https://opentravelguide.com/china/chongqing/chongqing/restaurants/pipa-garden-shiweixian-hot-pot/","S21":"https://notesfromchina.com/blog/chongqing-food-guide/","S22":"https://club.autohome.com.cn/bbs/thread/e09f4aa958fab7bc/55630349-1.html","S23":"https://finance.sina.com.cn/tech/roll/2024-07-12/doc-inccwkrx0850509.shtml"}}],"posts":[{"ref":"YT 13","platform":"YT","platformName":"YouTube","url":"https://www.youtube.com/watch?v=vNY433aVN4Y","title":"vlog｜🌟 重庆枇杷园震撼体验！全球最大火锅聚集地，夜晚灯光美得不真实，吃麻辣火锅听社牛大神深情演唱！🔥🍲🎶 整座山的火锅｜Chongqing｜China Travel｜小米丘…","author":"小米丘XiaoMiChu","date":"2025-03-27","likes":"21","stance":"for","says":"Vlog strongly recommends 枇杷园: world's largest hotpot cluster, whole mountain, dreamlike night lights, live singing."},{"ref":"TT 10","platform":"TT","platformName":"TikTok","url":"https://www.tiktok.com/@wdcq023/video/7692078392979590408","title":"A whole mountain dedicated to hotpot! 🏔️","author":"重庆Visual Guide (@wdcq023)","date":"2026-10-02","likes":"11,700","stance":"for","says":"Whole mountain given over to hotpot; calls the night view at Pi Pa Yuan astonishing."},{"ref":"IG 10","platform":"IG","platformName":"Instagram","url":"https://www.instagram.com/reel/DA62ey4hu4R/","title":"Known as the largest hot pot restaurant in the world, Pipa Yuan Shiweixian Hot P","author":"agirlsbelly","date":"2024-10-09","likes":"512","stance":"for","says":"Names Pipa Yuan Shiweixian as world's largest hotpot restaurant; popular, beautiful view, tasty food."},{"ref":"IG 14","platform":"IG","platformName":"Instagram","url":"https://www.instagram.com/reel/DXvGXfUBQth/","title":"Pipayuan hotpot restaurant is located at Nanshan Mountain in Chongqing","author":"chongqing001","date":"2026-04-30","likes":"30","stance":"neutral","says":"States Pipayuan hotpot restaurant sits on Nanshan Mountain."},{"ref":"IG 8","platform":"IG","platformName":"Instagram","url":"https://www.instagram.com/reel/DKrTpgRSYn7/","title":"SAVE THIS‼️ We went to the world’s BIGGEST hotpot restaurant in Chongqing, with","author":"onericeplease","date":"2025-06-09","likes":"1,229","stance":"mixed","says":"Not named; world's biggest, 5,851 seats, Huangjin Road address, 9am-12mn; reserve in summer; outdoors; food mid."},{"ref":"IG 2","platform":"IG","platformName":"Instagram","url":"https://www.instagram.com/reel/DPs2jKBjojr/","title":"The world's largest hotpot restaurant🔥🌶️","author":"chongqing001","date":"2025-10-12","likes":"2,180","stance":"neutral","says":"Not named; shows 'the world's largest hotpot restaurant'."},{"ref":"IG 35","platform":"IG","platformName":"Instagram","url":"https://www.instagram.com/reel/DBOngceyq2Q/","title":"world’s BIGGEST HOTPOT RESTAURANT 😱‼️","author":"belllelicious","date":"2024-10-17","likes":"4,241","stance":"for","says":"Not named; world's biggest hotpot restaurant, now a standard stop for tourists in Chongqing."},{"ref":"XHS 16","platform":"XHS","platformName":"Xiaohongshu","url":"https://www.rednote.com/discovery/item/6ad4b7b6000000001d02cafe?xsec_token=ABoN0gI18xJd_uhZprzWLDmBWpmwpbbNrUewdPSULtRyM=&xsec_source=pc_search&type=video","title":"地球上最大的火锅店，一整片山都在吃火锅🍲","author":"毛駄哥哥","date":"2026-10-18","likes":"46","stance":"for","says":"Not named; biggest hotpot shop on earth, a whole hillside eating hotpot; earthy yet upscale."},{"ref":"TT 7","platform":"TT","platformName":"TikTok","url":"https://www.tiktok.com/@clem.adl/video/7703438281391754516","title":"Had the chance to visit the biggest hotp","author":"Clem.adl (@clem.adl)","date":"2026-11-02","likes":"12","stance":"for","says":"Not named; visited 'the biggest hotpot' restaurant and found the scenery lived up to expectations."},{"ref":"S1 · web research","platform":"Web","platformName":"Guinness World Records","url":"https://www.guinnessworldrecords.com/world-records/547490-largest-hotpot-restaurant-seat-capacity","title":"Largest hotpot restaurant (seat capacity)","author":"","date":"2022-07-26","likes":"","stance":"neutral","says":"Official record: Pipa Yuan Shiweixian Hotpot Restaurant, Chongqing, 5,851 seats, set 26 July 2022."},{"ref":"S2 · web research","platform":"Web","platformName":"Ctrip","url":"https://you.ctrip.com/food/chongqing158/337657-dianping.html","title":"枇杷园食为鲜火锅(南山总店) 点评","author":"","date":"2026-01-04","likes":"","stance":"for","says":"Reviews: Jan 2026 walk-in seated, indoor or outdoor offered, Google pin wrong, Didi back ¥35; 2023 weekend queue of 40+ tables."},{"ref":"S3 · web research","platform":"Web","platformName":"Ctrip","url":"https://gs.ctrip.com/html5/you/foods/Chongqing158/337657.html","title":"重庆枇杷园食为鲜火锅(南山总店)攻略","author":"","date":"","likes":"","stance":"neutral","says":"Listing: 黄金公路 opposite 龙井超市, 09:00-24:00, about ¥114 a head, bus 383 窝子沟 stop 684 m away, signature dishes."},{"ref":"S4 · web research","platform":"Web","platformName":"Trip.com","url":"https://www.trip.com/restaurant/china/chongqing/detail/pipayuan-372387/","title":"PIPAYUAN (Nanping, Chongqing) - Restaurant reviews, menu & contact","author":"","date":"","likes":"","stance":"neutral","says":"Listing: 09:00-00:00, 文峰正街老厂金竹村 address, mobile payment and cards, parking, terrace and scenic seating; reviewers note weekend-night traffic jams."},{"ref":"S5 · web research","platform":"Web","platformName":"Wanderlog (Google reviews)","url":"https://wanderlog.com/place/details/6276181/shiweixian-hot-pot","title":"Shiweixian Hot Pot, Chongqing, China - Reviews, Ratings, Tips","author":"","date":"2026-06-03","likes":"","stance":"mixed","says":"Huangjin Road listing, phone 023-62483138: Thursday evening no wait, steep stairs, paper menu, ¥450 for two, conveyor-belt solo hotpot, touristy."},{"ref":"S6 · web research","platform":"Web","platformName":"Wanderlog (Google reviews)","url":"https://wanderlog.com/place/details/7369133/pi-pa-yuan-shi-wei-fresh-hotpot","title":"PI Pa Yuan Shi Wei Fresh Hotpot, Chongqing, China - Reviews, Ratings, Tips","author":"","date":"2026-04-22","likes":"","stance":"mixed","says":"黄桷渡 136 listing: reviewers say this pin is wrong; arrive about 17:30; giant umbrellas; long stairs, no lift, poor handrails."},{"ref":"S7 · web research","platform":"Web","platformName":"The Travel Intern","url":"https://thetravelintern.com/chongqing-itinerary-f nts in Chongqing 2026/2027","author":"","date":"","likes":"","stance":"for","says":"Metro Line 3 四公里 exit 2, bus 380 or 383 to 窝子沟, then 700 m on foot; evening queues; 鸳鸯 pot for non-spicy eaters."},{"ref":"S13 · web research","platform":"Web","platformName":"Trip.com Moments","url":"https://www.trip.com/moments/poi-pipayuan-372387/","title":"[2026 Chongqing Restaurant] PIPAYUAN Travel Guide & Travel Experiences","author":"","date":"","likes":"","stance":"for","says":"Traveller posts: about 30 min and ¥21 by taxi from Jiefangbei, no booking needed, ten-minute walk to table, windy, bring a jacket."},{"ref":"S14 · web research","platform":"Web","platformName":"Sina News","url":"https://www.sina.cn/a/article/niyrprm0704579.html","title":"重庆有哪些适合拍照打卡的火锅店？","author":"大健康笔记","date":"2026-11-14","likes":"","stance":"mixed","says":"Pavilion tables are the photo seats and go first; arrive early or ask about booking; bring mosquito repellent."},{"ref":"S15 · web research","platform":"Web","platformName":"重庆旅游 (lythw.com)","url":"http://m.lythw.com/chongqing/g9963.html","title":"重庆南山一棵树枇杷园火锅","author":"","date":"2020-12-23","likes":"","stance":"mixed","says":"2020 comments: higher private rooms have views and some have air-con; many stairs slow the food; taxis fine at weekends; paid song requests."},{"ref":"S16 · web research","platform":"Web","platformName":"Oddity Central","url":"https://www.odditycentral.com/?p=78648","title":"The World's Largest Hot Pot Restaurant Occupies Half a Hill, Can Serve Up to 5,800 People","author":"","date":"2023-05-10","likes":"","stance":"for","says":"888 tables; up to 30 minutes from car park to table; slow serving at peak; tables scarce without booking in spring and summer."},{"ref":"S17 · web research","platform":"Web","platformName":"Dolphin Union","url":"https://dolphinunion.com/post/chongqing-thematic-hotpot-shops-9-unique-spots-by-environment/","title":"Best Themed Hotpot Shops in Chongqing (2026)","author":"Hansong","date":"2026-04-17", area for over ten years","r":["XHS 1"]},{"t":"Big portion: one diner could not finish the pot","r":["XHS 2"]}],"bad":[],"tips":[{"t":"The soup pot costs 98 yuan","r":["XHS 1","XHS 2"]}],"refmap":{"XHS 1":"https://www.rednote.com/discovery/item/69df6ce9000000001b00096d?xsec_token=ABywZWaFbVNuOvQFe8oMqt0e5-Jb8MSn0KV_T5b89WLK8=&xsec_source=pc_search&type=video","XHS 2":"https://www.rednote.com/discovery/item/69a809020000000022032b74?xsec_token=ABLiy-XOk1pD5rqAXj3q_cZWCdN9pMl3gOXiAJjFQiB_I=&xsec_source=pc_search&type=video"}}],"posts":[{"ref":"XHS 2","platform":"XHS","platformName":"Xiaohongshu","url":"https://www.rednote.com/discovery/item/69a809020000000022032b74?xsec_token=ABLiy-XOk1pD5rqAXj3q_cZWCdN9pMl3gOXiAJjFQiB_I=&xsec_source=pc_search&type=video","title":"重庆居然有不辣的美食？","author":"旅行为了吃","date":"2026-03-04","likes":"2,276","stance":"for","says":"Names the shop by Qixinggang station Exit 2; spent 98 yuan and could not finish"},{"ref":"XHS 1","platform":"XHS","platformName":"Xiaohongshu","url":"https://www.rednote.com/discovery/item/69df6ce9000000001b00096d?xsec_token=ABywZWaFbVNuOvQFe8oMqt0e5-Jb8MSn0KV_T5b89WLK8=&xsec_source=pc_search&type=video","title":"重庆不辣美食合集","author":"张淑芬","date":"2026-04-15","likes":"2,836","stance":"for","says":"Qixinggang shop open over ten years; lotus root, rib and trotter pot for 98 yuan"}],"posNote":"at Qixinggang station. Posts say it is outside Exit 2","q":"landmark","areaShort":"In Qixinggang","where":"In Qixinggang 七星岗 · next to Qixinggang 七星岗 station · 2.6 km from your hotel. Distances are straight lines.","px":13377,"py":7746},{"id":"mx_laojundong","layers":["misc"],"en":"Laojun Cave Taoist Temple (Nanshan)","zh":"重庆老君洞道观","short":"Laojun Cave Temple","zhShort":"老君洞","amapq":"重庆老君洞","nonspicy":false,"n":18,"for":6,"against":0,"mixed":2,"notes":[{"page":"extra","from":"","what":{"t":"Chongqing's best-known Taoist temple (formal name 太极宫, Quanzhen Longmen lineage): red-walled halls stacked in a zigzag up a wooded cliff on Nanshan. It is free, and people go for incense, a pot of tea and the terrace views back across the Yangtze to Yuzhong.","r":["S5","S3","S7"]},"good":[{"t":"Free entry on every listing I checked, from 2023 guides to a Trip.com listing seen in November 2026, and a 2023 local guide says no reservation is needed.","r":["S3","S6","S7"]},{"t":"The upper terraces (南天门 platform and the 玉皇殿 / 玉皇楼 at the summit) look over the Yuzhong peninsula and the meeting of the two rivers; one visitor says Raffles City is in frame.","r":["S7","S8","S10","S9"]},{"t":"Photo material beyond the skyline: red walls, a spiral stone stair, the curved steps below 灵官殿 just inside the east gate, and wish plaques hung on old trees.","r":["S7","S8","S10"]},{"t":"A place to sit: the temple tea courtyard (老君洞茶院) serves covered-bowl tea facing the hills, and visitors mention a simple vegetarian set meal (about 28 yuan in an undated reader tip).","r":["S7","S8","S9"]},{"t":"Real age behind the paint: rebuilt in 1480, enlarged in 1574, handed to Taoists in the late Ming and revived in 1739; the main 三清殿 has a Ming stele and there are Ming rock carvings. Before that it was reportedly the Buddhist 广化寺.","r":["S5","S9","S13","S3"]},{"t":"Legend, not history: a 2026 travel essay repeats a Tang-era tale that the Laojun statue was carved after a local miracle, and another tradition calls the site a shrine to Yu the Great's wife 涂山氏. Single unverified sources for both.","r":["S10","S13"]},{"t":"Easy pairings on foot: 一棵树观景台 is about 200 m from the east gate, 黄桷垭老街 about 10 minutes, 涂山寺 about 26 minutes (walk times from a 2023 local guide).","r":["S10","S3"]}],"bad":[{"t":"Stairs are the whole design: 13 halls climb the cliff and the steps are steep and uneven. A March 2026 visitor ran out of legs before the summit, and several posts say wear shoes with grip.","r":["S10","S8","S18"]},{"t":"It shuts around 17:00, so there is no night view from inside. One Trip post telling you to arrive 17:30-18:30 for sunset contradicts every posted closing time; ignore it.","r":["S17","S7","S8"]},{"t":"Fog and haze are common in winter and can erase the skyline; the 南天门 shot only works on a clear day. Look across the river from the hotel before you commit.","r":["S14","S8"]},{"t":"Fortune sticks and readings cost money (10 yuan in older local guides, a donation in some posts), and visitors advise walking past freelance fortune-tellers near the entrance.","r":["S3","S8","S9"]},{"t":"Pilgrim crowds on the 1st and 15th of each lunar month, at Qingming and Zhongyuan, and on weekends; a quiet weekday morning is the opposite experience.","r":["S13","S8","S16"]},{"t":"Gate names trip up even the guides: one local page contradicts itself on whether cars reach the west gate, and sources disagree on which gate is highest. Do not rely on a driver knowing 'the top gate'.","r":["S4","S8","S10"]}],"tips":[{"t":"Tired-legs route: Didi to 老君洞西门停车场 (cars enter by the south gate next to 黄桷垭老街). From the car park it is roughly a 10-minute walk to the main halls with a short slope and a few stairs, not a climb.","r":["S3","S15","S4"]},{"t":"The top is extra whichever gate you use: a steep stone stair beside the 青牛 cliff leads up to 南天门 and the summit. Decide at 三清殿 whether the view is worth it today.","r":["S3","S9"]},{"t":"Hours disagree. Newest is the Trip.com listing (seen Nov 2026): 07:30-17:30, last entry 17:00. A local guide dated April 2025 says 8:00-17:00 with no entry after 17:00; others say 17:20 or 18:00; one visitor says entry stops 16:30. Be inside by 16:00 and check the board at the gate.","r":["S7","S17","S9","S19","S8"]},{"t":"Tickets: free, no booking. Incense is provided free inside (two undated visitor posts say three sticks at entry) and you may not bring your own, so skip any stall selling it outside.","r":["S6","S3","S8"]},{"t":"Bus if no car comes: 329, 346 or 347 to 崇文路口, then about 400 m on foot; from 上新街 metro (Line 6 / Loop) the 346 or 347 goes up. The east gate on 龙黄路 is the shortest walk from a stop.","r":["S9","S19","S4"]},{"t":"The 黄葛古道 walk up from 上新街 is about 2 km and half an hour to 黄桷垭老街 on wide, gently graded slabs, but the branch to the temple's west gate is all steps and fairly steep, about 35 minutes in total (2023 hiking notes). Not the way up for tired legs.","r":["S12","S11"]},{"t":"Walking down instead: nobody confirms a clean top-to-bottom route inside. The workable version is car to the west-gate car park, see the halls, then leave by the old west gate onto 黄葛古道, which is mostly downhill to 上新街.","r":["S4","S8","S11"]},{"t":"Getting back: no source gives a taxi time or fare from 南滨路, so check the Didi estimate. Parking is scarce up here; if no car accepts, walk 10 minutes to 黄桷垭老街 and call one there, or take the 346 / 347 down.","r":["S3","S12"]},{"t":"Allow 1.5 to 2 hours (listings say 1-3). Mornings are calmer than afternoons. For the lit-up skyline afterwards, 一棵树观景台 next door is 30 yuan and open 09:00-22:30 per a July 2026 list.","r":["S9","S16","S7","S20"]},{"t":"Etiquette: do not photograph the statues, cover your shoulders, step over door thresholds rather than on them, keep your voice down. Drones are not allowed on the hill.","r":["S9","S8","S13"]}],"refmap":{"S1":"http://xhslink.com/o/5rIabCM68aF","S2":"http://xhslink.com/o/26XdU5kLcw2","S3":"https://cq.bendibao.com/tour/20231011/135988.shtm","S4":"https://m.cq.bendibao.com/tour/135993.shtm","S5":"http://cq.bendibao.com/xiuxian/2023119/127201.shtm","S6":"https://m.cq.bendibao.com/tour/94594.shtm","S7":"https://ph.trip.com/moments/poi-laojun-cave-78172","S8":"https://hk.trip.com/moments/theme/poi-laojun-cave-78172-guides-993135/","S9":"https://chinatripedia.com/laojun-cave-taoist-temple-chongqing-ticket-price-opening-hours-transportation-and-highlights/comment-page-1","S10":"https://c.m.163.com/news/a/KN37IVKL0528NCP7.html","S11":"https://www.sohu.com/a/666161692_120550722","S12":"https://www.sohu.com/a/666159781_120550722","S13":"https://www.ichongqing.info/attraction/laojun-dong-taoist-temple/amp","S14":"https://wandervlogs.com/china/chongqing/laojun-cave","S15":"http://cq.bendibao.com/tour/20231011/135997.shtm","S16":"https://offpeaktrip.com/en/guide/chongqing/laojun-cave","S17":"http://cq.bendibao.com/tour/20231011/135992.shtm","S18":"https://chongqing.tianqi.com/news/f1m1m6HB6HNUQyyy.html","S19":"https://www.bkwk.cn/article/zqljdjtgljmqscysmdx-a19018768.html","S20":"https://m.cq.bendibao.com/xiuxian/157122.shtm"}}],"posts":[{"ref":"S1","platform":"XHS","platformName":"Xiaohongshu","url":"http://xhslink.com/o/5rIabCM68aF","title":"Saved Xiaohongshu post (could not be opened)","author":"","date":"","likes":"","stance":"neutral","says":"Saved by you; the page could not be read from here."},{"ref":"S2","platform":"XHS","platformName":"Xiaohongshu","url":"http://xhslink.com/o/26XdU5kLcw2","title":"Saved Xiaohongshu post (could not be opened)","author":"","date":"","likes":"","stance":"neutral","says":"Saved by you; the page could not be read from here."},{"ref":"S3","platform":"Web","platformName":"Bendibao (重庆本地宝)","url":"https://cq.bendibao.com/tour/20231011/135988.shtm","title":"重庆老君洞旅游攻略（开放时间+门票+路线+周边景点）","author":"","date":"2023-10-11","likes":"","stance":"for","says":"Free, 8:00-17:00, no booking, free incense inside; taxi to west-gate car park then 10-minute walk; nearby sights with walk times."},{"ref":"S4","platform":"Web","platformName":"Bendibao (重庆本地宝)","url":"https://m.cq.bendibao.com/tour/135993.shtm","title":"重庆老君洞从哪个门进？","author":"","date":"2023-10-11","likes":"","stance":"neutral","says":"Describes west, east and south gates, which suits drivers, bus riders and hikers; inconsistent on car access to the west gate."},{"ref":"S5","platform":"Web","platformName":"Bendibao (重庆本地宝)","url":"http://cq.bendibao.com/xiuxian/2023119/127201.shtm","title":"2025重庆老君洞开放时间+位置","author":"","date":"2025-04-07","likes":"","stance":"neutral","says":"Hours 8:00-17:00, address 老君坡29号, Quanzhen Longmen temple; rebuilt 1480, expanded 1574, revived 1739."},{"ref":"S6","platform":"Web","platformName":"Bendibao (重庆本地宝)","url":"https://m.cq.bendibao.com/tour/94594.shtm","title":"重庆老君洞门票多少钱一张","author":"","date":"2025-04-07","likes":"","stance":"neutral","says":"Admission is free; open 8:00-17:00; fortune sticks are an optional activity."},{"ref":"S7","platform":"Web","platformName":"Trip.com","url":"https://ph.trip.com/moments/poi-laojun-cave-78172","title":"Laojun Cave: Trip Moments listing and visitor posts","author":"various Trip.com users","date":"2026-10-24","likes":"","stance":"for","says":"Listing: free, 07:30-17:30, last entry 17:00, 1-3 hours. Posts praise summit views, tea house, red walls; warn of many steps."},{"ref":"S8","platform":"Web","platformName":"Trip.com","url":"https://hk.trip.com/moments/theme/poi-laojun-cave-78172-guides-993135/","title":"2026 老君洞遊玩指南推薦","author":"various Trip.com users","date":"2026-11-16","likes":"","stance":"mixed","says":"Visitor guides: taxi to west gate, three free incense sticks, no statue photos, no drones, busy lunar 1st/15th, grippy shoes; closing times conflict."},{"ref":"S9","platform":"Web","platformName":"ChinaTripedia","url":"https://chinatripedia.com/laojun-cave-taoist-temple-chongqing-ticket-price-opening-hours-transportation-and-highlights/comment-page-1","title":"Laojun Cave Taoist Temple, Chongqing - Ticket Price, Opening Hours, Transportation, and Highlights","author":"Neal","date":"2025-03-17","likes":"","stance":"for","says":"Free, 8:00-18:00 with last entry 17:00, about 2 hours; buses to 崇文路口; steep stair to summit; etiquette and meal tips."},{"ref":"S10","platform":"Web","platformName":"NetEase (网易)","url":"https://c.m.163.com/news/a/KN37IVKL0528NCP7.html","title":"重庆行记19｜烟火藏道：老君洞漫记","author":"林海看世态","date":"2026-03-16","likes":"","stance":"for","says":"Personal essay: walked 200 m from 一棵树 to the east gate, found the steps steep and tiring, skipped the summit; retells a statue legend."},{"ref":"S11","platform":"Web","platformName":"Sohu","url":"https://www.sohu.com/a/666161692_120550722","title":"重庆南山入门登山攻略｜上新街·老君洞步道","author":"见道","date":"2023-04-14","likes":"","stance":"neutral","says":"Trail from 上新街 to the temple's west gate: about 35 minutes, all steps, fairly steep; east gate is 10 minutes further."},{"ref":"S12","platform":"Web","platformName":"Sohu","url":"https://www.sohu.com/a/666159781_120550722","title":"重庆南山入门登山攻略｜上新街·黄葛古道","author":"见道","date":"2023-04-13","likes":"","stance":"neutral","says":"黄葛古道 from 上新街 is about 2 km, half an hour to 黄桷垭老街 on gentle slabs; buses 346/347 from the top."},{"ref":"S13","platform":"Web","platformName":"iChongqing","url":"https://www.ichongqing.info/attraction/laojun-dong-taoist-temple/amp","title":"Laojun Dong Taoist Temple","author":"Jieyu Wang","date":"","likes":"","stance":"neutral","says":"History from Ming rebuilds to the 1739 revival; possible earlier Buddhist temple or Tushan shrine; busiest lunar 1st/15th, Qingming, Zhongyuan; keep quiet."},{"ref":"S14","platform":"Web","platformName":"WanderVlogs","url":"https://wandervlogs.com/china/chongqing/laojun-cave","title":"Laojun Cave Travel Vlogs, Authentic Tips & FAQs","author":"","date":"2025-12-16","likes":"","stance":"mixed","says":"Summarises a February 2025 vlog: steep staged climb, views of the Yangtze and Yuzhong towers, fog common in winter."},{"ref":"S15","platform":"Web","platformName":"Bendibao (重庆本地宝)","url":"http://cq.bendibao.com/tour/20231011/135997.shtm","title":"重庆老君洞不用爬坡攻略（从哪个大门+路线）","author":"","date":"2025-04-07","likes":"","stance":"for","says":"To avoid climbing, go by taxi or bus to the west gate; 10-15 minutes on foot with a short slope and some stairs."},{"ref":"S16","platform":"Web","platformName":"OffPeakTrip","url":"https://offpeaktrip.com/en/guide/chongqing/laojun-cave","title":"Laojun Cave Travel Guide","author":"","date":"","likes":"","stance":"neutral","says":"Free, 07:30-17:00, about 1.5 hours; usually uncrowded, quietest on weekday mornings, busier on weekends and holidays."},{"ref":"S17","platform":"Web","platformName":"Bendibao (重庆本地宝)","url":"http://cq.bendibao.com/tour/20231011/135992.shtm","title":"重庆老君洞几点关门？","author":"","date":"2025-04-07","likes":"","stance":"neutral","says":"Open daily 8:00-17:00; visitors are generally not let in after 17:00; no night opening mentioned."},{"ref":"S18","platform":"Web","platformName":"Tianqi.com","url":"https://chongqing.tianqi.com/news/f1m1m6HB6HNUQyyy.html","title":"重庆老君洞游玩攻略 开放时间及交通指南一览","author":"","date":"2023-10-11","likes":"","stance":"for","says":"Free, 8:00-17:00; 13 halls wind up the cliff from the mountain gate to the peak; buses 329/346/347 to 崇文路口."},{"ref":"S19","platform":"Web","platformName":"Bkwk (百科文库)","url":"https://www.bkwk.cn/article/zqljdjtgljmqscysmdx-a19018768.html","title":"重庆老君洞：交通攻略揭秘，轻松畅游神秘洞穴","author":"","date":"2025-03-16","likes":"","stance":"neutral","says":"Metro to 上新街 then bus 346, or buses 329/346/347 to 崇文路口; gives entry hours 07:30-17:20, free admission."},{"ref":"S20","platform":"Web","platformName":"Bendibao (重庆本地宝)","url":"https://m.cq.bendibao.com/xiuxian/157122.shtm","title":"2026重庆15个赏夜景好去处（开放时间+地点+购票）","author":"","date":"2026-07-29","likes":"","stance":"neutral","says":"Does not cover the temple; lists neighbouring 一棵树观景台 at 30 yuan, open 09:00-22:30, for the Yuzhong night view."}],"posNote":"from a Google Maps listing named 老君洞道观, which matches the earlier lookup; the gates and the west-gate car park sit a few hundred metres from the pin","q":"listing","areaShort":"Near Yikeshu viewpoint","where":"Near Yikeshu viewpoint 一棵树观景台 · 1.0 km from Shanghao 上浩 station · 1.7 km from your hotel. Distances are straight lines.","px":17337,"py":9051},{"id":"mx_ole","layers":["misc"],"en":"Ole' Premium Supermarket (Jiefangbei, Times Square B1)","zh":"Ole精品超市(解放碑步行街店)","short":"Ole' Supermarket","zhShort":"Ole精品超市","amapq":"Ole精品超市(解放碑步行街店)","nonspicy":false,"n":37,"for":5,"against":0,"mixed":1,"notes":[{"page":"extra","from":"","what":{"t":"China Resources' (华润万家) premium supermarket in the basement of 重庆时代广场 Chongqing Times Square, 邹容路100号, right by the 解放碑 monument. Go for an unhurried, fixed-price shop for imported groceries, snacks and packaged food gifts in the middle of the pedestrian zone; it is not where the bargains are.","r":["S1","S2","S3","S10","S30"]},"good":[{"t":"Dead centre: it shares a building with the luxury mall on the pedestrian street, Apple's 解放碑 store is next door at 邹容路108号, and the same metro exit (临江门 D) also serves 国泰艺术中心, 新世纪百货 and the bookshop 重庆书城.","r":["S2","S28","S4"]},{"t":"Strong on imported and hard-to-find food. An old expat guide (about 2015) singled out truffles, whole premium hams and high-end cookware here; the chain (120-plus stores) still trades on imports and, increasingly, its own brands.","r":["S2","S13","S11"]},{"t":"Shelf prices are fixed and labelled, which sidesteps the scenic-area souvenir traps local guides warn about (blended 'fresh-cut' hotpot base, 磁器口 麻花 at double or triple the workshop price). That advice is about supermarkets in general, not Ole specifically.","r":["S14","S15"]},{"t":"Travellers do use it as a snack stop: one Tripadvisor visitor to 解放碑 wrote of stocking up on snacks at Ole (October 2020, so pre-2025 and a single voice).","r":["S27"]},{"t":"Bakery and ready-to-eat are an Ole strength elsewhere: a 2017 local comparison loved the bakery (豆乳盒子) and deli salads at the 万象城 branch, and 2026 chain reports push own-brand chilled juice and bread. Nothing I found confirms what the counters at this branch offer now.","r":["S26","S11"]},{"t":"Good pairing with dessert: a 满记甜品 is listed on the same B1 level of Times Square (undated listing).","r":["S36"]}],"bad":[{"t":"Premium pricing. Two undated Google Maps reviews of this listing (read through the Places lookup, no page link) call prices several times higher than elsewhere and one found Cointreau at nearly double the Taobao price, with a thinner imported-spirits range than expected. Chain-wide price cuts in 2026 are reported only for upgraded stores such as Nanning.","r":["S11"]},{"t":"Not a Chongqing-speciality shop. No source I found names hotpot base, 小面 seasoning, 花椒, 合川桃片, 江津米花糖, 陈麻花, 怪味胡豆, local tea or craft beer at this branch, so treat local goods as a bonus. Benchmark: 桥头 hotpot base is about ¥25-28 in ordinary supermarkets and ¥18 at wholesale stalls.","r":["S14","S15"]},{"t":"Open status is not directly confirmed for 2026. The newest dated source naming this supermarket's hours is from December 2022; the mall itself was running promotions in September 2026, and Apple Maps and Trip.com (title marked updated 2025) still list the shop. Ole has been closing stores (count down about 16% by August 2026), though the closures I found named are in Wenzhou and Beijing, none in Chongqing. Check Amap or Dianping shows 营业中 before a special trip.","r":["S6","S37","S7","S9","S10","S11","S12"]},{"t":"Hotpot base and flights: sources disagree, so check before packing. One English guide says base must be checked; a 2019 self-published piece says small sealed solid blocks can be carried on but liquid base cannot; 2025 airport-security advice on specialities says factory vacuum packs with no free liquid may go in the cabin while oily items belong in the hold, sealed against leaks. The checked bag is the safe choice.","r":["S17","S20","S19"]},{"t":"Trains: I found no rule naming hotpot base, so check before packing. What a February 2026 rail report does say is that self-heating hotpot and self-heating rice cannot be carried, so skip those if going home by train.","r":["S21"]},{"t":"Do not count on a tax refund here. The August 2026 batch of Chongqing refund shops lists a Xiaomi store on the same B1 level but no Ole or supermarket (earlier batches not seen). A visitor guide puts the threshold at ¥500 in a single store, with about 11% back, claimed at the airport on departure.","r":["S24","S17"]}],"tips":[{"t":"Paste Ole精品超市(解放碑步行街店) into Amap or Didi; the address is 渝中区邹容路100号 重庆时代广场 B1 (basement units are numbered LG). Pick this branch name carefully: Chongqing has other Ole stores, including 来福士 at 朝天门, 万象城 at 谢家湾 and 星光68 at 观音桥; one undated listing counts five in the city.","r":["S7","S8","S3","S1","S16","S35"]},{"t":"From the monument: by Google's coordinates the mall is roughly 100-150 m to the north. A 2020 mall notice described the walk-in entrance then in use as door 4, at the Ole' porch, so that is the door to look for; from the car park (B3) it sent drivers up by lift to L1 and down again by escalator. Any mall door plus an escalator down to B1 should also work.","r":["S1","S3"]},{"t":"Metro: 临江门 (Line 2) exit D has a passage through 重庆时代广场, which is the shortest approach. 较场口 exit 3 and 小什字 exits 1 or 6 are also walkable, per a visitor guide.","r":["S4","S18"]},{"t":"Hours: the mall is 10:00-22:00 (December 2025). The supermarket itself was given as 10:00-22:00 in an old expat guide and 10:30-22:00 in a December 2022 notice, so arrive after 10:30 to be safe; no 2026 source for its own hours. 解放碑 is calmest before 11:00 and stays crowded until midnight, and the B1 atrium by the shops hosts pop-up exhibitions (one ran January-March 2025).","r":["S5","S6","S2","S18","S32"]},{"t":"What to look for: imported snacks, chocolate, wine and Ole's own-brand lines are the sure things. If local goods are on the shelf, the brands locals name are 桥头, 德庄 or 秋霞 hotpot base (¥15-40 a pack around town), 陈昌银 麻花, 三江 or 三民斋 桃片, 蝶花 怪味胡豆 and 乌江 榨菜. Those names come from souvenir guides, not from this shop.","r":["S16","S14","S15","S11"]},{"t":"Carry-on only? Favour dry goods: an airline guide calls 桃片 and beef jerky easy to carry, whereas oil-based hotpot base is the item security advice sends to the hold.","r":["S33","S19"]},{"t":"For quantity, buy elsewhere: a 2023 piece puts a Yonghui on the other side of 解放碑 and a 新世纪 supermarket at 英利 in between; guides quote 麻花 at about ¥38-58 in scenic areas against ¥15-18 at old workshops (per bag in one guide, per jin in the other). The official souvenir brand 渝伴礼 (hotpot base, 陈昌银麻花) had a flagship shop near the monument in 2025.","r":["S29","S14","S15","S31"]},{"t":"Payment: have Alipay or WeChat Pay set up with your foreign card. One visitor guide had cash refused at a convenience store and another says physical Visa and Mastercard are accepted only in limited places. Nothing I found covers this branch's card terminals or bag charges, so bring a tote. Olé's app gives members points, coupons and scan-and-pay in participating stores.","r":["S16","S17","S30"]},{"t":"Allow 30-45 minutes (my estimate, not from a source). Mall toilets are open in mall hours; the fixed 24-hour public toilet named in a December 2025 guide is at 八一路都邮巷. For bags, smart lockers went into 16 Yuzhong metro stations in 2026, 小什字 and 较场口 among them, and Times Square has a visitor service centre (2024; services not itemised). No source mentions lockers at the supermarket.","r":["S5","S22","S25"]},{"t":"From the Sheraton on 南滨路: Didi is simplest, about 5.5-6.5 km and 9-11 minutes on a hotel listing's estimate (not live traffic). By metro it is a 10-minute walk to 海棠溪 (Loop line), two stops to 上新街, then a change towards 小什字 and a walk of roughly 600 m by map coordinates; confirm the change in Amap.","r":["S23","S34","S18"]}],"refmap":{"S1":"https://m.cq.bendibao.com/gouwu/81251.shtm","S2":"https://www.echinacities.com/Chongqing/city-guide/Snacks-and-the-City-Where-to-Buy-Imported-Foodstuffs-in-Chongqing","S3":"https://m.city8.com/chongqing/shopping/7ycibu77c3lvb559c9","S4":"https://zh.wikipedia.org/wiki/临江门站","S5":"https://m.cq.bendibao.com/tour/149588.shtm","S6":"http://cq.bendibao.com/news/2022123/123614.shtm","S7":"https://maps.apple.com/place?_provider=57879&place-id=H2710I3F92678CAD031","S8":"https://m.tuniu.com/g2013952/around-shopping/","S9":"https://tw.trip.com/travel-guide/shops/chongqing/city-18180562/","S10":"https://c.m.163.com/news/a/KKAPLH6405445BQZ.html","S11":"https://www.sohu. ina","author":"","date":"","likes":"","stance":"neutral","says":"Live map listing under this exact branch name; page could not be opened, only its search-result title was seen."},{"ref":"S8","platform":"Web","platformName":"Tuniu (途牛)","url":"https://m.tuniu.com/g2013952/around-shopping/","title":"解放碑步行街附近购物","author":"","date":"","likes":"","stance":"neutral","says":"Lists Ole精品超市(解放碑步行街店) as a supermarket among shops around the pedestrian street; no address or reviews shown."},{"ref":"S9","platform":"Web","platformName":"Trip.com","url":"https://tw.trip.com/travel-guide/shops/chongqing/city-18180562/","title":"於 2 月前往Ole'精品超市(解放碑店)的血拼行程 (2025 已更新)","author":"","date":"","likes":"","stance":"neutral","says":"Shop listing whose title is marked updated for 2025; the page body would not load, so only the title was seen."},{"ref":"S10","platform":"Web","platformName":"NetEase (网易号)","url":"https://c.m.163.com/news/a/KKAPLH6405445BQZ.html","title":"2025年华润万家旗下超市关店清单（欢迎补充）","author":"中国零售信息","date":"2026-01-28","likes":"","stance":"neutral","says":"Crowd-compiled list of 2025 China Resources Vanguard closures: Ole' Wenzhou and Beijing stores named, no Chongqing store."},{"ref":"S11","platform":"Web","platformName":"Sohu","url":"https://www.sohu.com/a/1085587118_122041654","title":"贵族超市，也开始着急了","author":"久谦中台","date":"2026-10-09","likes":"","stance":"mixed","says":"Olé store count fell about 16% year on year by August 2026; upgraded stores cut prices and push own brands. No Chongqing detail."},{"ref":"S12","platform":"Web","platformName":"NetEase (网易号)","url":"https://www.163.com/dy/article/L79BL9CR0534UO9X.html","title":"太突然！温州市中心一大店关门","author":"","date":"2026-09-20","likes":"","stance":"neutral","says":"The Ole' closure reported for September 2026 is at Wenzhou Impression City; Chongqing is not mentioned."},{"ref":"S13","platform":"Web","platformName":"China.com (中华网)","url":"https://hea.china.com/articles/20250411/202504111659103.html","title":"业态优化而非收缩，2025年Olé将迎来全面升 -11-25","likes":"","stance":"neutral","says":"Metro exits for Jiefangbei (较场口 3, 小什字 1 and 6, 临江门 B and D); quietest 9:00-11:00, crowds until midnight."},{"ref":"S19","platform":"Web","platformName":"Xinhua (新华网)","url":"https://www.news.cn/politics/20250530/a1b172dfa634425fb48c3f0101a67ed5/c.html","title":"粽子等土特产能带上飞机吗？端午出行乘机提示快来get","author":"央视新闻客户端","date":"2025-05-30","likes":"","stance":"neutral","says":"Airport security advice: factory vacuum-packed specialities without free liquid may go in the cabin; oily items should be checked in leakproof packing."},{"ref":"S20","platform":"Web","platformName":"NetEase (网易号)","url":"https://c.m.163.com/news/a/E826RH2T05426WUZ.html","title":"回家返乡，火锅底料可以带上飞机吗？新手必看","author":"","date":"2019-02-15","likes":"","stance":"neutral","says":"Self-published 2019 piece: small amounts of sealed solid hotpot base can be carried on, liquid base must always be checked."},{"ref":"S21","platform":"Web","platformName":"Huanqiu (环球网)","url":"https://china.huanqiu.com/article/4QOL9spEpqs","title":"春节出游 行李携带有讲究","author":"央视网","date":"2026-02-16","likes":"","stance":"neutral","says":"High-speed rail luggage report: self-heating hotpot and self-heating rice cannot be carried because of their heating packs."},{"ref":"S22","platform":"Web","platformName":"Huanqiu (环球网)","url":"https://finance.huanqiu.com/article/4RH8gg3JItj","title":"新寄递服务助轻装出游","author":"人民日报","date":"2026-04-23","likes":"","stance":"neutral","says":"Smart luggage lockers installed at 16 busy Yuzhong metro stations, including 小什字 and 较场口; scan to store, no deposit."},{"ref":"S23","platform":"Web","platformName":"Hotels.com","url":"https://jp.hotels.com/ho475714/sheraton-zhong-qinghoteru-zhong-qing-xi-lai-deng-da-jiu-dian-chonchin-zhong-guo","title":"シェラトン重慶ホテル (重庆喜来登大酒店)","author":"","date":"","likes":"","stance":"neutral","says":"Sheraton listing: Jiefangbei 5.5-6.5 km and 9-11 minutes by car; 海棠溪 station about 0.9 km, a 10-minute walk."},{"ref":"S24","platform":"Web","platformName":"Esnai law library (中国会计视野)","url":"https://law.esnai.cn/view/234501/","title":"国家税务总局重庆市税务局关于公布第五批离境退税商店名单和“即买即退”商店名单的通告","author":"","date":"2026-08-19","likes":"","stance":"neutral","says":"Fifth batch of Chongqing tax-refund shops includes a Xiaomi store on Times Square B1; no Ole or supermarket in this batch."},{"ref":"S25","platform":"Web","platformName":"NetEase (网易号)","url":"https://www.163.com/dy/article/JJNR1HHE05158BF0.html","title":"重庆人气最旺TOP3商场易主，排名大幅变动！","author":"","date":"2024-12-18","likes":"","stance":"neutral","says":"Times Square opened in 2011 (Wharf group), has a visitor service centre with free services on showing a ticket or ID."},{"ref":"S26","platform":"Web","platformName":"Sohu","url":"https://m.sohu.com/a/169420177_349082/?pvid=000115_3w_a","title":"暴走五家超市，我们终于找到了最适合重庆人的购物攻略！","author":"吃喝玩乐在重庆","date":"2017-09-04","likes":"","stance":"for","says":"2017 comparison visiting the 万象城 Ole': praises bakery (豆乳盒子), deli salads, unusual drinks and vegetables. Not the Jiefangbei branch."},{"ref":"S27","platform":"Web","platformName":"Tripadvisor","url":"https://www.tripadvisor.com/ShowUserReviews-g294213-d1814838-r969926621-Jiefangbei_Square-Chongqing.html","title":"Shopping street of Chongqing. Everything is here. - Review of Jiefangbei Square","author":"deanosaur89","date":"2020-10-09","likes":"","stance":"for","says":"A visitor to Jiefangbei mentions stocking up on snacks at the Ole supermarket."},{"ref":"S28","platform":"Web","platformName":"Apple","url":"https://www.apple.com.cn/cn/retail/jiefangbei/","title":"Apple 解放碑","author":"","date":"","likes":"","stance":"neutral","says":"Apple's Jiefangbei store is at 邹容路108号, open daily 10:00-22:00 (week of 16 Nov 2026)."},{"ref":"S29","platform":"Web","platformName":"NetEase (网易号)","url":"https://www.163.com/dy/article/I63PFGBT05355Z7R.html","title":"解放碑：重庆青年的购物往事！","author":"白衣海盗","date":"2023-05-31","likes":"","stance":"neutral","says":"Describes Jiefangbei supermarkets in 2023: Yonghui on one side, Ole on the other, a 新世纪 supermarket at 英利 in between."},{"ref":"S30","platform":"Web","platformName":"App Store","url":"https://apps.apple.com/app/id1260905835","title":"Ole lifestyle","author":"深圳市华润万家电子商务有限公司","date":"","likes":"","stance":"neutral","says":"Olé app: membership points usable as cash, sign-up coupons, member days, scan-and-pay in participating stores."},{"ref":"S31","platform":"Web","platformName":"NetEase (上游新闻)","url":"https://www.163.com/dy/article/KABA3MVL053469M5.html","title":"“渝伴礼”亮相2025解放碑国际消费节","author":"上游新闻","date":"2025-09-25","likes":"","stance":"neutral","says":"Official souvenir brand 渝伴礼 showed hotpot base and 陈昌银麻花 on the Jiefangbei cross streets and has a flagship shop nearby."},{"ref":"S32","platform":"Web","platformName":"Winshang (赢商网)","url":"https://m.winshang.com/news730860.html","title":"“影燃新生”火影忍者全剧集重庆首展于重庆时代广场正式开启","author":"","date":"2025-01-23","likes":"","stance":"neutral","says":"Times Square's B1 atrium hosted a Naruto exhibition and merchandise shop from January to March 2025."},{"ref":"S33","platform":"Web","platformName":"China Southern Airlines guide","url":"https://www.csair.com/h5/cn/guonei/chongqing/1bgv7c019jrlh.shtml","title":"Untitled (Chongqing souvenir guide page)","author":"","date":"","likes":"","stance":"neutral","says":"Undated airline guide: hotpot base about ¥15 per 200 g in city malls; 桃片 and beef jerky are easy to carry."},{"ref":"S34","platform":"Web","platformName":"Wikipedia (中文)","url":"https://zh.wikipedia.org/wiki/海棠溪站","title":"海棠溪站","author":"","date":"","likes":"","stance":"neutral","says":"海棠溪 is on the Loop line; 上新街 is two stops away with 上浩 in between."},{"ref":"S35","platform":"Web","platformName":"Anxjm (安心加盟网)","url":"https://m.anxjm.com/mendian/82959.html","title":"Ole'精品超市加盟店(全国|各省)分布图","author":"","date":"","likes":"","stance":"neutral","says":"Undated store-count page: five Ole' stores in Chongqing; gives the Raffles City one at 朝天门接圣街8号."},{"ref":"S36","platform":"Web","platformName":"Bendibao (重庆本地宝)","url":"https://cq.bendibao.com/wangdian/dian/4177896.shtm","title":"满记甜品(解放碑时代广场店)","author":"","date":"","likes":"","stance":"neutral","says":"Lists a 满记甜品 dessert shop on B1 of Times Square, 邹容路100号; undated."},{"ref":"S37","platform":"Web","platformName":"Sohu (重庆商机)","url":"https://www.sohu.com/a/1082347340_121106619","title":"“潮”这看，重庆解放碑金秋消费“购”燃！","author":"重庆商机","date":"2026-09-29","likes":"","stance":"neutral","says":"Times Square is named among Jiefangbei malls cutting prices during the 2026 consumption carnival; no mention of Ole."}],"posNote":"at Google Places' own listing for this branch (\"Ole' ... Jiefangbei Branch\", 邹容路100号); the shop is underground on B1 of 重庆时代广场 Chongqing Times Square, so the pin marks the building rather than a street door","q":"listing","areaShort":"In Jiefangbei","where":"In Jiefangbei 解放碑 · 300 m from Linjiangmen 临江门 station · 1.9 km from your hotel. Distances are straight lines.","px":14776,"py":7380}],"aboutHtml":"<ul><li>Each pin is a place the research posts name. The number on it is how many posts name it. <b>!<\/b> marks mixed reports and <b>×<\/b> marks places where more posts are against than for.<\/li><li>Pinned: places named by two or more posts, plus single-post places where the post gives a clear verdict and a findable address. Everything else is in the lists above.<\/li><li>A dashed ring and ≈ mean a rough position: only the hill or neighbourhood is known.<\/li><li>Other stops are places you asked to add. Their notes come from separate web research, and the number on the pin counts sources.<\/li><li>Notes are paraphrased from the five research pages (582 posts read across Xiaohongshu, Instagram, TikTok and YouTube, run 7 to 9 Nov 2026). Some clips were posted on two platforms and count twice. Prices and hours are whatever the post said on its date.<\/li><li>The map is drawn to scale from looked-up positions of bridges, stations and landmarks. River banks are approximate, metro lines run straight between stations, and roads are not drawn. Use it to see which area and which side of the river, then open Amap for the door.<\/li><li>Xiaohongshu links carry a token that expires. If one fails, search the post title in the app.<\/li><\/ul><div class=\"metro-key\"><span><i style=\"background:#d5283a\"><\/i>Line 1 1号线<\/span><span><i style=\"background:#1f8a4c\"><\/i>Line 2 2号线<\/span><span><i style=\"background:#2b4fa8\"><\/i>Line 3 3号线<\/span><span><i style=\"background:#e56b93\"><\/i>Line 6 6号线<\/span><span><i style=\"background:#8a2346\"><\/i>Line 9 9号线<\/span><span><i style=\"background:#6a3aa6\"><\/i>Line 10 10号线<\/span><span><i style=\"background:#c79a00\"><\/i>Loop Line 环线<\/span><span><i style=\"background:#2aa3d6\"><\/i>Line 5 5号线<\/span><span><i style=\"background:#159a93\"><\/i>Line 18 18号线<\/span><span><i style=\"background:#d9822b\"><\/i>Line 4 4号线<\/span><span><i style=\"background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 7px)\"><\/i>Cableway<\/span><\/div>"};</script>

  var gMetro = el('g', { 'class': 'l-metro', 'clip-path': 'url(#clipWorld)' }, world);

  // n corners alternating between radius ro and ri, first corner at rot degrees clockwise from straight up.

  function polyPath(n, ro, ri, rot) {

      }

      num.textContent = p.n;
      if (p.verdict !== 'good') {

  /* ---------- view ---------- */
  function mpp() { return 1 / S.k; }

  }
  var lastK = -1, raf = 0;
  function apply() {

      }

  }
  function draw() { if (!raf) raf = requestAnimationFrame(function () { raf = 0; apply(); }); }
  function fitBox(x0, y0, x1, y1, padB) {
    var pad = 18, hh = H - (padB || 0);
    var k = Math.min((W - 2 * pad) / (x1 - x0), (hh - 2 * pad) / (y1 - y0));
    S.k = Math.max(KMIN, Math.min(KMAX, k));
    S.tx = W / 2 - (x0 + x1) / 2 * S.k; S.ty = hh / 2 - (y0 + y1) / 2 * S.k;
    draw();
  }
  function zoomAt(cx, cy, f) {
    var k0 = S.k, k1 = Math.max(KMIN, Math.min(KMAX, k0 * f));
    var wx = (cx - S.tx) / k0, wy = (cy - S.ty) / k0;
    S.k = k1; S.tx = cx - wx * k1; S.ty = cy - wy * k1; draw();
  }
  var animGen = 0;
  function stopAnim() { animGen++; }   // a finger on the map takes over from a running animation
  function animateTo(k1, tx1, ty1) {
    var k0 = S.k, tx0 = S.tx, ty0 = S.ty, t0 = performance.now(), id = ++animGen;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { S.k = k1; S.tx = tx1; S.ty = ty1; draw(); return; }
    (function step(now) {
      if (id !== animGen) return;
      var t = Math.min(1, (now - t0) / 260), e = t * (2 - t);
      S.k = k0 + (k1 - k0) * e; S.tx = tx0 + (tx1 - tx0) * e; S.ty = ty0 + (ty1 - ty0) * e;

  function sheetCover() {

    var cx = (window.innerWidth >= 900 && !sheet.hidden) ? (W - 400) / 2 : W / 2;
    var cy = (H - cover) / 2;

    if (first) { var h = D.base.home; fitBox(h.x0, h.y0, h.x1, h.y1); } else draw();
  }

  /* scale bar */
  var scaleEl = document.getElementById('scalebar'), scaleTx = document.getElementById('scaletx');
  function updateScale() {

    scaleTx.textContent = m >= 1000 ? (m / 1000) + ' km' : m + ' m';
  }

  /* ---------- pin visibility and labels ---------- */
  function pinVisible(pn) {
    if (!active[pn.layer]) return false;
    if (pn.layer === 'food' && nonSpicyOnly && !pn.p.nonspicy) return false;
    // one pin per place: first active layer wins
    for (var i = 0; i < pn.p.layers.length; i++) {
      var L = pn.p.layers[i];
      if (active[L] && !(L === 'food' && nonSpicyOnly && !pn.p.nonspicy)) return L === pn.layer;
    }
    return false;
  }
  function refreshPins() {
    pins.forEach(function (pn) {
      pn.on = pinVisible(pn);
      pn.g.style.visibility = pn.on ? 'visible' : 'hidden';
      pn.g.classList.toggle('selected', !!selected && selected.id === pn.p.id);
    });
    scheduleLabels();
    updateCounts();
  }
  var labTimer = 0;
  function scheduleLabels() { clearTimeout(labTimer); labTimer = setTimeout(layoutLabels, 90); }
  function layoutLabels() {
    var placed = [], k = S.k, i, pn;
    var vis = pins.filter(function (x) { return x.on; });
    vis.forEach(function (x) { placed.push({ x0: x.p.px * k - x.r - 3, y0: x.p.py * k - x.r - 3, x1: x.p.px * k + x.r + 3, y1: x.p.py * k + x.r + 3, own: x }); });
    placed.push({ x0: D.hotel.x * k - 12, y0: D.hotel.y * k - 12, x1: D.hotel.x * k + 82, y1: D.hotel.y * k + 12, own: null });
    vis.sort(function (a, b) {
      var sa = (selected && selected.id === a.p.id) ? 1e6 : a.p.n, sb = (selected && selected.id === b.p.id) ? 1e6 : b.p.n;
      return sb - sa;
    });
    function hit(b, own) {
      for (var j = 0; j < placed.length; j++) {
        var q = placed[j]; if (q.own === own) continue;
        if (b.x0 < q.x1 && b.x1 > q.x0 && b.y0 < q.y1 && b.y1 > q.y0) return true;
      }
      return false;
    }
    for (i = 0; i < vis.length; i++) {
      pn = vis[i];
      if (!pn.w) { try { pn.w = pn.lt.getComputedTextLength() + 4; } catch (e) { pn.w = 80; } }
      var sx = pn.p.px * k, sy = pn.p.py * k, w = pn.w, h = pn.p.off ? 28 : 15, r = pn.r;
      var opts = [
        { dx: r + 6, dy: 4, a: 'start', b: { x0: sx + r + 4, y0: sy - 8, x1: sx + r + 8 + w, y1: sy - 8 + h } },
        { dx: -(r + 6), dy: 4, a: 'end', b: { x0: sx - r - 8 - w, y0: sy - 8, x1: sx - r - 4, y1: sy - 8 + h } },
        { dx: 0, dy: r + 15, a: 'middle', b: { x0: sx - w / 2, y0: sy + r + 4, x1: sx + w / 2, y1: sy + r + 4 + h } },
        { dx: 0, dy: -(r + 7), a: 'middle', b: { x0: sx - w / 2, y0: sy - r - 6 - h, x1: sx + w / 2, y1: sy - r - 5 } }
      ];
      var ok = null;
      for (var o = 0; o < opts.length; o++) { if (!hit(opts[o].b, pn)) { ok = opts[o]; break; } }
      var force = selected && selected.id === pn.p.id;
      if (!ok && force) ok = opts[0];
      if (ok) {
        pn.lab.style.display = '';
        var ts = pn.lab.querySelectorAll('text');
        for (var t = 0; t < ts.length; t++) { ts[t].setAttribute('x', ok.dx); ts[t].setAttribute('y', ok.dy + t * 12); ts[t].setAttribute('text-anchor', ok.a); }
        placed.push({ x0: ok.b.x0, y0: ok.b.y0, x1: ok.b.x1, y1: ok.b.y1, own: pn });
      } else pn.lab.style.display = 'none';
    }
    var names = {}; vis.forEach(function (x) { names[x.p.short] = 1; names[x.p.en] = 1; if (x.p.zhShort) names[x.p.zhShort] = 1; if (x.p.zh) names[x.p.zh] = 1; });
    areaLabs.forEach(function (a) {
      var ax = a.d.x * k, ay = a.d.y * k, b = { x0: ax - a.w / 2, y0: ay - 12, x1: ax + a.w / 2, y1: ay + 14 };
      var bad = !!names[a.d.en] || !!names[a.d.zh] || hit(b, null);
      a.g.style.opacity = bad ? 0 : 1;
      if (!bad && a.g.style.display !== 'none') placed.push({ x0: b.x0, y0: b.y0, x1: b.x1, y1: b.y1, own: a });
    });

    else if (ids.length >= 2) {

      g0 = { n: 2, k: S.k, tx: S.tx, ty: S.ty, d: Math.hypot(a.x - b.x, a.y - b.y) || 1, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    } else g0 = null;
  }
  svg.addEventListener('pointerdown', function (e) {
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    stopAnim();
    var eaten = lpEat === e.pointerId; lpEat = null;   // this press closed the layers panel: it may pan, but is not a tap
    var q = rel(e), now = performance.now(), prev = lastTap;
    pts[e.pointerId] = q; np = Object.keys(pts).length;
    lastTap = null; dz = null;
    if (np === 1) {
      tap = { x: q.x, y: q.y, t: now, ok: !eaten };
      if (!eaten && prev && now - prev.t <= DT_MS && Math.hypot(q.x - prev.x, q.y - prev.y) <= DT_PX) {
        tap.ok = false;
        dz = { id: e.pointerId, x: q.x, y: q.y, k: S.k, wx: (q.x - S.tx) / S.k, wy: (q.y - S.ty) / S.k, moved: false };
      }
    } else if (tap) tap.ok = false;
    snap();
  });
  svg.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = rel(e);
    var ids = Object.keys(pts);
    if (dz) {   // one-finger zoom: never pans
      if (e.pointerId !== dz.id) return;
      var q = pts[dz.id], dy = q.y - dz.y;
      if (!dz.moved && Math.hypot(q.x - dz.x, dy) > DZ_SLOP) dz.moved = true;
      if (dz.moved) {
        var kz = Math.max(KMIN, Math.min(KMAX, dz.k * Math.pow(2, dy / DZ_PX)));
        S.k = kz; S.tx = dz.x - dz.wx * kz; S.ty = dz.y - dz.wy * kz; draw();
      }
      return;
    }
    if (!g0) return;
    if (g0.n === 1 && ids.length === 1) {
      var p = pts[ids[0]];
      if (tap && Math.hypot(p.x - tap.x, p.y - tap.y) > 7) tap.ok = false;
      S.tx = g0.tx + (p.x - g0.x); S.ty = g0.ty + (p.y - g0.y); draw();
    } else if (g0.n === 2 && ids.length >= 2) {
      var a = pts[ids[0]], b = pts[ids[1]];
      var d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      var k = Math.max(KMIN, Math.min(KMAX, g0.k * d / g0.d));
      var wx = (g0.x - g0.tx) / g0.k, wy = (g0.y - g0.ty) / g0.k;
      S.k = k; S.tx = mx - wx * k; S.ty = my - wy * k; draw();
    }
  });
  function up(e) {
    if (!pts[e.pointerId]) return;
    var p = pts[e.pointerId]; delete pts[e.pointerId]; np = Object.keys(pts).length;
    if (dz && dz.id === e.pointerId) {
      var z = dz; dz = null;
      if (!z.moved && e.type === 'pointerup') {   // plain double-tap or double-click: one step in, around the tap
        var k1 = Math.min(KMAX, S.k * 2);
        animateTo(k1, z.x - z.wx * k1, z.y - z.wy * k1);
      }
    } else if (np === 0 && tap && tap.ok && performance.now() - tap.t < 600 && e.type === 'pointerup') {
      lastTap = { x: p.x, y: p.y, t: performance.now() };
      onTap(p.x, p.y);
      // If this tap raised the sheet over the spot, let a second tap through to the map for the double-tap window.
      if (!sheet.hidden) {
        sheet.style.pointerEvents = 'none'; clearTimeout(passT);
        passT = setTimeout(function () { sheet.style.pointerEvents = ''; }, DT_MS + 30);
      }
    }
    if (np === 0) tap = null;
    snap();
  }
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  // touch-action:none already stops browser double-tap zoom on the map; these cover older engines and in-app browsers.
  svg.addEventListener('touchstart', function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
  svg.addEventListener('dblclick', function (e) { e.preventDefault(); });
  svg.addEventListener('selectstart', function (e) { e.preventDefault(); });
  svg.addEventListener('contextmenu', function (e) { if (dz) e.preventDefault(); });
  svg.addEventListener('wheel', function (e) { e.preventDefault(); stopAnim(); var p = rel(e); zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0016)); }, { passive: false });
  function onTap(x, y) {
    var hits = [];
    pins.forEach(function (pn) {
      if (!pn.on) return;
      var sx = pn.p.px * S.k + S.tx, sy = pn.p.py * S.k + S.ty, d = Math.hypot(sx - x, sy - y);
      if (d <= pn.r + 9) hits.push({ pn: pn, d: d });
    });
    hits.sort(function (a, b) { return a.d - b.d; });
    if (hits.length === 1) return selectPlace(hits[0].pn.p, true);
    if (hits.length > 1) {
      if (hits[1].d - hits[0].d > 9 && hits[0].d < hits[0].pn.r) return selectPlace(hits[0].pn.p, true);
      if (hits.length > 5 && S.k < KMAX * 0.5) {
        var k1 = Math.min(KMAX, S.k * 2.6), wx = (x - S.tx) / S.k, wy = (y - S.ty) / S.k;
        return animateTo(k1, x - wx * k1, y - wy * k1);
      }
      return chooser(hits.map(function (h) { return h.pn; }).sort(function (a, b) { return b.p.n - a.p.n; }));
    }
    var hx = D.hotel.x * S.k + S.tx, hy = D.hotel.y * S.k + S.ty;
    if (Math.hypot(hx - x, hy - y) < 18) return openHotel();
    if (!sheet.hidden && sheet.getAttribute('data-mode') !== 'list') closeSheet();
  }
  document.getElementById('zin').addEventListener('click', function () { zoomAt(W / 2, (H - sheetCover()) / 2, 1.6); });
  document.getElementById('zout').addEventListener('click', function () { zoomAt(W / 2, (H - sheetCover()) / 2, 1 / 1.6); });
  document.getElementById('zhome').addEventListener('click', function () { focusOn(D.hotel.x, D.hotel.y, 1 / 6); });

  function setLang(v) {
    lang = v; store('cq-lang', v);
    i18n.forEach(function (o) { o.n.textContent = v === 'zh' ? o.zh : o.en; });
    pins.forEach(function (pn) { pn.w = 0; });
    var b = document.getElementById('zlang'); b.querySelector('small').textContent = v === 'zh' ? 'EN' : '中文';
    b.setAttribute('aria-label', v === 'zh' ? 'Show map labels in English' : 'Show map labels in Chinese');
    scheduleLabels();
  }
  document.getElementById('zlang').addEventListener('click', function () { setLang(lang === 'zh' ? 'en' : 'zh'); });
  setLang(lang);
  window.addEventListener('resize', function () { resize(); if (!lp.hidden) placePanel(); });
  resize(); refreshPins();
  (function () {   // first load: open the view the link names, if any
    var h0 = hashNow(); E = [h0]; pos = 0; tag(0);
    if (h0) render(h0, true);
  })();
  window.__cq = { S: S, pins: pins, selectPlace: selectPlace, openList: openList, D: D, fitBox: fitBox, apply: apply };
})();
