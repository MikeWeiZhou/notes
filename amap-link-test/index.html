<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Amap link test</title>
<link rel="icon" href="data:,">
<style>
:root {
  --stock: #efe6cf; --plate: #fbf6e8; --margin: #e6dcc0; --ink: #1b1b1b; --ink-2: #4a4538;
  --ink-screen: #8d846f; --ink-faint: #c9bfa3; --red: #c8102e; --red-wash: #f6d9cf;
  --green: #1d6b3a; --green-wash: #d9ead0; --blue: #1d4f91; --blue-wash: #d8e3f0;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--stock); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
}
main { max-width: 640px; margin: 0 auto; padding: 16px 12px 48px; }
h1 { font-size: 22px; line-height: 1.2; margin: 0 0 6px; }
h2 { font-size: 18px; line-height: 1.25; margin: 28px 0 4px; padding-top: 12px; border-top: 2px solid var(--ink); }
p { margin: 0 0 8px; }
.how { font-size: 16px; }
.meta { font-size: 13px; color: var(--ink-2); }
.place { font-size: 13px; color: var(--ink-2); margin-bottom: 10px; overflow-wrap: anywhere; }
code, .url, textarea { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
ol.variants { list-style: none; margin: 0; padding: 0; }
li.v { background: var(--plate); border: 1px solid var(--ink-faint); border-radius: 6px; margin: 0 0 12px; padding: 8px; }
li.v.last { border-color: var(--red); box-shadow: 0 0 0 2px var(--red-wash); }
.lastmsg { display: none; font-size: 13px; font-weight: 600; color: var(--red); margin: 0 0 6px; }
li.v.last .lastmsg { display: block; }
a.go {
  display: block; min-height: 64px; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 6px;
  background: #fff; color: var(--ink); text-decoration: none; -webkit-tap-highlight-color: rgba(200, 16, 46, .18);
}
a.go:active { background: var(--red-wash); }
.top { display: flex; align-items: baseline; gap: 8px; }
.num { flex: none; font-weight: 700; font-size: 15px; color: #fff; background: var(--ink); border-radius: 4px; padding: 1px 7px; }
.label { flex: 1 1 auto; min-width: 0; font-weight: 700; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.mech { display: block; font-size: 13px; color: var(--ink-2); margin-top: 4px; overflow-wrap: anywhere; }
.url { display: block; font-size: 11px; line-height: 1.35; color: var(--ink-2); margin-top: 6px; word-break: break-all; overflow-wrap: anywhere; }
.src { font-size: 12px; color: var(--ink-2); margin: 6px 2px 0; overflow-wrap: anywhere; }
.src a { color: var(--blue); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; border-radius: 3px; padding: 1px 6px; margin-right: 6px; }
.badge.documented { background: var(--green-wash); color: var(--green); }
.badge.guess { background: var(--red-wash); color: var(--red); }
.badge.baseline { background: var(--margin); color: var(--ink-2); }
.res { display: flex; gap: 6px; margin-top: 8px; }
.res button {
  flex: 1 1 0; min-width: 0; min-height: 44px; padding: 6px 4px; font: inherit; font-size: 14px; line-height: 1.2;
  color: var(--ink); background: var(--plate); border: 1.5px solid var(--ink-screen); border-radius: 6px;
}
.res button[aria-pressed="true"] { color: #fff; font-weight: 700; }
.res button[data-r="app"][aria-pressed="true"] { background: var(--green); border-color: var(--green); }
.res button[data-r="browser"][aria-pressed="true"] { background: var(--blue); border-color: var(--blue); }
.res button[data-r="nothing"][aria-pressed="true"] { background: var(--red); border-color: var(--red); }
input.note {
  display: block; width: 100%; margin-top: 6px; min-height: 40px; padding: 6px 8px; font: inherit; font-size: 16px;
  color: var(--ink); background: #fff; border: 1px solid var(--ink-faint); border-radius: 6px;
}
details { margin: 4px 0 12px; }
summary { font-weight: 700; font-size: 16px; padding: 12px 4px; cursor: pointer; }
.actions { display: flex; gap: 8px; margin: 10px 0 6px; }
.actions button {
  min-height: 48px; padding: 8px 14px; font: inherit; font-size: 16px; font-weight: 700; border-radius: 6px;
  border: 2px solid var(--ink); background: var(--ink); color: #fff;
}
.actions button#copyBtn { flex: 1 1 auto; }
.actions button#resetBtn { background: var(--plate); color: var(--red); border-color: var(--red); }
#status { min-height: 1.45em; font-size: 14px; font-weight: 600; }
textarea#summary {
  display: block; width: 100%; height: 300px; padding: 8px; font-size: 11px; line-height: 1.4; color: var(--ink);
  background: #fff; border: 1px solid var(--ink-screen); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto;
}
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Amap link test</h1>
  <p class="how">Tap each link, note what happens, come back here, and mark the result under it.</p>
  <p class="meta" id="env"></p>
  <p class="meta" id="progress"></p>

  <h2 id="hA">A. PhotoWith照相馆 (POI id known)</h2>
  <p class="place" id="placeA"></p>
  <ol class="variants" id="listA"></ol>
  <details id="iosBox">
    <summary>iPhone only (2 variants)</summary>
    <ol class="variants" id="listIos"></ol>
  </details>

  <h2 id="hB">B. 国际饭店帆声饼屋 (no POI id)</h2>
  <p class="place" id="placeB"></p>
  <ol class="variants" id="listB"></ol>

  <h2>Results</h2>
  <div class="actions">
    <button type="button" id="copyBtn">Copy results</button>
    <button type="button" id="resetBtn">Reset</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="meta">Same text, for copying by hand:</p>
  <textarea id="summary" readonly spellcheck="false" aria-label="Results as plain text"></textarea>
</main>

<script>
(function () {
  'use strict';

  /* ---------- Test places ---------- */
  var PLACE_A = {
    name: 'PhotoWith照相馆',
    poiId: 'B0HRKUBMDH',
    wgs: { lat: 31.212826, lng: 121.453615 },   // WGS-84, as stored in the trip map
    gcj: { lat: 31.210925, lng: 121.458196 },   // GCJ-02, standard transform of the WGS-84 pair (unrounded: 31.21092499837678, 121.45819573937848)
    share: 'https://surl.amap.com/sYLlgyZIa7i'
  };
  var PLACE_B = {
    name: '国际饭店帆声饼屋',
    poiId: null,
    gcj: { lat: 31.2336587, lng: 121.471419 },  // GCJ-02 as given
    share: 'https://surl.amap.com/d68Exzcz02W'
  };
  var SRC = 'tripmap';                          // src / sourceApplication value
  var PKG = 'com.autonavi.minimap';             // Amap Android package
  var CITY = '310000';                          // Shanghai adcode, for uri.amap.com/search

  /* ---------- Documentation the variants come from ---------- */
  var DOC = {
    marker:   'https://lbs.amap.com/api/uri-api/guide/mobile-web/point',
    detail:   'https://lbs.amap.com/api/uri-api/guide/mobile-web/information',
    search:   'https://lbs.amap.com/api/uri-api/guide/search/search',
    route:    'https://lbs.amap.com/api/uri-api/guide/travel/route',
    aMarker:  'https://lbs.amap.com/api/amap-mobile/guide/android/marker',
    aSearch:  'https://lbs.amap.com/api/amap-mobile/guide/android/search',
    aRoute:   'https://lbs.amap.com/api/amap-mobile/guide/android/route',
    iMarker:  'https://lbs.amap.com/api/amap-mobile/guide/ios/marker',
    iSearch:  'https://lbs.amap.com/api/amap-mobile/guide/ios/search',
    intent:   'https://developer.chrome.com/docs/android/intents',
    geo:      'https://developer.android.com/guide/components/google-maps-intents'
  };

  /* ---------- URL builders ---------- */
  // key=value&... with UTF-8 percent-encoding; commas stay literal, as in Amap's own examples.
  function qs(pairs) {
    var out = [];
    for (var i = 0; i < pairs.length; i++) {
      out.push(pairs[i][0] + '=' + encodeURIComponent(String(pairs[i][1])).replace(/%2C/g, ','));
    }
    return out.join('&');
  }
  function lonLat(p) { return p.gcj.lng + ',' + p.gcj.lat; }

  function uriMarker(p, callnative) {
    return 'https://uri.amap.com/marker?' + qs([['position', lonLat(p)], ['name', p.name], ['src', SRC], ['coordinate', 'gaode'], ['callnative', callnative]]);
  }
  function uriMarkerById(p) {
    return 'https://uri.amap.com/marker?' + qs([['poiid', p.poiId], ['src', SRC], ['callnative', 1]]);
  }
  function uriPoiDetail(p) {
    return 'https://uri.amap.com/poidetail?' + qs([['poiid', p.poiId], ['src', SRC], ['callnative', 1]]);
  }
  function uriSearch(p) {
    return 'https://uri.amap.com/search?' + qs([['keyword', p.name], ['center', lonLat(p)], ['city', CITY], ['view', 'map'], ['src', SRC], ['callnative', 1]]);
  }
  function uriNavigation(p) {
    return 'https://uri.amap.com/navigation?from=&' + qs([['to', lonLat(p) + ',' + p.name], ['mode', 'walk'], ['src', SRC], ['callnative', 1]]);
  }
  function viewMapQuery(p) {
    return qs([['sourceApplication', SRC], ['poiname', p.name], ['lat', p.gcj.lat], ['lon', p.gcj.lng], ['dev', 0]]);
  }
  function poiDetailQuery(p) {
    return qs([['poiname', p.name], ['lat', p.gcj.lat], ['lon', p.gcj.lng], ['poiid', p.poiId]]);
  }
  function androidViewMap(p) { return 'androidamap://viewMap?' + viewMapQuery(p); }
  function androidPoi(p) { return 'androidamap://poi?' + qs([['sourceApplication', SRC], ['keywords', p.name], ['dev', 0]]); }
  function amapuriPoiDetail(p) { return 'amapuri://poi/detail?' + poiDetailQuery(p); }
  function amapuriRoute(p) {
    return 'amapuri://route/plan/?' + qs([['sourceApplication', SRC], ['did', p.poiId], ['dlat', p.gcj.lat], ['dlon', p.gcj.lng], ['dname', p.name], ['dev', 0], ['t', 2]]);
  }
  function intentUrl(scheme, hostPathQuery, fallback) {
    return 'intent://' + hostPathQuery + '#Intent;scheme=' + scheme + ';package=' + PKG +
      ';S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
  }
  function geoUrl(lat, lng, name) { return 'geo:' + lat + ',' + lng + '?q=' + encodeURIComponent(name); }
  function iosViewMap(p) { return 'iosamap://viewMap?' + viewMapQuery(p); }
  function iosPoi(p) { return 'iosamap://poi?' + qs([['sourceApplication', SRC], ['name', p.name], ['dev', 0]]); }

  /* ---------- Variants ----------
     status: 'baseline' (what the map does today), 'documented' (doc link given), 'guess'.
     blank: open with target=_blank rel="noopener noreferrer", exactly as the trip map does.
     script: fire with location.href on tap instead of a plain <a href>. */
  var A = PLACE_A, B = PLACE_B;
  var GROUPS = [
    { list: 'listA', items: [
      { id: 'A1', label: 'Current map link, new tab', mech: 'https page link, target=_blank (what the trip map does today)',
        url: 'https://www.amap.com/ssr/place/' + A.poiId, blank: true, status: 'baseline' },
      { id: 'A2', label: 'Current map link, same tab', mech: 'same https link without target=_blank',
        url: 'https://www.amap.com/ssr/place/' + A.poiId, status: 'guess', why: 'App Links sometimes only fire on a same-tab navigation.' },
      { id: 'A3', label: 'Share link, new tab', mech: 'surl.amap.com short link, target=_blank',
        url: A.share, blank: true, status: 'baseline' },
      { id: 'A4', label: 'Share link, same tab', mech: 'surl.amap.com short link without target=_blank',
        url: A.share, status: 'guess', why: 'Same-tab version of the share link.' },
      { id: 'A5', label: 'URI API marker, by coordinate', mech: 'uri.amap.com/marker, coordinate=gaode, callnative=1',
        url: uriMarker(A, 1), status: 'documented', doc: DOC.marker },
      { id: 'A6', label: 'URI API marker, by POI id', mech: 'uri.amap.com/marker?poiid=, callnative=1',
        url: uriMarkerById(A), status: 'documented', doc: DOC.marker },
      { id: 'A7', label: 'URI API place detail, by POI id', mech: 'uri.amap.com/poidetail?poiid=, callnative=1',
        url: uriPoiDetail(A), status: 'documented', doc: DOC.detail },
      { id: 'A8', label: 'URI API search, by name', mech: 'uri.amap.com/search?keyword=, callnative=1',
        url: uriSearch(A), status: 'documented', doc: DOC.search },
      { id: 'A9', label: 'URI API route to here (walk)', mech: 'uri.amap.com/navigation, from empty = my location, callnative=1',
        url: uriNavigation(A), status: 'documented', doc: DOC.route },
      { id: 'A10', label: 'Android scheme: map marker', mech: 'androidamap://viewMap, plain <a href>',
        url: androidViewMap(A), status: 'documented', doc: DOC.aMarker },
      { id: 'A11', label: 'Android scheme: map marker, fired by script', mech: 'same URL as A10, but location.href = url on tap',
        url: androidViewMap(A), script: true, status: 'documented', doc: DOC.aMarker, why: 'URL documented; firing it from script is the thing under test.' },
      { id: 'A12', label: 'Android scheme: search by name', mech: 'androidamap://poi?keywords=',
        url: androidPoi(A), status: 'documented', doc: DOC.aSearch },
      { id: 'A13', label: 'App scheme: place detail by POI id', mech: 'amapuri://poi/detail?poiid=',
        url: amapuriPoiDetail(A), status: 'documented', doc: DOC.aSearch },
      { id: 'A14', label: 'App scheme: route to POI id (walk)', mech: 'amapuri://route/plan/?did=',
        url: amapuriRoute(A), status: 'documented', doc: DOC.aRoute },
      { id: 'A15', label: 'Chrome intent: map marker', mech: 'intent:// with scheme=androidamap, package, browser_fallback_url',
        url: intentUrl('androidamap', 'viewMap?' + viewMapQuery(A), uriMarker(A, 0)), status: 'guess', doc: DOC.intent,
        why: 'Chrome’s intent syntax and Amap’s scheme are each documented; putting them together is not in Amap’s docs.' },
      { id: 'A16', label: 'Chrome intent: place detail by POI id', mech: 'intent:// with scheme=amapuri, package, browser_fallback_url',
        url: intentUrl('amapuri', 'poi/detail?' + poiDetailQuery(A), 'https://www.amap.com/ssr/place/' + A.poiId), status: 'guess', doc: DOC.intent,
        why: 'Same combination as A15, for the POI-id scheme.' },
      { id: 'A17', label: 'geo: link (Android app chooser)', mech: 'geo:lat,lng?q=name, WGS-84 position',
        url: geoUrl(A.wgs.lat, A.wgs.lng, A.name), status: 'guess', doc: DOC.geo,
        why: 'Standard Android map link; how Amap reads it is not documented.' }
    ] },
    { list: 'listIos', items: [
      { id: 'A18', label: 'iOS scheme: map marker', mech: 'iosamap://viewMap',
        url: iosViewMap(A), status: 'documented', doc: DOC.iMarker },
      { id: 'A19', label: 'iOS scheme: search by name', mech: 'iosamap://poi?name=',
        url: iosPoi(A), status: 'documented', doc: DOC.iSearch }
    ] },
    { list: 'listB', items: [
      { id: 'B1', label: 'Current share link, new tab', mech: 'surl.amap.com short link, target=_blank (what the trip map does today)',
        url: B.share, blank: true, status: 'baseline' },
      { id: 'B2', label: 'URI API marker, by coordinate', mech: 'uri.amap.com/marker, coordinate=gaode, callnative=1',
        url: uriMarker(B, 1), status: 'documented', doc: DOC.marker },
      { id: 'B3', label: 'URI API search, by name', mech: 'uri.amap.com/search?keyword=, callnative=1',
        url: uriSearch(B), status: 'documented', doc: DOC.search },
      { id: 'B4', label: 'Android scheme: map marker', mech: 'androidamap://viewMap, plain <a href>',
        url: androidViewMap(B), status: 'documented', doc: DOC.aMarker },
      { id: 'B5', label: 'Chrome intent: map marker', mech: 'intent:// with scheme=androidamap, package, browser_fallback_url',
        url: intentUrl('androidamap', 'viewMap?' + viewMapQuery(B), B.share), status: 'guess', doc: DOC.intent,
        why: 'Chrome’s intent syntax and Amap’s scheme are each documented; the combination is not in Amap’s docs.' }
    ] }
  ];

  var RESULTS = [['app', 'Opened app'], ['browser', 'Opened browser'], ['nothing', 'Nothing / error']];
  var RESULT_TEXT = { app: 'APP', browser: 'BROWSER', nothing: 'NOTHING/ERROR' };
  var ALL = [];
  GROUPS.forEach(function (g) { g.items.forEach(function (v) { ALL.push(v); }); });

  /* ---------- State (localStorage, never fatal) ---------- */
  var KEY = 'amap-link-test.v1';
  var state = { r: {}, n: {}, last: null };
  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (s && typeof s === 'object') {
        state.r = s.r && typeof s.r === 'object' ? s.r : {};
        state.n = s.n && typeof s.n === 'object' ? s.n : {};
        state.last = typeof s.last === 'string' ? s.last : null;
      }
    } catch (e) { /* private mode or blocked storage: results last until the page is closed */ }
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  /* ---------- Rendering ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.appendChild(document.createTextNode(text));
    return n;
  }
  var ROWS = {};

  function renderVariant(v) {
    var li = el('li', 'v'); li.id = 'v-' + v.id;
    li.appendChild(el('p', 'lastmsg', 'You tapped this one last. What happened?'));

    var a = el('a', 'go');
    a.id = 'go-' + v.id;
    if (v.script) {
      a.href = '#v-' + v.id;
      a.setAttribute('role', 'button');
      a.setAttribute('data-url', v.url);
    } else {
      a.href = v.url;
      if (v.blank) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    }
    var top = el('span', 'top');
    top.appendChild(el('span', 'num', v.id));
    top.appendChild(el('span', 'label', v.label));
    a.appendChild(top);
    a.appendChild(el('span', 'mech', v.mech));
    a.appendChild(el('span', 'url', v.url));
    a.addEventListener('click', function (ev) {
      state.last = v.id; save(); markLast();
      if (v.script) {
        ev.preventDefault();
        try { window.location.href = v.url; } catch (e) { /* unknown scheme: stay on the page */ }
      }
    });
    li.appendChild(a);

    var src = el('p', 'src');
    src.appendChild(el('span', 'badge ' + v.status, v.status));
    if (v.doc) {
      var d = el('a', null, v.doc.replace(/^https:\/\//, ''));
      d.href = v.doc; d.target = '_blank'; d.rel = 'noopener noreferrer';
      d.className = 'doc';
      src.appendChild(d);
    }
    if (v.why) src.appendChild(document.createTextNode((v.doc ? ' — ' : '') + v.why));
    li.appendChild(src);

    var res = el('div', 'res'); res.setAttribute('role', 'group'); res.setAttribute('aria-label', 'Result for ' + v.id);
    var buttons = [];
    RESULTS.forEach(function (pair) {
      var b = el('button', null, pair[1]);
      b.type = 'button'; b.setAttribute('data-r', pair[0]); b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () {
        if (state.r[v.id] === pair[0]) delete state.r[v.id]; else state.r[v.id] = pair[0];
        if (state.last === v.id) state.last = null;
        save(); refresh();
      });
      res.appendChild(b); buttons.push(b);
    });
    li.appendChild(res);

    var note = el('input', 'note');
    note.type = 'text'; note.id = 'note-' + v.id; note.placeholder = 'Note (optional)';
    note.setAttribute('aria-label', 'Note for ' + v.id);
    note.autocomplete = 'off'; note.maxLength = 200;
    note.addEventListener('input', function () {
      if (note.value) state.n[v.id] = note.value; else delete state.n[v.id];
      save(); refreshSummary();
    });
    li.appendChild(note);

    ROWS[v.id] = { li: li, buttons: buttons, note: note };
    return li;
  }

  function markLast() {
    ALL.forEach(function (v) {
      var on = state.last === v.id && !state.r[v.id];
      ROWS[v.id].li.classList.toggle('last', on);
    });
  }

  function summaryText() {
    var lines = ['Amap link test results'];
    var done = 0;
    ALL.forEach(function (v) {
      var r = state.r[v.id];
      if (r) done++;
      var line = v.id + ' | ' + v.label + ' | ' + (r ? RESULT_TEXT[r] : '-');
      var n = (state.n[v.id] || '').replace(/\s+/g, ' ').trim();
      if (n) line += ' | ' + n;
      lines.push(line);
    });
    lines.push('Marked: ' + done + ' of ' + ALL.length);
    lines.push('UA: ' + navigator.userAgent);
    return lines.join('\n');
  }

  function refreshSummary() {
    document.getElementById('summary').value = summaryText();
  }

  function refresh() {
    var done = 0;
    ALL.forEach(function (v) {
      var row = ROWS[v.id], r = state.r[v.id];
      if (r) done++;
      row.buttons.forEach(function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-r') === r ? 'true' : 'false');
      });
      var want = state.n[v.id] || '';
      if (row.note.value !== want && document.activeElement !== row.note) row.note.value = want;
    });
    document.getElementById('progress').textContent = done + ' of ' + ALL.length + ' marked. Results are kept on this phone until you press Reset.';
    markLast();
    refreshSummary();
  }

  function describeBrowser() {
    var ua = navigator.userAgent || '';
    var where = /MicroMessenger/i.test(ua) ? 'WeChat’s built-in browser (it blocks most app links; open this page in Chrome instead)'
      : /AlipayClient/i.test(ua) ? 'Alipay’s built-in browser (open this page in Chrome instead)'
      : /; wv\)/.test(ua) ? 'an in-app WebView (open this page in Chrome instead)'
      : /EdgA|SamsungBrowser|HuaweiBrowser|MiuiBrowser|UCBrowser|QQBrowser|Quark/i.test(ua) ? 'a browser other than Chrome (results may differ from Chrome)'
      : /Chrome\/\d+/.test(ua) && /Android/.test(ua) ? 'Chrome on Android'
      : /iPhone|iPad/.test(ua) ? 'an iPhone or iPad (use the “iPhone only” group too)'
      : 'not an Android phone (app links cannot be tested here)';
    return 'This page is open in ' + where + '.';
  }

  /* ---------- Copy and reset ---------- */
  var statusTimer = null;
  function say(msg) {
    var s = document.getElementById('status');
    s.textContent = msg;
    if (statusTimer) window.clearTimeout(statusTimer);
    statusTimer = window.setTimeout(function () { s.textContent = ''; }, 6000);
  }
  function copyFallback(text) {
    var ta = document.getElementById('summary');
    ta.value = text;
    var ok = false;
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); } catch (e) { ok = false; }
    say(ok ? 'Copied.' : 'Could not copy. The text below is selected: copy it by hand.');
  }
  function copyResults() {
    var text = summaryText();
    refreshSummary();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { say('Copied.'); }, function () { copyFallback(text); });
    } else {
      copyFallback(text);
    }
  }
  var resetArmed = null;
  function resetAll() {
    var btn = document.getElementById('resetBtn');
    if (!resetArmed) {
      btn.textContent = 'Tap again to clear all';
      resetArmed = window.setTimeout(function () { resetArmed = null; btn.textContent = 'Reset'; }, 4000);
      return;
    }
    window.clearTimeout(resetArmed); resetArmed = null; btn.textContent = 'Reset';
    state = { r: {}, n: {}, last: null };
    try { window.localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    ALL.forEach(function (v) { ROWS[v.id].note.value = ''; });
    refresh();
    say('All results cleared.');
  }

  /* ---------- Start ---------- */
  load();
  GROUPS.forEach(function (g) {
    var ol = document.getElementById(g.list);
    g.items.forEach(function (v) { ol.appendChild(renderVariant(v)); });
  });
  document.getElementById('placeA').textContent = 'POI id ' + A.poiId + '. GCJ-02 ' + A.gcj.lat + ', ' + A.gcj.lng +
    ' (converted from WGS-84 ' + A.wgs.lat + ', ' + A.wgs.lng + ').';
  document.getElementById('placeB').textContent = 'GCJ-02 ' + B.gcj.lat + ', ' + B.gcj.lng + '. Links use the position and the name.';
  document.getElementById('env').textContent = describeBrowser();
  document.getElementById('copyBtn').addEventListener('click', copyResults);
  document.getElementById('resetBtn').addEventListener('click', resetAll);
  if (state.last && /^A1[89]$/.test(state.last)) document.getElementById('iosBox').open = true;
  refresh();
  // Coming back from Amap or from another tab: show which link was tapped last.
  window.addEventListener('pageshow', function () { load(); refresh(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) markLast(); });
})();
</script>
</body>
</html>
