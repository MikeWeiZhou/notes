<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Focus Deck · Todo Calendar prototype 10</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared.css">
<style>
main{max-width:560px;margin:0 auto;padding:14px 14px 30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.head{display:flex;align-items:center;gap:14px;width:100%}
.ring{width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .bg{fill:none;stroke:var(--surface2);stroke-width:8}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s}
.head h2{margin:0;font:600 1.3rem Georgia,serif}
.head p{margin:0;color:var(--muted);font-size:.85rem}
.stack{position:relative;width:100%;height:min(62vh,460px);min-height:360px}
.card{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.12);transition:transform .3s,opacity .3s;touch-action:none;user-select:none;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
.card.top{cursor:grab}
.card .proj{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--c)}
.card h3{font:600 clamp(1.6rem,6vw,2.2rem)/1.15 Georgia,serif;margin:10px 0 0}
.card .cd{margin-top:auto;font:600 clamp(2.2rem,10vw,3.2rem)/1 system-ui;font-variant-numeric:tabular-nums}
.card .cd.late{color:var(--danger)}
.card .cdl{color:var(--muted);font-size:.85rem;margin-top:4px}
.card .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.card .facts span{background:var(--surface2);border-radius:999px;padding:4px 11px;font-size:.82rem}
.card .note{color:var(--muted);margin-top:12px;font-size:.92rem}
.stamp{position:absolute;top:28px;padding:6px 14px;border:3px solid;border-radius:10px;font-weight:800;font-size:1.2rem;letter-spacing:.06em;opacity:0;text-transform:uppercase}
.stamp.yes{right:24px;color:var(--accent);transform:rotate(10deg)}
.stamp.no{left:24px;color:#d58a1f;transform:rotate(-10deg)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btns .tcl-btn{padding:11px 16px;font-size:.95rem}
.queue{width:100%}
.queue h4{margin:6px 0;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.q{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.q span{flex:none;border-left:4px solid;background:var(--surface);border-radius:8px;padding:5px 9px;font-size:.8rem;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
.empty{text-align:center;padding:30px 10px}
.empty h3{font:600 1.6rem Georgia,serif;margin:0 0 6px}
.hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
  <div class="head">
    <div class="ring"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" id="prog" cx="32" cy="32" r="26"/></svg></div>
    <div><h2 id="title">Today</h2><p id="sub"></p></div>
  </div>
  <div class="stack" id="stack"></div>
  <div class="btns" id="btns"></div>
  <div class="hint" id="hint">Swipe right when it's done, left to push it to tomorrow. Arrow keys work too.</div>
  <div class="queue" id="queue"></div>
</main>
<script src="../shared.js"></script>
<script>
(function(){
  const {h} = TCL;
  TCL.mount('deck');
  const back = []; // keys sent to the back of the deck ("later today")
  const C = 2 * Math.PI * 26;
  const prog = document.getElementById('prog');
  prog.setAttribute('stroke-dasharray', C);

  function deck(now) {
    const T = TCL.sod(now), tk = TCL.key(T);
    const todays = TCL.expand(T, TCL.addDays(T, 1)).filter((o) => o.planDay === tk);
    const overdue = TCL.openOneOffs().filter((o) => o.planDay < tk)
      .concat(TCL.expand(new Date(2000, 0, 1), new Date(2100, 0, 1), TCL.tasks().filter((t) => !t.recur && t.done && t.doneOn === tk)).filter((o) => o.planDay < tk));
    const all = overdue.concat(todays.filter((o) => !overdue.some((x) => x.key === o.key)));
    const open = all.filter((o) => !o.done).sort((a, b) => {
      const ba = back.indexOf(a.key), bb = back.indexOf(b.key);
      if (ba !== bb) return ba - bb;
      const lateDiff = (b.due < now) - (a.due < now);
      return lateDiff || (a.start || a.due) - (b.start || b.due);
    });
    return {all, open};
  }

  function act(o, dir) {
    const now = new Date();
    if (dir > 0) TCL.toggle(o);
    else if (o.recurring) TCL.skip(o);
    else TCL.setPlan(o, TCL.key(TCL.addDays(TCL.sod(now), 1)));
  }

  function render() {
    const now = new Date();
    const {all, open} = deck(now);
    const doneM = all.filter((o) => o.done).reduce((s, o) => s + o.dur, 0), totM = all.reduce((s, o) => s + o.dur, 0);
    prog.setAttribute('stroke-dashoffset', C * (1 - (totM ? doneM / totM : 1)));
    document.getElementById('title').textContent = `Today · ${TCL.fmtDay(now)}`;
    document.getElementById('sub').textContent = `${all.length - open.length} of ${all.length} done · ${TCL.fmtHours(totM - doneM)} left`;
    const stack = document.getElementById('stack'); stack.textContent = '';
    const btns = document.getElementById('btns'); btns.textContent = '';
    const queue = document.getElementById('queue'); queue.textContent = '';
    document.getElementById('hint').hidden = !open.length;
    if (!open.length) {
      const tom = TCL.expand(TCL.addDays(TCL.sod(now), 1), TCL.addDays(TCL.sod(now), 2)).filter((o) => o.planDay === TCL.key(TCL.addDays(TCL.sod(now), 1)));
      stack.append(h('div', {class: 'card', style: {'--c': 'var(--accent)'}}, h('div', {class: 'empty'},
        h('h3', null, 'Deck cleared'), h('p', null, `You finished ${all.filter((o) => o.done).length} tasks today, ${TCL.fmtHours(doneM)} of work.`),
        h('p', {class: 'tcl-muted'}, `Tomorrow has ${tom.length} cards, ${TCL.fmtHours(tom.reduce((s, o) => s + o.dur, 0))}.`))));
      return;
    }
    open.slice(0, 3).reverse().forEach((o, ri, arr) => {
      const depth = arr.length - 1 - ri, isTop = depth === 0;
      const late = o.due < now;
      const yes = h('div', {class: 'stamp yes'}, 'Done'), no = h('div', {class: 'stamp no'}, 'Tomorrow');
      const card = h('div', {class: 'card' + (isTop ? ' top' : ''), style: {'--c': o.color, transform: `translateY(${depth * 14}px) scale(${1 - depth * .05})`, opacity: isTop ? 1 : 1 - depth * .25, zIndex: 10 - depth}},
        yes, no,
        h('div', {class: 'proj'}, TCL.PROJECTS[o.project].name + (o.recurring ? ' · routine' : '')),
        h('h3', null, o.title),
        h('div', {class: 'facts'}, h('span', null, '⏱ ' + TCL.fmtDur(o.dur)), o.start ? h('span', null, '🕑 ' + TCL.fmtTime(o.start)) : h('span', null, 'any time today'), h('span', null, 'due ' + TCL.relDue(o, now))),
        o.task.note ? h('div', {class: 'note'}, o.task.note) : null,
        h('div', {class: 'cd' + (late ? ' late' : '')}, TCL.countdown(o, now).replace(/ (left|late)$/, '')),
        h('div', {class: 'cdl'}, late ? 'past the deadline' : 'until the deadline'));
      if (isTop) {
        let x0 = null, dx = 0;
        card.addEventListener('pointerdown', (e) => { x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
        card.addEventListener('pointermove', (e) => {
          if (x0 == null) return; dx = e.clientX - x0;
          card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
          yes.style.opacity = Math.max(0, dx / 100); no.style.opacity = Math.max(0, -dx / 100);
        });
        const end = () => {
          if (x0 == null) return; x0 = null; card.style.transition = '';
          if (Math.abs(dx) > 100) { card.style.transform = `translateX(${Math.sign(dx) * 600}px) rotate(${Math.sign(dx) * 25}deg)`; card.style.opacity = 0; setTimeout(() => act(o, dx), 250); }
          else if (Math.abs(dx) < 5) { card.style.transform = ''; TCL.openTask(o); }
          else { card.style.transform = ''; yes.style.opacity = no.style.opacity = 0; }
        };
        card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
      }
      stack.append(card);
    });
    const top = open[0];
    btns.append(
      h('button', {class: 'tcl-btn', onclick: () => act(top, -1)}, '← Tomorrow'),
      h('button', {class: 'tcl-btn', onclick: () => { const i = back.indexOf(top.key); if (i >= 0) back.splice(i, 1); back.push(top.key); render(); }}, 'Later today'),
      h('button', {class: 'tcl-btn primary', onclick: () => act(top, 1)}, 'Done →'));
    if (open.length > 1) queue.append(h('h4', null, `Still in the deck · ${open.length - 1}`), h('div', {class: 'q'}, open.slice(1).map((o) => h('span', {style: {borderLeftColor: o.color}}, `${o.title} · ${TCL.fmtDur(o.dur)}`))));
  }
  document.addEventListener('keydown', (e) => {
    if (document.querySelector('.tcl-scrim')) return;
    const {open} = deck(new Date()); if (!open.length) return;
    if (e.key === 'ArrowRight') act(open[0], 1); else if (e.key === 'ArrowLeft') act(open[0], -1);
  });
  TCL.onChange(render);
  TCL.every(render);
  render();
})();
</script>
</body>
</html>
