<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Duration Grid · Month view prototype 1</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../shared.css">
<link rel="stylesheet" href="../month.css">
<style>
main{max-width:1180px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:118px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden;position:relative}
.cell.we{background:color-mix(in oklab,var(--surface2) 55%,var(--surface))}
.cell.out{opacity:.4}
.cell.today{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.top{display:flex;align-items:center;gap:4px;min-height:18px}
.num{font-weight:600;font-size:.85rem}
.cell.today .num{background:var(--ink);color:var(--paper);border-radius:999px;padding:0 6px}
.rd{display:flex;gap:2px;margin-left:auto}
.rd i{width:5px;height:5px;border-radius:50%}
.bar{position:relative;height:19px;border-radius:5px;font-size:.7rem;line-height:19px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in oklab,var(--c) 14%,var(--surface));color:var(--ink)}
.bar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--c);opacity:.9;border-radius:5px 0 0 5px;z-index:0}
.bar span{position:relative;z-index:1;font-weight:500;text-shadow:0 0 3px var(--surface)}
.bar.done{opacity:.4;text-decoration:line-through}
.bar .fl{position:relative;z-index:1;color:var(--c);font-weight:700}
.more{font-size:.7rem;color:var(--muted);padding-left:3px}
.load{position:absolute;left:5px;right:5px;bottom:3px;height:3px;border-radius:2px;background:var(--surface2);overflow:hidden}
.load i{display:block;height:100%;background:var(--accent)}
.load i.over{background:var(--danger)}
@media (max-width:640px){
 .grid{gap:2px}.cell{min-height:84px;padding:3px;border-radius:7px;gap:2px}
 .bar{height:5px;padding:0;font-size:0;border-radius:3px;background:color-mix(in oklab,var(--c) 18%,transparent)}
 .bar::before{border-radius:3px}
 .bar span,.bar .fl{display:none}
 .rd{display:none}.num{font-size:.75rem}
}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend .s{display:inline-block;width:40px;height:10px;border-radius:3px;background:color-mix(in oklab,var(--accent) 14%,var(--surface));position:relative;vertical-align:middle;margin-right:6px;overflow:hidden}
.legend .s::before{content:"";position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--accent)}
</style>
</head>
<body>
<main id="app"></main>
<script>window.TODOCAL_KEY='todocal.monthproto';try{if(!localStorage.getItem('todocal.monthproto')){var r=localStorage.getItem('todocal.v1');if(r&&JSON.parse(r).tasks.length){localStorage.setItem('todocal.monthproto',r);localStorage.setItem('todocal.monthproto.src','app');}}}catch(e){}</script>
<script src="../../../todo-calendar/core.js"></script>
<script src="../month.js"></script>
<script>
(function(){
  const {h} = TCL;
  TCL.mount('grid');
  const app = document.getElementById('app');
  const nav = TCL.monthNav(render);
  const grid = h('div', {class: 'grid'});
  app.append(nav.el, grid,
    h('div', {class: 'legend'}, h('span', null, h('i', {class: 's'}), 'bar fill = time needed (full = 4h)'), h('span', null, '▶ due that day'), h('span', null, '• routines'), h('span', null, 'bottom line = day load vs 6h')),
    TCL.srcNote());
  function render() {
    const m = nav.month(), days = TCL.monthDays(m), now = new Date(), tk = TCL.key(now);
    const occs = TCL.expand(days[0], TCL.addDays(days[41], 1));
    const late = TCL.openOneOffs().filter((o) => o.planDay < tk);
    grid.textContent = '';
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((d) => grid.append(h('div', {class: 'm-dow'}, d)));
    const max = innerWidth < 640 ? 5 : 4;
    for (const d of days) {
      const k = TCL.key(d);
      let list = occs.filter((o) => !o.recurring && o.planDay === k);
      if (k === tk) list = late.concat(list.filter((o) => !late.some((x) => x.key === o.key)));
      list.sort((a, b) => a.done - b.done || b.dur - a.dur);
      const rec = occs.filter((o) => o.recurring && o.planDay === k);
      const load = list.concat(rec).filter((o) => !o.done).reduce((s, o) => s + o.dur, 0);
      const cell = h('div', {class: 'cell' + (d.getMonth() !== m.getMonth() ? ' out' : '') + (d.getDay() % 6 === 0 ? ' we' : '') + (k === tk ? ' today' : ''), onclick: () => openDay(d, list, rec)},
        h('div', {class: 'top'}, h('span', {class: 'num'}, d.getDate()), h('span', {class: 'rd', title: rec.map((o) => o.title).join(', ')}, rec.slice(0, 5).map((o) => h('i', {style: {background: o.color, opacity: o.done ? .35 : 1}})))));
      list.slice(0, max).forEach((o) => cell.append(h('div', {class: 'bar' + (o.done ? ' done' : ''), style: {'--c': o.due < now && !o.done ? 'var(--danger)' : o.color, '--w': Math.min(100, Math.max(8, o.dur / 240 * 100)) + '%'}, title: `${o.title} · ${TCL.fmtDur(o.dur)} · due ${TCL.relDue(o, now)}`},
        TCL.key(o.due) === k ? h('span', {class: 'fl'}, '▶ ') : null, h('span', null, o.title))));
      if (list.length > max) cell.append(h('div', {class: 'more'}, `+${list.length - max} more`));
      cell.append(h('div', {class: 'load'}, h('i', {class: load > TCL.CAP ? 'over' : '', style: {width: Math.min(100, load / TCL.CAP * 100) + '%'}})));
      grid.append(cell);
    }
  }
  function openDay(d, list, rec) {
    const all = list.concat(rec);
    const load = all.filter((o) => !o.done).reduce((s, o) => s + o.dur, 0);
    TCL.sheet(TCL.fmtDay(d), h('div', null, h('p', {class: 'tcl-muted', style: {margin: '0 0 6px'}}, `${TCL.fmtHours(load)} planned`),
      all.length ? all.map((o) => TCL.itemRow(o)) : h('p', {class: 'tcl-muted'}, 'Nothing planned.'),
      h('div', {class: 'tcl-actions'}, h('button', {class: 'tcl-btn', onclick: () => TCL.openAdd({due: TCL.key(d)})}, '+ Task due this day'))));
  }
  TCL.onChange(() => { document.querySelectorAll('.tcl-scrim').forEach((s) => s.remove()); render(); });
  addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
