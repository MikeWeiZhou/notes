<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Blocks Month · Month view prototype 4</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../shared.css">
<link rel="stylesheet" href="../month.css">
<style>
main{max-width:1180px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));gap:4px}
.axis{position:relative;font-size:.6rem;color:var(--muted)}
.axis span{position:absolute;right:2px;transform:translateY(-50%)}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.we{background:color-mix(in oklab,var(--surface2) 55%,var(--surface))}
.cell.out{opacity:.4}
.cell.today{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.num{font-weight:600;font-size:.8rem;display:flex;justify-content:space-between;align-items:center}
.cell.today .num b{background:var(--ink);color:var(--paper);border-radius:999px;padding:0 6px}
.num small{font-weight:400;color:var(--muted);font-size:.66rem}
.tl{position:relative;height:var(--H);border-radius:5px;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--H) / 6 - 1px),var(--line) calc(var(--H) / 6 - 1px),var(--line) calc(var(--H) / 6));overflow:hidden}
.blk{position:absolute;left:1px;right:1px;border-radius:2px;min-height:2px;cursor:pointer}
.blk.rec{opacity:.55}
.blk.done{opacity:.25}
.blk.late{box-shadow:0 0 0 1.5px var(--danger)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2}
.pile{display:flex;flex-wrap:wrap;gap:2px;min-height:8px}
.pile i{width:8px;height:8px;border-radius:50%;border:2px dotted;box-sizing:border-box}
@media (max-width:640px){.grid{gap:2px;grid-template-columns:20px repeat(7,minmax(0,1fr))}.cell{padding:2px;border-radius:6px}.num small{display:none}.pile i{width:6px;height:6px;border-width:1.5px}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin-top:10px;align-items:center}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--paper);font-size:.78rem;padding:5px 9px;border-radius:8px;pointer-events:none;max-width:240px}
</style>
</head>
<body>
<main id="app"></main>
<script>window.TODOCAL_KEY='todocal.monthproto';try{if(!localStorage.getItem('todocal.monthproto')){var r=localStorage.getItem('todocal.v1');if(r&&JSON.parse(r).tasks.length){localStorage.setItem('todocal.monthproto',r);localStorage.setItem('todocal.monthproto.src','app');}}}catch(e){}</script>
<script src="../../../todo-calendar/core.js"></script>
<script src="../month.js"></script>
<script>
(function(){
  const {h} = TCL;
  TCL.mount('strip');
  const app = document.getElementById('app');
  const nav = TCL.monthNav(render);
  const grid = h('div', {class: 'grid'});
  const tip = h('div', {class: 'tip', hidden: true});
  document.body.append(tip);
  app.append(nav.el, grid, h('div', {class: 'legend'}, h('span', null, 'Each day runs 6am (top) to midnight (bottom), lines every 3h'), h('span', null, '◌ dotted = planned that day without a time'), h('span', null, 'faded = routine')), TCL.srcNote());
  const H0 = 6 * 60, SPAN = 18 * 60;
  function render() {
    const m = nav.month(), days = TCL.monthDays(m), now = new Date(), tk = TCL.key(now);
    const H = innerWidth < 640 ? 66 : 100;
    grid.style.setProperty('--H', H + 'px');
    const occs = TCL.expand(days[0], TCL.addDays(days[41], 1));
    grid.textContent = '';
    grid.append(h('div'));
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((d) => grid.append(h('div', {class: 'm-dow'}, d)));
    for (let w = 0; w < 6; w++) {
      const ax = h('div', {class: 'axis'});
      // align axis labels with the timeline area (below the day number)
      [[6, '6a'], [12, '12p'], [18, '6p']].forEach(([hr, l]) => ax.append(h('span', {style: {top: `calc(${innerWidth < 640 ? 20 : 24}px + ${(hr * 60 - H0) / SPAN * H}px)`}}, l)));
      grid.append(ax);
      for (let i = 0; i < 7; i++) {
        const d = days[w * 7 + i], k = TCL.key(d);
        const sched = occs.filter((o) => o.start && TCL.key(o.start) === k);
        const loose = occs.filter((o) => !o.start && o.planDay === k);
        const load = sched.concat(loose).filter((o) => !o.done).reduce((s, o) => s + o.dur, 0);
        const tl = h('div', {class: 'tl'});
        sched.forEach((o) => {
          const s = o.start.getHours() * 60 + o.start.getMinutes();
          const end = new Date(o.start.getTime() + o.dur * 6e4);
          const b = h('div', {class: 'blk' + (o.recurring ? ' rec' : '') + (o.done ? ' done' : '') + (!o.recurring && !o.done && end > o.due ? ' late' : ''), style: {background: o.color, top: Math.max(0, (s - H0) / SPAN * H) + 'px', height: Math.max(2, o.dur / SPAN * H) + 'px'},
            onclick: (e) => { e.stopPropagation(); TCL.openTask(o); },
            onpointerenter: (e) => { tip.textContent = `${TCL.fmtTime(o.start)} ${o.title} · ${TCL.fmtDur(o.dur)}`; tip.hidden = false; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; },
            onpointerleave: () => (tip.hidden = true)});
          tl.append(b);
        });
        if (k === tk) { const nm = now.getHours() * 60 + now.getMinutes(); if (nm >= H0) tl.append(h('div', {class: 'now', style: {top: (nm - H0) / SPAN * H + 'px'}})); }
        grid.append(h('div', {class: 'cell' + (d.getDay() % 6 === 0 ? ' we' : '') + (d.getMonth() !== m.getMonth() ? ' out' : '') + (k === tk ? ' today' : ''), onclick: () => openDay(d, sched, loose)},
          h('div', {class: 'num'}, h('b', null, d.getDate()), load ? h('small', null, TCL.fmtHours(load)) : null),
          tl,
          h('div', {class: 'pile'}, loose.map((o) => h('i', {style: {borderColor: o.color, opacity: o.done ? .3 : 1}, title: o.title})))));
      }
    }
  }
  function openDay(d, sched, loose) {
    TCL.sheet(TCL.fmtDay(d), h('div', null,
      h('div', {class: 'tcl-muted'}, 'On the clock'), sched.length ? sched.map((o) => TCL.itemRow(o)) : h('p', {class: 'tcl-muted'}, 'Nothing scheduled.'),
      loose.length ? [h('div', {class: 'tcl-muted', style: {marginTop: '10px'}}, 'Planned without a time'), loose.map((o) => TCL.itemRow(o))] : null,
      h('p', {class: 'tcl-muted', style: {marginTop: '12px'}}, 'In the real app, this would open the day in Blocks.')));
  }
  TCL.onChange(() => { document.querySelectorAll('.tcl-scrim').forEach((s) => s.remove()); render(); });
  addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
