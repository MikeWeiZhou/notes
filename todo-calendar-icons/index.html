<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Todo Calendar: 20 icon candidates</title>
<style>
:root{--paper:#eef1f0;--surface:#fbfcfc;--ink:#172625;--muted:#5d6e6b;--line:#cdd6d3;--accent:#1f6f66}
@media (prefers-color-scheme:dark){:root{--paper:#0f1615;--surface:#172120;--ink:#e4ece8;--muted:#97a9a4;--line:#2c3b38;--accent:#5ec2b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{padding:16px 16px 4px;padding-top:max(16px,env(safe-area-inset-top));max-width:980px;margin:auto}
h1{font:600 1.35rem/1.2 Georgia,serif;margin:0 0 4px}
p{margin:4px 0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font:inherit;color:inherit}
.seg button.on{background:var(--ink);color:var(--paper)}
main{max-width:980px;margin:auto;padding:0 16px 40px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){main{grid-template-columns:380px minmax(0,1fr)}}
/* phone */
.phone{position:sticky;top:12px;align-self:start;margin:0 auto;width:340px;max-width:100%;aspect-ratio:9/19.5;border-radius:46px;padding:12px;background:#111;box-shadow:0 20px 50px #0004}
.screen{height:100%;border-radius:36px;overflow:hidden;position:relative;padding:54px 18px 18px;display:flex;flex-direction:column}
.screen.light{background:linear-gradient(160deg,#ffe2c6,#f6b6a8 45%,#a9c6e8)}
.screen.dark{background:linear-gradient(160deg,#1b2340,#0d1220 55%,#2a1b33)}
.screen.photo{background:radial-gradient(circle at 30% 20%,#9fd3c7,transparent 50%),radial-gradient(circle at 80% 70%,#3a6b4f,transparent 55%),linear-gradient(#5b8f7b,#24453a)}
.clock{position:absolute;top:14px;left:30px;font-weight:600;font-size:14px}
.light .clock{color:#172625}.dark .clock,.photo .clock{color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.app span{font-size:11px;color:#fff;text-shadow:0 1px 3px #000a,0 0 1px #000;white-space:nowrap;letter-spacing:.01em}
.ic{display:block;width:60px;height:60px;border-radius:13.5px;overflow:hidden;box-shadow:0 1px 3px #0003}
.ic svg{display:block;width:100%;height:100%}
.ph{background:#fff4;backdrop-filter:blur(4px)}
.dark .ph{background:#fff2}
.dock{margin-top:auto;border-radius:30px;padding:12px;background:#fff4;backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);justify-items:center}
.dark .dock{background:#fff1}
.app.sel .ic{outline:3px solid #fff;outline-offset:2px}
.hint{color:#fff;text-align:center;font-size:12px;margin:14px 0 10px;text-shadow:0 1px 2px #0008}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card .ic{width:64px;height:64px;flex:none;border-radius:14.4px}
.card b{display:block}
.card small{color:var(--muted);font-size:.8rem;line-height:1.3;display:block}
.num{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;margin-right:4px}
.big{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.big .ic{box-shadow:0 2px 8px #0003}
</style>
</head>
<body>
<header>
  <h1>Todo Calendar: 20 home screen icons</h1>
  <p>Tap any icon to see it larger and in the dock. Tell Claude the number you like; the app's icon won't change until you pick.</p>
  <div class="bar">
    <span class="seg" id="wall"><button data-w="light" class="on">Light wallpaper</button><button data-w="dark">Dark</button><button data-w="photo">Photo</button></span>
  </div>
</header>
<main>
  <div class="phone"><div class="screen light" id="screen"><div class="clock">9:41</div><div class="grid" id="grid"></div><div class="hint" id="hint"></div><div class="dock" id="dock"></div></div></div>
  <section>
    <div class="big" id="big"></div>
    <div class="cards" id="cards"></div>
  </section>
</main>
<script src="icons.js"></script>
<script>
const svg = (i) => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${ICONS[i][2]}</svg>`;
const ic = (i, px) => `<i class="ic" style="${px ? `width:${px}px;height:${px}px;border-radius:${px * .225}px` : ''}">${svg(i)}</i>`;
let sel = +(location.hash.slice(1)) - 1; if (!(sel >= 0 && sel < ICONS.length)) sel = 0;
const grid = document.getElementById('grid'), cards = document.getElementById('cards');
ICONS.forEach((d, i) => {
  grid.insertAdjacentHTML('beforeend', `<button class="app" data-i="${i}">${ic(i)}<span>${i + 1}. Todo Cal</span></button>`);
  cards.insertAdjacentHTML('beforeend', `<button class="card" data-i="${i}">${ic(i)}<div><b><span class="num">${i + 1}</span>${d[0]}</b><small>${d[1]}</small></div></button>`);
});
document.querySelectorAll('[data-i]').forEach((b) => b.onclick = () => pick(+b.dataset.i, b.classList.contains('card')));
function pick(i, scroll) {
  sel = i; history.replaceState(null, '', '#' + (i + 1));
  document.querySelectorAll('[data-i]').forEach((b) => b.classList.toggle('sel', +b.dataset.i === i));
  document.getElementById('hint').textContent = `#${i + 1} ${ICONS[i][0]}`;
  document.getElementById('dock').innerHTML = `<i class="ic ph"></i><i class="ic ph"></i>${ic(i)}<i class="ic ph"></i>`;
  document.getElementById('big').innerHTML = `${ic(i, 180)}${ic(i, 120)}${ic(i, 60)}${ic(i, 40)}${ic(i, 29)}<div><b>#${i + 1} ${ICONS[i][0]}</b><p>${ICONS[i][1]}</p><p>Shown at 180, 120, 60 (home screen), 40 (Spotlight) and 29 px (Settings).</p></div>`;
  if (scroll && innerWidth < 820) document.querySelector('.phone').scrollIntoView({ behavior: 'smooth' });
}
document.querySelectorAll('#wall button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('#wall button').forEach((x) => x.classList.toggle('on', x === b));
  document.getElementById('screen').className = 'screen ' + b.dataset.w;
});
pick(sel);
</script>
</body>
</html>
