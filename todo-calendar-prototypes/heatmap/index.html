<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Heat Calendar · Todo Calendar prototype 1</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared.css">
<style>
main{max-width:1180px;margin:0 auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){main{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.controls h2{font:600 1.35rem Georgia,serif;margin:0 auto 0 0;min-width:150px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 46px;gap:4px}
.dow{font-size:.72rem;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding:2px 0}
.cell{position:relative;aspect-ratio:1/1.05;border-radius:10px;border:1px solid var(--line);padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-height:52px;transition:transform .08s}
.cell:hover{transform:translateY(-1px)}
.cell.out{opacity:.38}
.cell.today .num{background:var(--ink);color:var(--paper);border-radius:999px;padding:0 6px}
.cell.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.cell.over{box-shadow:inset 0 0 0 2.5px var(--danger)}
.num{font-weight:600;font-size:.9rem;align-self:flex-start;line-height:1.4}
.dots{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px var(--surface)}
.dots em{font-size:.65rem;font-style:normal;color:inherit;opacity:.8}
.hrs{font-size:.7rem;font-variant-numeric:tabular-nums;opacity:.85;position:absolute;right:6px;top:6px}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);border-radius:10px;background:var(--surface2);font-variant-numeric:tabular-nums}
.wk b{font-size:.9rem;color:var(--ink)}
@media (max-width:520px){.cell{padding:3px 4px;border-radius:8px}.hrs{display:none}.num{font-size:.8rem}.dots i{width:6px;height:6px}.grid{gap:3px;grid-template-columns:repeat(7,minmax(0,1fr)) 34px}.cell{min-height:0}}
.legend{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend .scale{display:flex;gap:2px}
.legend .scale i{width:20px;height:12px;border-radius:3px}
.legend .ring{width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 2px var(--danger)}
aside{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
@media (min-width:900px){aside{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}}
aside h3{font:600 1.15rem Georgia,serif;margin:0}
.daysum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.meter{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;display:flex;margin:6px 0 12px}
.meter span{height:100%}
.sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.item{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.item input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.item .t{font-weight:500}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item .m{font-size:.8rem;color:var(--muted)}
.bar{height:8px;border-radius:4px;margin-top:5px;max-width:100%}
.empty{color:var(--muted);padding:12px 0}
.addday{margin-top:12px;width:100%}
</style>
</head>
<body>
<main>
  <section>
    <div class="controls">
      <h2 id="title"></h2>
      <div class="tcl-seg"><button id="prev" aria-label="Previous month">‹</button><button id="today">Today</button><button id="next" aria-label="Next month">›</button></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span>Free</span><span class="scale" id="scale"></span><span>Packed</span>
      <span style="margin-left:10px" class="ring"></span><span>Over <b id="capl"></b> a day</span>
      <span style="margin-left:10px">● deadline</span>
    </div>
  </section>
  <aside id="day"></aside>
</main>
<script src="../shared.js"></script>
<script>
(function(){
  const {h} = TCL;
  TCL.mount('heatmap');
  const CAP = 6 * 60; // daily capacity in minutes
  let month = TCL.sod(new Date()); month.setDate(1);
  let sel = TCL.key(new Date());
  const hidden = new Set();
  document.getElementById('capl').textContent = TCL.fmtHours(CAP);
  const heat = (m) => `color-mix(in oklab, var(--heat) ${Math.round(Math.min(1, m / CAP) * 85)}%, var(--surface))`;
  document.getElementById('scale').append(...[0, .25, .5, .75, 1].map((x) => h('i', {style: {background: heat(x * CAP)}})));

  function chips() {
    const box = document.getElementById('chips'); box.textContent = '';
    for (const [k, p] of Object.entries(TCL.PROJECTS))
      box.append(h('button', {class: 'tcl-chip' + (hidden.has(k) ? ' off' : ''), onclick: () => { hidden.has(k) ? hidden.delete(k) : hidden.add(k); render(); }},
        h('span', {class: 'tcl-dot', style: {background: p.color}}), p.name));
  }

  function render() {
    chips();
    document.getElementById('title').textContent = `${['January','February','March','April','May','June','July','August','September','October','November','December'][month.getMonth()]} ${month.getFullYear()}`;
    const start = TCL.sow(month);
    const end = TCL.addDays(start, 42);
    const occs = TCL.expand(start, end).filter((o) => !hidden.has(o.project));
    const open = occs.filter((o) => !o.done);
    const mins = TCL.minutesByDay(open);
    const dueBy = {};
    for (const o of occs) if (!o.recurring) (dueBy[TCL.key(o.due)] = dueBy[TCL.key(o.due)] || []).push(o);
    const grid = document.getElementById('grid'); grid.textContent = '';
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((d) => grid.append(h('div', {class: 'dow'}, d)));
    grid.append(h('div', {class: 'dow'}, 'Week'));
    const todayK = TCL.key(new Date());
    for (let w = 0; w < 6; w++) {
      let wk = 0;
      for (let i = 0; i < 7; i++) {
        const d = TCL.addDays(start, w * 7 + i), k = TCL.key(d), m = mins[k] || 0; wk += m;
        const dl = dueBy[k] || [];
        const dark = m / CAP > .55;
        grid.append(h('div', {
          class: 'cell' + (d.getMonth() !== month.getMonth() ? ' out' : '') + (k === todayK ? ' today' : '') + (k === sel ? ' sel' : '') + (m > CAP ? ' over' : ''),
          style: {background: heat(m), color: dark ? 'var(--paper)' : 'var(--ink)'},
          title: `${TCL.fmtDay(d)}: ${TCL.fmtHours(m)} planned, ${dl.length} deadline${dl.length === 1 ? '' : 's'}`,
          onclick: () => { sel = k; render(); if (innerWidth < 900) document.getElementById('day').scrollIntoView({behavior: 'smooth', block: 'start'}); },
        },
          h('span', {class: 'num'}, d.getDate()),
          m ? h('span', {class: 'hrs'}, TCL.fmtHours(m)) : null,
          h('div', {class: 'dots'}, dl.slice(0, 4).map((o) => h('i', {style: {background: o.color, opacity: o.done ? .35 : 1}})), dl.length > 4 ? h('em', null, '+' + (dl.length - 4)) : null)));
      }
      grid.append(h('div', {class: 'wk'}, h('b', null, Math.round(wk / 60)), 'h'));
    }
    renderDay(occs);
  }

  function renderDay() {
    const d = TCL.parse(sel), from = d, to = TCL.addDays(d, 1);
    const occs = TCL.expand(TCL.addDays(d, -60), TCL.addDays(d, 60)).filter((o) => !hidden.has(o.project));
    const planned = occs.filter((o) => o.planDay === sel).sort((a, b) => (a.start || a.due) - (b.start || b.due));
    const dueHere = occs.filter((o) => !o.recurring && TCL.key(o.due) === sel && o.planDay !== sel);
    const open = planned.filter((o) => !o.done);
    const m = open.reduce((s, o) => s + o.dur, 0);
    const box = document.getElementById('day'); box.textContent = '';
    box.append(
      h('div', {class: 'daysum'}, h('h3', null, TCL.fmtDay(d)), h('span', {class: 'tcl-muted'}, `${TCL.fmtHours(m)} of ${TCL.fmtHours(CAP)}`)),
      h('div', {class: 'meter', title: 'Planned work vs daily capacity'}, open.map((o) => h('span', {style: {width: (o.dur / Math.max(CAP, m) * 100) + '%', background: o.color}}))));
    const row = (o) => {
      const cb = h('input', {type: 'checkbox', checked: o.done, onclick: (e) => { e.stopPropagation(); TCL.toggle(o); }});
      const when = o.start ? `${TCL.fmtTime(o.start)}` : 'anytime';
      return h('div', {class: 'item' + (o.done ? ' done' : ''), onclick: () => TCL.openTask(o)},
        cb, h('div', null, h('div', {class: 't'}, o.title),
          h('div', {class: 'm'}, `${when} · ${TCL.fmtDur(o.dur)}${o.recurring ? ' · repeats' : ' · due ' + TCL.relDue(o)}`),
          h('div', {class: 'bar', style: {width: Math.min(100, o.dur / 240 * 100) + '%', background: o.color, opacity: o.done ? .3 : 1}})));
    };
    box.append(h('div', {class: 'sec'}, 'On this day'));
    if (planned.length) planned.forEach((o) => box.append(row(o))); else box.append(h('div', {class: 'empty'}, 'Nothing planned. A free day.'));
    if (dueHere.length) { box.append(h('div', {class: 'sec'}, 'Also due today, worked on another day')); dueHere.forEach((o) => box.append(row(o))); }
    box.append(h('button', {class: 'tcl-btn addday', onclick: () => TCL.openAdd({due: sel})}, '+ Add a task due this day'));
  }

  document.getElementById('prev').onclick = () => { month.setMonth(month.getMonth() - 1); render(); };
  document.getElementById('next').onclick = () => { month.setMonth(month.getMonth() + 1); render(); };
  document.getElementById('today').onclick = () => { month = TCL.sod(new Date()); month.setDate(1); sel = TCL.key(new Date()); render(); };
  TCL.onChange(render);
  render();
})();
</script>
</body>
</html>
