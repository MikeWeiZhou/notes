<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chongqing Layer Map</title>
<style>
/* Layout idea: one-screen field map. Slim header, the map fills the rest, layer switches open from the
   LAYERS button in the map's control stack, guide notes rise from the bottom (phone) or sit on the right (wide).
   Same family as the Zhangjiajie pages. */
:root{
  --paper:#eaefec; --surface:#f7faf8; --ink:#172625; --muted:#586a67; --line:#c9d4cf;
  --pine:#1c7658; --warn:#8a5a00; --warn-bg:#f6ecd2; --bad:#b23625; --bad-bg:#f6dfda; --good-bg:#dcefe6;
  --mustdo:#3a5796; --food:#c23f2d; --dessert:#8a3f8c; --hotpot:#a86400; --photo:#0d7880; --misc:#5d6470;
  --m-land:#f1f3ec; --m-out:#e2e7e2; --m-urban:#e6e7dc; --m-green:#cfe1c9; --m-water:#a8c8d6; --m-water-ink:#3f6f85;
  --m-sand:#e8dfc0; --m-bridge:#5d6c69; --m-halo:#f7faf8;
  --display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","Noto Serif SC",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101817; --surface:#182221; --ink:#e4ece8; --muted:#96a8a3; --line:#2b3a37;
    --pine:#52c79d; --warn:#f0c66a; --warn-bg:#2d2613; --bad:#f27a66; --bad-bg:#3a1c17; --good-bg:#16302a;
    --mustdo:#8eaaf0; --food:#f27a66; --dessert:#d58ad8; --hotpot:#e9a63c; --photo:#5cc7cf; --misc:#aab3c2;
    --m-land:#18211f; --m-out:#0d1413; --m-urban:#1e2927; --m-green:#1c3528; --m-water:#1d3b4b; --m-water-ink:#8fbdd3;
    --m-sand:#3a3626; --m-bridge:#93a5a0; --m-halo:#101817;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101817; --surface:#182221; --ink:#e4ece8; --muted:#96a8a3; --line:#2b3a37;
  --pine:#52c79d; --warn:#f0c66a; --warn-bg:#2d2613; --bad:#f27a66; --bad-bg:#3a1c17; --good-bg:#16302a;
  --mustdo:#8eaaf0; --food:#f27a66; --dessert:#d58ad8; --hotpot:#e9a63c; --photo:#5cc7cf; --misc:#aab3c2;
  --m-land:#18211f; --m-out:#0d1413; --m-urban:#1e2927; --m-green:#1c3528; --m-water:#1d3b4b; --m-water-ink:#8fbdd3;
  --m-sand:#3a3626; --m-bridge:#93a5a0; --m-halo:#101817;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden;overflow-wrap:break-word}
#app{height:100%;display:flex;flex-direction:column;position:relative}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
a{color:inherit;text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
[lang="zh"],.zh{font-family:var(--body);color:var(--muted)}
button{font:inherit;color:inherit}

.top{padding:10px 16px 6px}
.top h1{font-size:1.5rem}
.top h1 [lang="zh"]{font-size:.62em;white-space:nowrap}
.eyebrow{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border:1.5px solid var(--ink);border-radius:999px;background:var(--surface);font-weight:600;font-size:.9rem;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--surface)}

/* layers panel: opens beside the control stack, above the map and the sheet; engine.js sets top/left/right/max-height */
.lpanel{position:absolute;z-index:8;top:70px;right:60px;width:252px;max-width:calc(100% - 70px);display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.lpanel[hidden]{display:none}
.lp-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;padding:0 5px 0 12px;border-bottom:1px solid var(--line)}
#layerClose{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1rem;cursor:pointer;line-height:1;padding:0}
.chips{display:flex;flex-direction:column;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.chip{flex:none;display:flex;align-items:center;gap:9px;width:100%;min-height:46px;padding:6px 12px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.9rem;font-weight:600;text-align:left;cursor:pointer}
.chip:first-child{border-top:0}
.chip .lbl{flex:1;min-width:0}
.chip .cnt{flex:none;font-variant-numeric:tabular-nums;font-weight:600;font-size:.78rem;padding:0 6px;border-radius:999px;background:var(--paper);color:var(--muted)}
.chip svg{flex:none;opacity:.45}
.chip::after{content:"";flex:none;width:32px;height:18px;border-radius:999px;background:radial-gradient(circle at 9px 50%,var(--surface) 6px,transparent 6.6px) var(--muted);opacity:.55}
.chip[aria-pressed="true"]{color:var(--ink)}
.chip[aria-pressed="true"] svg{opacity:1}
.chip[aria-pressed="true"]::after{background:radial-gradient(circle at 23px 50%,var(--surface) 6px,transparent 6.6px) var(--ink);opacity:1}
.chip.sub{padding-left:35px;background:var(--paper);font-size:.84rem}
.chip:disabled{cursor:default}
.chip:disabled > *,.chip:disabled::after{opacity:.4}

.mapwrap{flex:1;min-height:0;position:relative;border-top:1px solid var(--line);background:var(--m-out);overflow:hidden}
#map{display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif}
#map:active{cursor:grabbing}
.ctrl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.ctrl button{position:relative;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;font-weight:600;cursor:pointer;display:grid;place-items:center;padding:0}
.ctrl button small{font-size:.62rem;font-weight:700;letter-spacing:.02em}
#zlayers small{font-size:.56rem;letter-spacing:0}
#zlayers[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.lbadge{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;border:1.5px solid var(--surface);background:var(--ink);color:var(--surface);font-size:.64rem;font-weight:700;line-height:15px;text-align:center;font-variant-numeric:tabular-nums;pointer-events:none}
/* the block stops short of the floating List button: 12 gap + button (--fab-w) + 12 clear + 10 left inset */
.mapfoot{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;max-width:calc(100% - var(--fab-w) - 34px)}
.key{font-size:.7rem;line-height:1.35;color:var(--ink);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.key b{font-weight:700}
.scale{display:flex;align-items:flex-end;gap:6px;font-size:.7rem;font-variant-numeric:tabular-nums;color:var(--ink)}
#scalebar{height:6px;border:1.5px solid var(--ink);border-top:0;min-width:20px}
.north{font-size:.68rem;font-weight:700;letter-spacing:.05em}
#empty{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.9rem;color:var(--muted);text-align:center;max-width:260px}
body.sheet-open .mapfoot{display:none}
/* floating List button: pinned to the map area's bottom-right corner, under the sheet (5) and the layers panel (8).
   On a phone it is hidden while any sheet is open (the sheet has its own close and back buttons). */
.mapwrap{--fab-w:96px}
#btnList{position:absolute;z-index:3;right:12px;bottom:12px;min-height:46px;min-width:var(--fab-w);padding:8px 18px 8px 15px;gap:8px;border-color:var(--ink);background:var(--ink);color:var(--surface);font-size:.95rem;box-shadow:0 0 0 2px var(--m-halo)}
#btnList svg{flex:none}
#btnList:focus-visible{border-radius:999px;outline:2px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 3px var(--surface)}
body.sheet-open #btnList{display:none}

/* map paint */
.m-out{fill:var(--m-out)} .m-land{fill:var(--m-land)} .m-urban{fill:var(--m-urban)} .m-green{fill:var(--m-green)}
.m-water{fill:var(--m-water)}
.m-sand{fill:var(--m-sand)}
.m-water-edge{fill:none;stroke:var(--m-water-ink);stroke-opacity:.45;stroke-width:2;vector-effect:non-scaling-stroke}
.l-labels g,.st-label{transition:opacity .15s}
.m-bridge-case{stroke:var(--m-halo);stroke-width:5;vector-effect:non-scaling-stroke;stroke-linecap:butt}
.m-bridge{stroke:var(--m-bridge);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linecap:butt}
.m-bridge.rail{stroke-dasharray:5 3}
.m-metro-case{fill:none;stroke:var(--m-halo);stroke-width:4;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.m-metro{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;opacity:.62}
.m-cable{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:2 4;vector-effect:non-scaling-stroke}
.m-station{fill:var(--m-halo);stroke:var(--ink);stroke-width:1.2}
.m-hub{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
text{paint-order:stroke;stroke:var(--m-halo);stroke-width:3px;stroke-linejoin:round;fill:var(--ink)}
.t-district{font-size:11px;font-weight:700;letter-spacing:.22em;fill:var(--muted);opacity:.8}
.t-district.zh{font-size:9px;letter-spacing:.2em}
.t-water{font-size:11px;font-style:italic;fill:var(--m-water-ink);stroke:none;letter-spacing:.12em}
.t-area{font-size:12px;font-weight:700}
.t-area.zh{font-size:10.5px;font-weight:500;fill:var(--muted)}
.t-area.r1{font-size:13.5px}
.t-area.r3{font-size:11px;font-weight:600}
.t-area.zh.r3{font-size:10px;font-weight:500}
.t-bridge{font-size:9.5px;fill:var(--muted)}
.t-station{font-size:10px;fill:var(--muted)}
.t-hub{font-size:10.5px;font-weight:600}
.t-hubglyph{font-size:9px;font-weight:700;stroke:none}
.m-hotel-halo{fill:var(--m-halo);stroke:var(--ink);stroke-width:1.5}
.m-hotel{fill:var(--ink)} .m-hotel-door{fill:var(--m-halo)}
.t-hotel{font-size:11.5px;font-weight:700}
.pin{cursor:pointer}
.pin-shape{stroke:var(--m-halo);stroke-width:2}
.pin-mustdo{fill:var(--mustdo)} .pin-food{fill:var(--food)} .pin-dessert{fill:var(--dessert)} .pin-hotpot{fill:var(--hotpot)}
.pin-photo{fill:var(--photo)} .pin-misc{fill:var(--misc)}
.pin-food.mild{fill:var(--m-halo);stroke:var(--food);stroke-width:2.4}
.pin-n{font-size:10px;font-weight:700;fill:var(--m-halo);stroke:none;font-variant-numeric:tabular-nums}
.pin-n.mild{fill:var(--food)}
.pin-badge{stroke:var(--m-halo);stroke-width:1.2}
.pin-badge.mixed{fill:var(--warn)} .pin-badge.skip{fill:var(--ink)}
.pin-badge-t{font-size:8.5px;font-weight:800;fill:var(--m-halo);stroke:none}
.pin-sel{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-dasharray:3 3;display:none}
.pin.selected .pin-sel{display:block}
.pin-approx{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:2 3}
.pin-arrow{fill:var(--ink);stroke:var(--m-halo);stroke-width:1}
.t-pin{font-size:11.5px;font-weight:600}
.t-pin.sub{font-size:9.5px;font-weight:500;fill:var(--muted)}
.chip .pin-shape,.ltag .pin-shape,.row .pin-shape,.lsec h3 .pin-shape{stroke:none}
.chip .pin-food.mild,.ltag .pin-food.mild,.row .pin-food.mild{stroke:var(--food);stroke-width:2.4;fill:var(--surface)}

/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:58%;display:flex;flex-direction:column;background:var(--surface);border-top:1.5px solid var(--ink);border-radius:16px 16px 0 0;z-index:5}
.sheet[hidden]{display:none}
.sheet.tall{max-height:90%}
.sheet[data-mode="list"]{max-height:82%}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:4px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-tt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.sheet-head h2{font-size:1.5rem;padding-top:4px}
#sheetBack{min-height:36px;padding:4px 14px 4px 10px;margin-top:2px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:.86rem;font-weight:600;cursor:pointer;white-space:nowrap}
#sheetBack[hidden]{display:none}
.sheet-head .t-zh{display:block;font-size:.66em;line-height:1.3;margin-top:3px;font-family:var(--body);user-select:all;-webkit-user-select:all}
#sheetGrab{display:block;width:100%;height:20px;border:0;background:none;cursor:pointer;padding:0}
#sheetGrab::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
#sheetClose{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1.1rem;cursor:pointer;line-height:1}
#sheetBody > *{flex-shrink:0}
.lsec > *{flex-shrink:0}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px}
.p-tags{display:flex;flex-wrap:wrap;gap:6px}
.ltag{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--paper)}
.ltag.plain{color:var(--muted)}
.p-where{font-size:.9rem;color:var(--muted)}
.approx{font-size:.88rem;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 10px}
.p-what{font-size:1rem}
.p-what .from{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.p-verdict{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.86rem}
.vline{color:var(--muted);font-variant-numeric:tabular-nums}
.vcount{font-weight:600;color:var(--ink)}
.c-for{color:var(--pine)} .c-mixed{color:var(--warn)} .c-against{color:var(--bad)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;white-space:nowrap}
.tag.v-good,.tag.s-for{background:var(--good-bg);color:var(--pine)}
.tag.v-mixed,.tag.s-mixed{background:var(--warn-bg);color:var(--warn)}
.tag.v-skip,.tag.s-against{background:var(--bad-bg);color:var(--bad)}
.tag.s-neutral{background:var(--paper);color:var(--muted)}
.guide{border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:10px;background:var(--paper);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.guide-h{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.guide h4{margin:6px 0 0;font-size:.92rem;font-weight:700}
.guide h4.g-good{color:var(--pine)} .guide h4.g-bad{color:var(--bad)}
.guide ul,.tips ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.posts-h{margin:4px 0 0;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.posts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.posts li{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.posts li:first-child{border-top:0}
.posts a{display:flex;gap:8px;align-items:baseline;font-weight:600;font-size:.93rem;color:var(--mustdo)}
.plat{flex:none;font-size:.66rem;font-weight:800;letter-spacing:.04em;border:1.2px solid var(--ink);border-radius:4px;padding:0 5px;text-decoration:none;display:inline-block}
.pt{overflow-wrap:anywhere}
.pmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.78rem;color:var(--muted)}
.psays{font-size:.88rem;color:var(--ink)}
.fine{font-size:.78rem;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rows li{border-top:1px solid var(--line)} .rows li:first-child{border-top:0}
.row{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:0;text-align:left;cursor:pointer;min-height:52px}
.row svg{flex:none}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-t{font-weight:600;font-size:.95rem}
.row-t .t-zh{font-weight:400;font-size:.85em}
.row-s{font-size:.8rem;color:var(--muted)}
.row-go{color:var(--muted);font-size:1.2rem}
.lsec{display:flex;flex-direction:column;gap:10px}
.lsec + .lsec{margin-top:10px}
.lsec h3{font-size:1.35rem;display:flex;align-items:center;gap:8px}
.lsum{font-size:.9rem;color:var(--muted)}
.tips{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0}
.tips summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:.9rem}
.tips ul{padding:0 12px 12px 30px}
.ref{font-size:.74rem;font-weight:700;color:var(--mustdo);white-space:nowrap;text-decoration:underline;text-underline-offset:2px}
.ref.in{font-size:.92em}
li .ref,.p-what .ref{display:inline-block;padding:1px 0}
.copyname{display:flex;flex-direction:column;gap:2px;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--paper)}
.copyname .lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.copyname .cn{font-size:1.35rem;line-height:1.3;color:var(--ink);user-select:all;-webkit-user-select:all}
.about p,.about li{font-size:.88rem;color:var(--muted)}
.about ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.metro-key{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem}
.metro-key span{display:inline-flex;align-items:center;gap:5px}
.metro-key i{display:inline-block;width:18px;height:4px;border-radius:2px}

@media (min-width:900px){
  .sheet,.sheet.tall,.sheet[data-mode="list"]{left:auto;right:12px;top:66px;bottom:12px;width:400px;max-height:none;border:1.5px solid var(--ink);border-radius:14px}
  #sheetGrab{display:none}
  .sheet-head{padding-top:12px}
  .ctrl{right:auto;left:10px}
  .lbadge{left:auto;right:-6px}
  /* panel open: the button moves left of it (400 + 12 + 12) and may read "Close list" (about 126 wide) */
  body.sheet-open .mapfoot{display:flex;max-width:calc(100% - 580px)}
  body.sheet-open #btnList{display:inline-flex;right:424px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="eyebrow">Field map · built from 582 posts</div>
    <h1>Chongqing Layer Map <span lang="zh">重庆</span></h1>
  </header>
  <main class="mapwrap" id="mapwrap">
    <svg id="map" role="img" aria-label="Drawn map of central Chongqing with the Yangtze and Jialing rivers, bridges, metro lines and research pins. Use the List button for a text version."><g id="world"></g></svg>

11524,"y0":5321,"x1":17238,"y1":9534}},"hotel":{"x":15669,"y":9037,"en":"Sheraton Chongqing Hotel","zh":"重庆喜来登大酒店","where":"78 Nanbin Road 南滨路78号, Nan'an 南岸, on the south bank of the Yangtze.","note":"Your base. Tap HOTEL on the map to come back here."},"layerOrder":["mustdo","food","dessert","hotpot","photo","misc"],"layers":{"mustdo":{"label":"Must-dos","pages":[{"summary":"For a first visit the core is Hongyadong at night, the Liziba train-through-a-building and the Yangtze cableway, but each comes with heavy crowd or queue warnings, so posts suggest viewing Hongyadong from Qiansimen Bridge or across the river and boarding the cableway at the South Station. Quieter old lanes such as Xiahaoli win praise on every platform, Ciqikou is widely called commercial and skippable, and opinion splits on Shibati (XHS negative, other platforms positive).","url":"https://notes.bunnylog.ca/quick-chongqing/1-must-dos-in-chongqing.html","posts":120,"nonspicy":false,"title":"What are the must-dos in Chongqing?"}],"tips":[{"tip":"See Hongyadong's night lights from outside rather than going in: walk Qiansimen Bridge or cross the river to Jiangtan Park (navigate to the Grand Theater / Metro Line 6 Grand Theater Station).","refs":[{"ref":"XHS 12","url":"https://www.rednote.com/discovery/item/69dcba11000000001e00e3ac?xsec_token=ABA-pkcijxDjeAdaFtCC59ANe9fkra8tYYack5Yc-FFs8=&xsec_source=pc_search&type=video"},{"ref":"XHS 17","url":"https://www.rednote.com/discovery/item/6ab520ae0000000015016a8d?xsec_token=ABBtLq9MpL51JAPaluzb6CXX1VWIoctE_x9VAJM1mXj2g=&xsec_source=pc_search&type=video"},{"ref":"XHS 29","url":"https://www.rednote.com/discovery/item/6abf94300000000015008149?xsec_token=ABAv8rWbY-cIOdyp661c1ujChR0U-yjT3PIwvOmgJtLds=&xsec_source=pc_search&type=video"},{"ref":"YT 17","url":"https://www.youtube.com/watch?v=R_XTyLYCuFs"}],"nonspicy":false},{"tip":"If you ride the Yangtze cableway, board at the South Station; the North Station can mean hours of queueing (one post says three hours for a three-minute ride).","refs":[{"ref":"TT 3","url":"https://www.tiktok.com/@hello.china.guide3/video/7704643118515244294"},{"ref":"TT 12","url":"https://www.tiktok.com/@wandriftchina8/video/7664921117026503958"},{"ref":"IG 12","url":"https://www.instagram.com/reel/DOZ4HMljOBg/"},{"ref":"IG 18","url":"https://www.instagram.com/reel/DbAr3yGg8iX/"}],"nonspicy":false},{"tip":"Treat Liziba as a quick look in passing, not a special trip: the train passes in 10-20 seconds and the spot is crowded.","refs":[{"ref":"XHS 6","url":"https://www.rednote.com/discovery/item/6a4f155b0000000007029e60?xsec_token=ABs-rYyTWGEk8mnS8CFmOV1TexOQ5wVO1Oht2KUfsyNuA=&xsec_source=pc_search&type=normal"},{"ref":"YT 4","url":"https://www.youtube.com/watch?v=klUaUfGuMh4"},{"ref":"YT 7","url":"https://www.youtube.com/watch?v=P2E9j_KUF7o"},{"ref":"TT 20","url":"https://www.tiktok.com/@allen.fu88/video/7579538928235990284"}],"nonspicy":false},{"tip":"With only 1-2 days, skip Ciqikou: about an hour by metro from Jiefangbei and widely called commercial.","refs":[{"ref":"YT 21","url":"https://www.youtube.com/watch?v=UaEDJZYzrAk"},{"ref":"XHS 12","url":"https://www.rednote.com/discovery/item/69dcba11000000001e00e3ac?xsec_token=ABA-pkcijxDjeAdaFtCC59ANe9fkra8tYYack5Yc-FFs8=&xsec_source=pc_search&type=video"},{"ref":"TT 30","url":"https://www.tiktok.com/@chongqing_insights/video/7665915613537225998"}],"nonspicy":false},{"tip":"Quieter old-Chongqing alternatives the posts favour: Xiahaoli, the Mountain City Trail, Baixiangju and (outside XHS) Shibati.","refs":[{"ref":"XHS 24","url":"https://www.rednote.com/discovery/item/68285a48000000000303f144?xsec_token=ABHKVoxF3bWQG7zu_czqNo-zy9-je9nAzNzhn5Wnsc9Ko=&xsec_source=pc_search&type=normal"},{"ref":"XHS 19","url":"https://www.rednote.com/discovery/item/6a79b9580000000006006dd1?xsec_token=ABX1kWOPU7T_SN_c26OvLEPVwRqxMpShtXb-EKnjl3r7I=&xsec_source=pc_search&type=video"},{"ref":"XHS 14","url":"https://www.rednote.com/discovery/item/6a3d0509000000000f00676a?xsec_token=ABBw5A_QZAL9ol1zEybgHWEHSwLvVUIf6um30UshGVHcg=&xsec_source=pc_search&type=video"},{"ref":"TT 8","url":"https://www.tiktok.com/@nom_life/video/7625481976463576350"}],"nonspicy":false},{"tip":"Walk between Jiefangbei and Hongyadong instead of calling a taxi; a 10-minute shortcut exists, and the central famous spots can be linked entirely on foot.","refs":[{"ref":"TT 18","url":"https://www.tiktok.com/@chinatravel_lily/video/7603770056748682510"},{"ref":"IG 21","url":"https://www.instagram.com/reel/DT-glj0gIPK/"},{"ref":"IG 23","url":"https://www.instagram.com/reel/DRBHmDUEilA/"},{"ref":"TT 10","url":"https://www.tiktok.com/@chinatravel_lily/video/7602615706030558477"}],"nonspicy":false},{"tip":"Plan the visiting order: the city is hilly, so sequence stops to walk downhill, avoid backtracking and skip uphill climbs.","refs":[{"ref":"XHS 27","url":"https://www.rednote.com/discovery/item/694e78ae000000001f0056f6?xsec_token=ABgD0nWnNNtrF_4VflI5wwAn3NGx71MxVxiRPo-JUzLno=&xsec_source=pc_search&type=video"},{"ref":"XHS 10","url":"https://www.rednote.com/discovery/item/6aa6b321000000002802e401?xsec_token=ABPjSPOqshV5MLryYsZ6173X8BusSIGmGhUVWFPLMOWPA=&xsec_source=pc_search&type=normal"},{"ref":"IG 29","url":"https://www.instagram.com/reel/DY3toPuvmjm/"},{"ref":"YT 4","url":"https://www.youtube.com/watch?v=klUaUfGuMh4"}],"nonspicy":false},{"tip":"Crowds peak on holidays and at peak hours at the headline sights; be prepared or go off-peak.","refs":[{"ref":"YT 19","url":"https://www.youtube.com/watch?v=gN_N9BVIucg"},{"ref":"TT 12","url":"https://www.tiktok.com/@wandriftchina8/video/7664921117026503958"},{"ref":"IG 26","url":"https://www.instagram.com/reel/DSVA9beEq4b/"}],"nonspicy":false},{"tip":"There is a Saturday drone show; one XHS video covers where to watch it.","refs":[{"ref":"XHS 20","url":"https://www.rednote.com/discovery/item/692004fc000000001d038ac3?xsec_token=ABpfYfMK4vDdhylUazUZHG_3ikj7Tk_K6TBy0wdIfJCO0=&xsec_source=pc_search&type=video"}],"nonspicy":false},{"tip":"Trip length opinions: 2 days is enough for a first visit and 3 is ideal; 3 days is enough; 3-4 days is perfect; one visitor found 3.5 days too short and wanted 1-2 more.","refs":[{"ref":"TT 13","url":"https://www.tiktok.com/@chongqing_insights/video/7684281221907500301"},{"ref":"XHS 5","url":"https://www.rednote.com/discovery/item/6ac99dcf0000000018005bf1?xsec_token=ABkFxAE6Chs27Pdn7GFMgJMvOr3H8YIp8dpVqNRBo-3V0=&xsec_source=pc_search&type=normal"},{"ref":"IG 20","url":"https://www.instagram.com/reel/DV8Pvlekqk-/"},{"ref":"IG 28","url":"https://www.instagram.com/p/DVsO9yyk6jK/"}],"nonspicy":false}],"unpinned":[{"en":"Raffles City skywalk","zh":"","note":"Skywalk at Raffles City. One TikTok post tags it without saying whether it is worth it.","stance":"for","refs":[{"ref":"TT 26","url":"https://www.tiktok.com/@llumarshh/video/7671346281859566880"}],"nonspicy":false}],"once":[{"en":"360° rotating theater (viral show)","zh":"","note":"Show in a rotating 360-degree theater; venue name not given in the research notes.","stance":"for","refs":[{"ref":"TT 25","url":"https://www.tiktok.com/@yumiliving/video/7638354891253058824"}],"nonspicy":false},{"en":"Chongqing zoo (listed only as 'zoo')","zh":"","note":"Zoo rated in a red/black list of 13 sights.","stance":"neutral","refs":[{"ref":"XHS 20","url":"https://www.rednote.com/discovery/item/692004fc000000001d038ac3?xsec_token=ABpfYfMK4vDdhylUazUZHG_3ikj7Tk_K6TBy0wdIfJCO0=&xsec_source=pc_search&type=video"}],"nonspicy":false},{"en":"Three Gorges Museum","zh":"三峡博物馆","note":"Museum rated in a red/black list of 13 sights.","stance":"neutral","refs":[{"ref":"XHS 20","url":"https://www.rednote.com/discovery/item/692004fc000000001d038ac3?xsec_token=ABpfYfMK4vDdhylUazUZHG_3ikj7Tk_K6TBy0wdIfJCO0=&xsec_source=pc_search&type=video"}],"nonspicy":false},{"en":"Yuzhong district","zh":"渝中","note":"Central district that one note says out-of-town visitors should focus on. Where: District of the city (渝中); no further location given.","stance":"for","refs":[{"ref":"XHS 17","url":"https://www.rednote.com/discovery/item/6ab520ae0000000015016a8d?xsec_token=ABBtLq9MpL51JAPaluzb6CXX1VWIoctE_x9VAJM1mXj2g=&xsec_source=pc_search&type=video"}],"nonspicy":false}],"dishes":[]},"food":{"label":"Food","pages":[{"summary":"Hotpot and xiaomian are the clear must-eats, followed by jianghu cuisine, douhua fan and hot-and-sour noodles. Across the platforms, posters steer visitors toward small shops in residential blocks and local neighbourhoods and away from places beside the sights. The snack streets (Guanyinqiao, Bayi/Jiefangbei) and the air-raid-shelter hotpot attract the tourist-trap warnings.","url":"https://notes.bunnylog.ca/quick-chongqing/2-where-must-eats-in-chongqing.html","posts":118,"nonspicy":false,"title":"What and where are the must-eats in Chongqing?"},{"summary":"Eating without heat in Chongqing means choosing dishes that are mild by nature (pig-trotter soup, old-duck or lotus-root soup pots, tofu pudding, yogurt and sweet snacks) or falling back on hotel and Cantonese restaurants. Named shops cluster around Jiefangbei, Guanyinqiao and Qixinggang. Every platform warns that ordering 'mild' (微辣) still comes out hot, so pick a split pot or a naturally non-spicy dish instead.","url":"https://notes.bunnylog.ca/quick-chongqing/3-where-non-spicy-must-eats.html","posts":119,"nonspicy":true,"title":"What and where are the non-spicy must-eats in Chongqing?"}],"tips":[{"tip":"Pick small shops in local neighbourhoods and housing blocks for hotpot and noodles, not ones beside the sights; several locals say the best food is in old housing blocks, by community gates and in small street shops.","refs":[{"ref":"XHS 18","url":"https://www.rednote.com/discovery/item/6a1d0e7c0000000036032b54?xsec_token=ABSCdWs1Hbihs7A7SXVKWXFMXlu04oz3usiF7WRHlOXOA=&xsec_source=pc_search&type=video"},{"ref":"XHS 26","url":"https://www.rednote.com/discovery/item/6a621660000000001c00d5c3?xsec_token=ABANxzHqgdfISr5U361R0QZm-uodkT9rZjaVF8zfHtNEs=&xsec_source=pc_search&type=normal"},{"ref":"XHS 21","url":"https://www.rednote.com/discovery/item/69048a5d0000000003011649?xsec_token=ABVm1cgdE31g8poAy-NNLDnArNZWpPZXzQl9yz5cdJwiQ=&xsec_source=pc_search&type=video"},{"ref":"XHS 16","url":"https://www.rednote.com/discovery/item/69e9f8240000000011020000?xsec_token=ABm6-F5sJyM1JGzLHdS0cVJUKWUZr_OAemWNNeaBnGUj0=&xsec_source=pc_search&type=video"}],"nonspicy":false},{"tip":"Hotpot at tourist attractions is described as overpriced and bad; skip polished chains around the sights.","refs":[{"ref":"TT 20","url":"https://www.tiktok.com/@nwtubsbu79ay/video/7650324732298022158"},{"ref":"TT 6","url":"https://www.tiktok.com/@uuu31404/photo/7687947298634009874"}],"nonspicy":false},{"tip":"Near Jiefangbei, one reviewer avoids any hotpot whose name contains 防空洞, 社区, 九宫格, 城门, 十八梯 or words like 孃孃/姐姐/妈/婆婆, calling them pricey with average portions. This blanket rule would also catch some shops other posts recommend.","refs":[{"ref":"XHS 28","url":"https://www.rednote.com/discovery/item/6abcebd800000000150057a1?xsec_token=AB4GczGJepOsBlM4hVSactONlXWLgBlpqsTePbcrs0FKc=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"tip":"Snack streets inside shopping districts (Guanyinqiao Haochi Jie, Bayi / Jiefangbei food street) draw overpriced-and-mediocre warnings; roadside stalls are said to be cheaper and better (4-yuan vs 12-yuan shaopi).","refs":[{"ref":"XHS 27","url":"https://www.rednote.com/discovery/item/69a8f14f0000000015021cc5?xsec_token=ABLiy-XOk1pD5rqAXj3q_cZUcuvoXrPewkBPjM1QlD0aA=&xsec_source=pc_search&type=normal"},{"ref":"YT 12","url":"https://www.youtube.com/watch?v=5as0n8EqPYM"},{"ref":"TT 23","url":"https://www.tiktok.com/@wandriftchina8/video/7664921117026503958"}],"nonspicy":false},{"tip":"Viral snacks at scenic areas are often pre-made, marked up and ordinary; scenic-area bingfen, small rice balls and Guanyinqiao iced slush are rated average.","refs":[{"ref":"XHS 30","url":"https://www.rednote.com/discovery/item/6ab7ca9e000000001501175d?xsec_token=ABD546Lq77AqlS4CtXWWLH30rCS_tVSRSeJIhlGjoMwp8=&xsec_source=pc_search&type=normal"},{"ref":"XHS 29","url":"https://www.rednote.com/discovery/item/6a39ca6b00000000110047ed?xsec_token=AB59SZsviT_sDi9R9zIyK2YmTRYyBeIPIbItZmhkj-FBM=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"tip":"Price anchors: xiaomian 10 yuan and wanza mian 13 yuan at Super Li; US$5 buys a lot of freshly made food; a full meal can cost about US$1.","refs":[{"ref":"YT 4","url":"https://www.youtube.com/watch?v=XKrpbSG_27Q"},{"ref":"IG 11","url":"https://www.instagram.com/reel/DIh2xJzvH4Z/"},{"ref":"IG 10","url":"https://www.instagram.com/reel/DI1Wv9YRSOR/"},{"ref":"YT 23","url":"https://www.youtube.com/watch?v=QqYbleOPXdo"}],"nonspicy":false},{"tip":"Xiaomian is a spicy breakfast food; breakfast round-ups favour cheap community shops locals use.","refs":[{"ref":"IG 26","url":"https://www.instagram.com/p/CJqwIJHFZWA/"},{"ref":"XHS 16","url":"https://www.rednote.com/discovery/item/69e9f8240000000011020000?xsec_token=ABm6-F5sJyM1JGzLHdS0cVJUKWUZr_OAemWNNeaBnGUj0=&xsec_source=pc_search&type=video"},{"ref":"IG 13","url":"https://www.instagram.com/reel/DTbu2EJEutT/"}],"nonspicy":false},{"tip":"Halal options: a street at Jiaochangkou with many Hui Muslim restaurants, plus halal noodles, wontons and hotpot covered by two creators.","refs":[{"ref":"TT 13","url":"https://www.tiktok.com/@journeyofjackson/video/7602324809288076558"},{"ref":"YT 7","url":"https://www.youtube.com/watch?v=kXpspZo4cVA"},{"ref":"IG 23","url":"https://www.instagram.com/reel/DU2uYLBkaR6/"}],"nonspicy":false},{"tip":"Late-night barbecue and night markets get strong praise despite some calling the barbecue overrated.","refs":[{"ref":"TT 21","url":"https://www.tiktok.com/@theemptybowlclub/video/7675194224949726485"},{"ref":"TT 25","url":"https://www.tiktok.com/@chinapie.travel/video/7697799025541598495"},{"ref":"TT 26","url":"https://www.tiktok.com/@petri_nah/video/7673094042011323670"}],"nonspicy":false},{"tip":"A 'mild' or 微辣 order still arrives hot: creators on every platform found the lowest level very spicy, so do not rely on it.","refs":[{"ref":"XHS 19 (non-spicy page)","url":"https://www.rednote.com/discovery/item/6720ded5000000001b02e9d6?xsec_token=ABsj92cjokoRfp3sgFvu_Mv-nUpdeMOaGJUFSe6aAOnJY=&xsec_source=pc_search&type=video"},{"ref":"YT 13 (non-spicy page)","url":"https://www.youtube.com/watch?v=pa4gDRRYzTU"},{"ref":"YT 26 (non-spicy page)","url":"https://www.youtube.com/watch?v=MQki_U1IGoc"},{"ref":"YT 22 (non-spicy page)","url":"https://www.youtube.com/watch?v=L5BSbdrm0Wo"}],"nonspicy":true},{"tip":"At hotpot the lowest level (微微辣) still has chili in it; ask for a split yuanyang pot (鸳鸯锅) instead.","refs":[{"ref":"XHS 21 (non-spicy page)","url":"https://www.rednote.com/discovery/item/66e934990000000012011e92?xsec_token=AB7GY7c6ZpBX1NrpuxfdWkyDxJc0yaJhYvWsTZqFB7kb0=&xsec_source=pc_search&type=video"},{"ref":"XHS 25 (non-spicy page)","url":"https://www.rednote.com/discovery/item/6a901d5d000000002c03ef0b?xsec_token=ABBF5f2QG7PZHu0dzACBNnUc5aYZ03xhTA7rAdLpM43aE=&xsec_source=pc_search&type=video"},{"ref":"XHS 24 (non-spicy page)","url":"https://www.rednote.com/discovery/item/6a5628c10000000017008169?xsec_token=ABC_-r3Qs5zosqeCMy4B8FaVvN7uca2HUHWIOk3tt4IuI=&xsec_source=pc_search&type=video"},{"ref":"TT 13 (non-spicy page)","url":"https://www.tiktok.com/@miracletourcn0/video/7644754784007818527"}],"nonspicy":true},{"tip":"Tomato or mushroom broth is the safe hotpot base for people who cannot take heat.","refs":[{"ref":"YT 2 (non-spicy page)","url":"https://www.youtube.com/watch?v=i1WRqjXovoI"},{"ref":"YT 22 (non-spicy page)","url":"https://www.youtube.com/watch?v=L5BSbdrm0Wo"},{"ref":"TT 13 (non-spicy page)","url":"https://www.tiktok.com/@miracletourcn0/video/7644754784007818527"}],"nonspicy":true},{"tip":"Look for restaurant signs reading 老鸭汤 (Lao Ya Tang): old duck soup with sour radish is a clear, non-spicy hotpot-style meal.","refs":[{"ref":"TT 1 (non-spicy page)","url":"https://www.tiktok.com/@thechongqingguy/video/7674272424506199298"},{"ref":"IG 2 (non-spicy page)","url":"https://www.instagram.com/reel/DcEKGS7M5Q6/"},{"ref":"TT 5 (non-spicy page)","url":"https://www.tiktok.com/@94596534b37/video/7629760502780022038"},{"ref":"IG 9 (non-spicy page)","url":"https://www.instagram.com/reel/DfXQYlnyEh5/"}],"nonspicy":true},{"tip":"Dishes that are non-spicy by nature are safer than asking a spicy dish to be toned down: trotter soup, duck or lotus-root soup pots, tofu pudding, tomato-egg, steamed pork belly, yogurt and sweet snacks.","refs":[{"ref":"XHS 19 (non-spicy page)","url":"https://www.rednote.com/discovery/item/6720ded5000000001b02e9d6?xsec_token=ABsj92cjokoRfp3sgFvu_Mv-nUpdeMOaGJUFSe6aAOnJY=&xsec_source=pc_search&type=video"},{"ref":"XHS 27 (non-spicy page)","url":"https://www.rednote.com/discovery/item/6811f310000000002301440f?xsec_token=ABJJvbEnu1ENsXrBL2ivzEane-L0Ia6ph32TMrkHPrfII=&xsec_source=pc_search&type=normal"},{"ref":"IG 9 (non-spicy page)","url":"https://www.instagram.com/reel/DfXQYlnyEh5/"},{"ref":"YT 8 (non-spicy page)","url":"https://www.youtube.com/watch?v=2lZkERdMzqE"}],"nonspicy":true},{"tip":"'Not spicy' does not always mean zero chili, chili oil or Sichuan pepper; say so explicitly if you want none.","refs":[{"ref":"TT 2 (non-spicy page)","url":"https://www.tiktok.com/@chongqingwithlin633/photo/7673395466595241230"},{"ref":"TT 21 (non-spicy page)","url":"https://www.tiktok.com/@nellschina/video/7696069300410518797"}],"nonspicy":true},{"tip":"The phrase 不要辣 (no spice) gets heavy use, and one traveller could order almost any normally spicy dish without spice.","refs":[{"ref":"TT 14 (non-spicy page)","url":"https://www.tiktok.com/@nipponpaintsg/video/7601092639840161044"},{"ref":"TT 22 (non-spicy page)","url":"https://www.tiktok.com/@exploreoclockcom/video/7606714371674262806"}],"nonspicy":true},{"tip":"Hotel restaurants and Cantonese places in malls (Raffles City, Ring Mall, Metropolis Oriental Plaza) are the fallback for a fully non-spicy meal.","refs":[{"ref":"IG 9 (non-spicy page)","url":"https://www.instagram.com/reel/DfXQYlnyEh5/"},{"ref":"YT 4 (non-spicy page)","url":"https://www.youtube.com/watch?v=-1Wir1Hfwl4"},{"ref":"YT 5 (non-spicy page)","url":"https://www.youtube.com/watch?v=jvltZOJBvOA"},{"ref":"XHS 3 (non-spicy page)","url":"https://www.rednote.com/discovery/item/6960beaf000000000e00e17e?xsec_token=ABSUBSDJOVQ4_OEsdQ7nPdL7CAmH1uvB_qWrRCE5C1xpU=&xsec_source=pc_search&type=video"}],"nonspicy":true},{"tip":"Yogurt drinks after dinner help settle a stomach upset by spice.","refs":[{"ref":"TT 20 (non-spicy page)","url":"https://www.tiktok.com/@minjunandkevin/video/7666474012859534606"}],"nonspicy":true},{"tip":"One Instagram list says to skip several tourist snacks: 金西梅, bamboo-tube milk tea, Bayi Road fatty intestines, fried-dough rice cakes, smoking ice cream and garlic ice jelly.","refs":[{"ref":"IG 28 (non-spicy page)","url":"https://www.instagram.com/p/DA3B-iti3uF/"}],"nonspicy":true}],"unpinned":[{"en":"Dong Ma Hotpot","zh":"董妈火锅","note":"Community / neighbourhood hotpot. Hotpot; order the split yuanyang pot (鸳鸯锅). Posts place it near Jiefangbei. One post gives 临江门8号 商检大厦 for an unnamed hotpot that may be this shop, but nothing confirms it.","stance":"for","refs":[{"ref":"XHS 13","url":"https://www.rednote.com/discovery/item/6a97dfb30000000026019ec0?xsec_token=ABAU15sniDgYsozot9laq94V20MphzSPluCPDywxMlh3A=&xsec_source=pc_search&type=normal"},{"ref":"XHS 18","url":"https://www.rednote.com/discovery/item/6a1d0e7c0000000036032b54?xsec_token=ABSCdWs1Hbihs7A7SXVKWXFMXlu04oz3usiF7WRHlOXOA=&xsec_source=pc_search&type=video"},{"ref":"XHS 24","url":"https://www.rednote.com/discovery/item/6a5628c10000000017008169?xsec_token=ABC_-r3Qs5zosqeCMy4B8FaVvN7uca2HUHWIOk3tt4IuI=&xsec_source=pc_search&type=video"}],"nonspicy":true},{"en":"Bomb-shelter hotpot (Zhicheng)","zh":"地下之城老火锅","note":"Hotpot inside an abandoned air-raid shelter, with robots c_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Chunri Liangtian (romanised only)","zh":"","note":"Shop whose napoleon was rated in a three-way comparison","stance":"mixed","refs":[{"ref":"XHS 30","url":"https://www.rednote.com/discovery/item/6a22c777000000000f03ac00?xsec_token=ABulIFNwHO0z1IsHoc-JxdACDeU6_n5h8aLkKcMpiacgQ=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Youchai Cake (Postman Cake)","zh":"邮差蛋糕","note":"Cake shop at the pricier end of a cake tier list","stance":"neutral","refs":[{"ref":"XHS 5","url":"https://www.rednote.com/discovery/item/6a8da4a90000000008011636?xsec_token=ABq6XQM4Yc1CtgaVlX_o9coj3yrPdEyVOCgB9yUhTIZUI=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Tianji (melon cake)","zh":"甜集","note":"Cake shop listed for a melon cake","stance":"mixed","refs":[{"ref":"XHS 5","url":"https://www.rednote.com/discovery/item/6a8da4a90000000008011636?xsec_token=ABq6XQM4Yc1CtgaVlX_o9coj3yrPdEyVOCgB9yUhTIZUI=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Jiahe","zh":"佳禾","note":"Cake shop named as an alternative to picnic","stance":"for","refs":[{"ref":"XHS 28","url":"https://www.rednote.com/discovery/item/6aed8a1d000000001201bbe3?xsec_token=ABHQsDDamMWvLAadqAcOyAxfHVLdF3YbBzNZO-VL53A6c=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"picnic","zh":"picnic","note":"Cake shop that drew a service complaint","stance":"against","refs":[{"ref":"XHS 28","url":"https://www.rednote.com/discovery/item/6aed8a1d000000001201bbe3?xsec_token=ABHQsDDamMWvLAadqAcOyAxfHVLdF3YbBzNZO-VL53A6c=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Tai moss","zh":"苔moss","note":"Dessert shop for parfaits","stance":"for","refs":[{"ref":"XHS 24","url":"https://www.rednote.com/discovery/item/6933d2f0000000001f00d6a4?xsec_token=ABEAK5UB_1lw_6irnZfcGUxiB6xoH5v8RWkHJlfSPxHMw=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Zhongdu Yuyuan (taro-ball shop)","zh":"中度芋圆","note":"Taro-ball ice dessert shop mentioned in an ice-shop post","stance":"against","refs":[{"ref":"XHS 14","url":"https://www.rednote.com/discovery/item/6a24258a000000002201b245?xsec_token=ABxhrUi_d7-J1LOOLSMa8RBjf2bDEF5N4DgivIlPzm4nE=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Honeymoon Dessert","zh":"","note":"Dessert shop in the Jiefangbei area. Where: Jiefangbei area","stance":"for","refs":[{"ref":"IG 14","url":"https://www.instagram.com/p/DdLN4cINOLx/"}],"nonspicy":false},{"en":"fufuland","zh":"","note":"Dessert spot a poster returned to. Where: Chongqing; no further location given","stance":"for","refs":[{"ref":"IG 15","url":"https://www.instagram.com/p/DMRxWhZxaOp/"}],"nonspicy":false},{"en":"Xiaobo Teahouse - Chongqing famous snacks","zh":"小波茶馆·重庆名小吃","note":"Teahouse and local-snack spot, first in a photo post's location list","stance":"neutral","refs":[{"ref":"TT 10","url":"https://www.tiktok.com/@sweet.sunday21/photo/7497899887988690182"}],"nonspicy":false},{"en":"Xi Yue He Zi (Xiyue Box)","zh":"熹玥盒子","note":"Song-dynasty-style tea experience with DIY butterfly cakes","stance":"for","refs":[{"ref":"IG 21","url":"https://www.instagram.com/reel/DV3WiIqEwba/"}],"nonspicy":false},{"en":"ITC Glenview Plaza Chongqing (hotel)","zh":"","note":"Hotel breakfast with a colourful donut wall","stance":"neutral","refs":[{"ref":"YT 15","url":"https://www.youtube.com/watch?v=aH-g9o2PHH4"}],"nonspicy":false},{"en":"Chongqing Zoo (cute ice cream)","zh":"","note":"Cute novelty frozen treat sold at the zoo. Where: Chongqing Zoo","stance":"for","refs":[{"ref":"IG 16","url":"https://www.instagram.com/p/DbK--DUjepD/"}],"nonspicy":false},{"en":"Hongyadong (landmark ice cream)","zh":"","note":"Ice cream themed on the Hongyadong landmark","stance":"neutral","refs":[{"ref":"IG 24","url":"https://www.instagram.com/p/Ci1U15wrjrc/"}],"nonspicy":false},{"en":"Chongqing 'daji' market stall","zh":"重庆大集","note":"Market stall selling lianggao, bingfen, liangxia and sago, everything 3 yuan","stance":"for","refs":[{"ref":"IG 18","url":"https://www.instagram.com/reel/DcUdJuhPmur/"}],"nonspicy":false},{"en":"33-year-old old-style summer dessert shop (unnamed)","zh":"","note":"Old-fashioned shop for liangxia, lianggao and bingfen","stance":"for","refs":[{"ref":"XHS 15","url":"https://www.rednote.com/discovery/item/6a992141000000002601d860?xsec_token=ABhzeUIOsGISVSEZCY8qRUf7G40RnKS8lWqqSm_iCh7So=&xsec_source=pc_search&type=video"}],"nonspicy":false},{"en":"Twinkle Twinkle (popsicles)","zh":"","note":"Cute character-style popsicles","stance":"for","refs":[{"ref":"TT 12","url":"https://www.tiktok.com/@chongqingbeyondcyber/video/7629616629877460245"}],"nonspicy":false}],"dishes":[{"en":"Bingfen (ice jelly)","zh":"冰粉","note":"The cheap cold street sweet eaten to finish a night or cool down after spicy food; vendors are said to be everywhere. Variants seen: brown sugar, rose, guava, strawberry. One street seller carrying a back-basket even gave it away free. Prices quoted range from 3 yuan at a market stall to 15 yuan.","refs":[{"ref":"TT 3","url":"https://www.tiktok.com/@puddingjulie/video/7627051269580000530"},{"ref":"TT 6","url":"https://www.tiktok.com/@benandchelsea/video/7628368919799057695"},{"ref":"TT 1","url":"https://www.tiktok.com/@nom_life/video/7628080732329479454"}],"nonspicy":false},{"en":"Lianggao (chilled rice cake with brown sugar)","zh":"凉糕","note":"Cold, soft, springy rice jelly served with brown sugar syrup; 3 yuan at a market stall and 6 yuan at a long-running street stall. One Indonesian post mistook it for tofu and calls it chewy, cooling and sweet.","refs":[{"ref":"IG 18","url":"https://www.instagram.com/reel/DcUdJuhPmur/"},{"ref":"XHS 13","url":"https://www.rednote.com/discovery/item/6ab76e4f000000001203d217?xsec_token=ABD546Lq77AqlS4CtXWWLH39Cg7iphSCmD6pLM5Tpd92E=&xsec_source=pc_search&type=video"},{"ref":"XHS 16","url":"https://www.rednote.com/discovery/item/684bca01000000002301061b?xsec_token=ABZitcP30RmWTVyecxp9_ER9quUvhHsPbdnYE1lwgxDZI=&xsec_source=pc_search&type=video"}],"nonspicy":false},{"en":"Liangxia (cold 'shrimp' rice jelly)","zh":"凉虾","note":"Local summer snack sold alongside bingfen and lianggao; the iChongqing account suggests it when the food gets too spicy.","refs":[{"ref":"TT 8","url":"https://www.tiktok.com/@ichongqing2018/video/7677434129969106196"},{"ref":"IG 18","url":"https://www.instagram.com/reel/DcUdJuhPmur/"},{"ref":"XHS 15","url":"https://www.rednote.com/discovery/item/6a992141000000002601d860?xsec_token=ABhzeUIOsGISVSEZCY8qRUf7G40RnKS8lWqqSm_iCh7So=&xsec_source=pc_search&type=video"}],"nonspicy":false},{"en":"Sago","zh":"西米露","note":"Sold at the same 3-yuan market stall as bingfen and lianggao.","refs":[{"ref":"IG 18","url":"https://www.instagram.com/reel/DcUdJuhPmur/"}],"nonspicy":false},{"en":"Mochi / ciba dessert bowls and iced tangyuan","zh":"麻薯 / 麻糍冰汤圆","note":"The cross-platform favourite, tied mostly to 三样子: fresh mochi with taro, soybean powder, red bean or tangyuan at about ¥20 a bowl. Other posts praise fresh mochi and a cheap fruit mochi without naming a shop.","refs":[{"ref":"XHS 3","url":"https://www.rednote.com/discovery/item/6aca278e0000000018039b8e?xsec_token=ABhd-joORFKNaTATAIyAAh0cWfvSiPqIhjn4FdmCI6cH8=&xsec_source=pc_search&type=normal"},{"ref":"XHS 21","url":"https://www.rednote.com/discovery/item/6ae80b73000000001202d0eb?xsec_token=ABIfQ6ctnR5g_2GPD3hFQ4hLmNsV3KFI9aOaR_3gV761Q=&xsec_source=pc_search&type=video"},{"ref":"XHS 20","url":"https://www.rednote.com/discovery/item/680cea1a000000001202e768?xsec_token=ABfNq9DPASUpHZvK7JpSVUyyNahGmx6caAkv9PsS3ynC4=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Tangshui (sweet soups, shaved ice)","zh":"糖水","note":"Sit-down sweet-soup shops are pitched as the place to cool off after hotpot: shaved ice, mango mille crepe, yangzhi ganlu, self-serve bowls with many toppings, even a 40-yuan buffet. Around 20 yuan a head at budget shops.","refs":[{"ref":"XHS 2","url":"https://www.rednote.com/discovery/item/6a6a18eb000000000301e170?xsec_token=ABVBqLQg10C8rhJZM3t-Xz_ihbI9EJ3Y2sNLFnvbHzgwA=&xsec_source=pc_search&type=video"},{"ref":"XHS 20","url":"https://www.rednote.com/discovery/item/680cea1a000000001202e768?xsec_token=ABfNq9DPASUpHZvK7JpSVUyyNahGmx6caAkv9PsS3ynC4=&xsec_source=pc_search&type=normal"},{"ref":"XHS 22","url":"https://www.rednote.com/discovery/item/6a58ea080000000001031440?xsec_token=ABEHjQ_efQD0k8ikdeDNcqkzMUjQBaBwpoJeCC-byZ1H0=&xsec_source=pc_search&type=video"}],"nonspicy":false},{"en":"Brown sugar ciba and glutinous rice cakes","zh":"红糖糍粑","note":"Small sticky rice cakes coated in thick brown sugar syrup sold on the street for 3 or 5 yuan; glutinous rice cakes that suddenly went viral were judged really good; molten-sugar rice pancakes are called a must-try.","refs":[{"ref":"IG 19","url":"https://www.instagram.com/reel/DYL-sLFSSan/"},{"ref":"IG 1","url":"https://www.instagram.com/reel/DTJyV3Pk7r-/"},{"ref":"TT 29","url":"https://www.tiktok.com/@dansdan88888/video/7603788020793445639"}],"nonspicy":false},{"en":"Mala / chili oil / hotpot ice cream","zh":"麻辣冰淇淋","note":"Viral novelty that splits tasters. Some were surprised to like it or call it great; others say it should not exist, manage two bites, or call it a gimmick, and one commenter felt sick. Listed at 10 RMB in one post. No shop is named.","refs":[{"ref":"IG 2","url":"https://www.instagram.com/reel/DULKwKSEgZv/"},{"ref":"IG 5","url":"https://www.instagram.com/reel/DZBCtdAj7oV/"},{"ref":"IG 7","url":"https://www.instagram.com/reel/DZFCYwspdQk/"}],"nonspicy":false},{"en":"Novelty and souvenir ice cream, popsicles, puff ice cream","zh":"泡芙冰淇淋","note":"Decorated or landmark-themed ice creams are pushed as a 'souvenir', plus cute popsicles, a zoo treat and puff ice cream as an easy stop while sightseeing. Praise is mostly for looks and refreshment.","refs":[{"ref":"TT 17","url":"https://www.tiktok.com/@lauuramartiin/video/7671562977794985238"},{"ref":"TT 19","url":"https://www.tiktok.com/@valentinaurrim/video/7677472021042793750"},{"ref":"TT 12","url":"https://www.tiktok.com/@chongqingbeyondcyber/video/7629616629877460245"}],"nonspicy":false},{"en":"Napoleon (mille-feuille)","zh":"拿破仑","note":"XHS treats napoleon as a local speciality cake; 凯悦 (Hyatt) and 弓奇 are the two names to compare, with a French reviewer scoring them 8.5 and 8.","refs":[{"ref":"XHS 1","url":"https://www.rednote.com/discovery/item/6ae6c2b9000000001802af0a?xsec_token=ABdQ4LbcQaH2J2BBpgCpkyin42ReYqpZM8Xg3YuhHbM4s=&xsec_source=pc_search&type=video"},{"ref":"XHS 26","url":"https://www.rednote.com/discovery/item/6a7833280000000021020a15?xsec_token=ABMg50szBnL2zu9nKnHn1bgtfRL_XTJinyeTlfJ45nVI4=&xsec_source=pc_search&type=normal"},{"ref":"XHS 30","url":"https://www.rednote.com/discovery/item/6a22c777000000000f03ac00?xsec_token=ABulIFNwHO0z1IsHoc-JxdACDeU6_n5h8aLkKcMpiacgQ=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Cakes","zh":"蛋糕","note":"XHS has a deep cake-shop scene with tier lists; prices quoted run from 80+ to 160+ yuan, with single pastries about 40 yuan. Complaints exist: poor service at one shop, a disappointing group cake-tasting event, and reviewers who find shops ordinary and pricey. One YouTube taster found a chocolate cheesecake too sweet.","refs":[{"ref":"XHS 5","url":"https://www.rednote.com/discovery/item/6a8da4a90000000008011636?xsec_token=ABq6XQM4Yc1CtgaVlX_o9coj3yrPdEyVOCgB9yUhTIZUI=&xsec_source=pc_search&type=normal"},{"ref":"XHS 24","url":"https://www.rednote.com/discovery/item/6933d2f0000000001f00d6a4?xsec_token=ABEAK5UB_1lw_6irnZfcGUxiB6xoH5v8RWkHJlfSPxHMw=&xsec_source=pc_search&type=normal"},{"ref":"XHS 28","url":"https://www.rednote.com/discovery/item/6aed8a1d000000001201bbe3?xsec_token=ABHQsDDamMWvLAadqAcOyAxfHVLdF3YbBzNZO-VL53A6c=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Bakery items (bagels, egg tarts, pastries)","zh":"","note":"TikTok and Instagram visitors, many Thai and Spanish-speaking, point to bakeries: a rose bagel, an egg tart and bakery shop with a tasty flower-petal flavour, pastry shops called viral. One ranking video complains of too much cheese. A YouTuber toured nine bakery and dessert shops in a day.","refs":[{"ref":"TT 15","url":"https://www.tiktok.com/@halal.chopsticks/photo/7641317566811475233"},{"ref":"TT 16","url":"https://www.tiktok.com/@darlingnanuu/video/7662931384373136661"},{"ref":"TT 20","url":"https://www.tiktok.com/@ginginn9292/video/7618628101735468308"}],"nonspicy":false},{"en":"Tiramisu","zh":"提拉米苏","note":"One post names the best tiramisu eaten in Chongqing so far and says it justified a special trip; the shop is not named in the research notes.","refs":[{"ref":"XHS 9","url":"https://www.rednote.com/discovery/item/69e9b6a2000000001d0186ef?xsec_token=ABm6-F5sJyM1JGzLHdS0cVJQaCzRDPJX3MHDRVfTlYPJ0=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Parfait","zh":"芭菲","note":"苔moss is credited with the best parfait in the city.","refs":[{"ref":"XHS 24","url":"https://www.rednote.com/discovery/item/6933d2f0000000001f00d6a4?xsec_token=ABEAK5UB_1lw_6irnZfcGUxiB6xoH5v8RWkHJlfSPxHMw=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Fig desserts","zh":"无花果甜品","note":"A seasonal roundup covers fig desserts at 15 shops; no shop names appear in the research notes.","refs":[{"ref":"XHS 8","url":"https://www.rednote.com/discovery/item/6aa1785f000000002900e4c3?xsec_token=ABZ-N3RCBcxnG2A3xbrp_LCNaRLqqdHRn50Nl3HvgvO2g=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Yundou gao ('iron' griddle cake)","zh":"熨斗糕","note":"Street griddle cake with many flavours; the soybean flavour is praised as fragrant and sweet.","refs":[{"ref":"XHS 4","url":"https://www.rednote.com/discovery/item/6a50f4f5000000001003ef71?xsec_token=AB2F94m6W04JY33n5tQhPJhIo1WVkpIOYbG0_yHJYcNz8=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Durian cheese pancake","zh":"招牌榴莲芝士饼","note":"A signature durian cheese pancake is called an unexpectedly good must-try snack; seller not named.","refs":[{"ref":"IG 12","url":"https://www.instagram.com/reel/DVge8bwE2gW/"}],"nonspicy":false},{"en":"Naifu / snowflake crisp (nougat-style sweets)","zh":"奶芙 / 雪花酥","note":"Subject of a rip-off warning: a snowflake crisp that costs 10 yuan a piece elsewhere was sold at 128 yuan per jin.","refs":[{"ref":"XHS 19","url":"https://www.rednote.com/discovery/item/69fc51c30000000037037267?xsec_token=AB7YDeqaYSu8z0fNdxyT6_ONcP6KE1fkTvyazfdl3_sBI=&xsec_source=pc_search&type=video"}],"nonspicy":false},{"en":"Maltose candy","zh":"","note":"A street seller's hard, chewy maltose sweet is recommended by a YouTuber.","refs":[{"ref":"YT 6","url":"https://www.youtube.com/watch?v=pQK8xasPd9Q"}],"nonspicy":false},{"en":"Alcohol-flavoured Chinese dessert","zh":"","note":"A taster was unsure about the alcohol flavour of a Chinese dessert tried in Chongqing.","refs":[{"ref":"TT 5","url":"https://www.tiktok.com/@tofulivvy/video/7638978537755577622"}],"nonspicy":false},{"en":"Afternoon tea / high tea","zh":"下午茶","note":"A few Instagram posts show classic high tea (one rated 8.8/10) and a Song-style tea experience; two of these are flagged promotional or neutral.","refs":[{"ref":"IG 26","url":"https://www.instagram.com/p/CFwoxsnl3DE/"},{"ref":"IG 23","url":"https://www.instagram.com/p/C4Nge2ORD1T/"},{"ref":"IG 21","url":"https://www.instagram.com/reel/DV3WiIqEwba/"}],"nonspicy":false},{"en":"Chocolate dessert with thick sauce","zh":"","note":"A short calls a chocolate dessert with thick sauce the best in Chongqing right now; no shop named.","refs":[{"ref":"YT 1","url":"https://www.youtube.com/watch?v=FgoJo5CNaXU"}],"nonspicy":false},{"en":"Chongqing snacks (first-try tasting)","zh":"","note":"A first-try tasting of Chongqing snacks was lukewarm; the taster expected something creamier.","refs":[{"ref":"YT 16","url":"https://www.youtube.com/watch?v=FLc38AOLJzM"}],"nonspicy":false}]},"hotpot":{"label":"Sunset hotpot","pages":[{"summary":"Across Xiaohongshu, Instagram, TikTok and YouTube, sunset hotpot clusters in two zones: the Nan'an hills (the Nanshan night-view hotpot park, Taoyuan Hotpot, Pipa Yuan) and the riverfront at Hongyadong and along Nanbin Road. Posters agree that view tables go to whoever arrives before sunset, that the scenery is better than the food, and that even the mild broth is very spicy. Complaint posts add warnings about side-on or window-only views, per-table extras, slow service, noise and tourist-area pricing.","url":"https://notes.bunnylog.ca/quick-chongqing/5-where-to-go-for-best.html","posts":119,"nonspicy":false,"title":"Where to go for the best sunset hotpot in Chongqing? Tips, tricks and what to watch for?"}],"tips":[{"tip":"Arrive before sunset: view tables go to early arrivals, the city lights come on while you eat, and waits get long after dark. One reviewer says about 17:00 for a cliff-edge table.","refs":[{"ref":"IG 7","url":"https://www.instagram.com/reel/DZdWbE8hWys/"},{"ref":"IG 19","url":"https://www.instagram.com/reel/DfaEImsBqRo/"},{"ref":"IG 33","url":"https://www.instagram.com/reel/DevuHRKx3s4/"},{"ref":"IG 16","url":"https://www.instagram.com/reel/DZmO8snDSM7/"}],"nonspicy":false},{"tip":"When a place takes bookings, ask specifically for a terrace, balcony or window seat; the best tables go quickly.","refs":[{"ref":"TT 9","url":"https://www.tiktok.com/@uuu31404/photo/7685703275659742471"},{"ref":"XHS 7","url":"https://www.rednote.com/discovery/item/6aa8f0b80000000026008f29?xsec_token=AB-wR2SCbkbNwJMx-xuhadreYbov1iFjlN-PjBqQrc3pA=&xsec_source=pc_search&type=normal"},{"ref":"XHS 20","url":"https://www.rednote.com/discovery/item/6aec943d0000000003038ffa?xsec_token=AB2KahzQvWO62LYccmEQV9QJj5wga3dSkaGCVIzVMi9R8=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"tip":"The Nanshan night-view park takes no reservations: walk-up queue only.","refs":[{"ref":"IG 33","url":"https://www.instagram.com/reel/DevuHRKx3s4/"}],"nonspicy":false},{"tip":"At 莺花渡 (长嘉汇), river-view tables for Saturday drone-show nights need booking at least two weeks ahead, the seat is held only until 18:00, and 8-person tables carry a minimum spend.","refs":[{"ref":"XHS 35","url":"https://www.rednote.com/discovery/item/6a12ef51000000003502a5e7?xsec_token=ABFNKwXk-MU3HM0pA_DaF3DQu7jMi2qlF3kXqBv08l9Zo=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"tip":"Queue online or remotely where offered: a phone estimate of over an hour became ten-plus minutes on arrival; at another riverside shop the wait was five minutes.","refs":[{"ref":"XHS 27","url":"https://www.rednote.com/discovery/item/68dfd2100000000003019271?xsec_token=AB9vszn_MsSGXR0uGAGlu0TH-f-rdZfPO5hGCTjQt2yiw=&xsec_source=pc_search&type=video"},{"ref":"YT 11","url":"https://www.youtube.com/watch?v=3AzPBk1514w"}],"nonspicy":false},{"tip":"Expect the view to outshine the food: several diners rate the hotpot average or 'mid' and say you are paying for atmosphere, not cooking or service.","refs":[{"ref":"IG 1","url":"https://www.instagram.com/reel/Derp_MVM5V7/"},{"ref":"IG 8","url":"https://www.instagram.com/reel/DKrTpgRSYn7/"},{"ref":"XHS 8","url":"https://www.rednote.com/discovery/item/69fc2f6a000000003502c66a?xsec_token=AB7YDeqaYSu8z0fNdxyT6_OJzPVm9tGBZo7D64Z9jzM5c=&xsec_source=pc_search&type=normal"},{"ref":"XHS 29","url":"https://www.rednote.com/discovery/item/66ace69d0000000027013450?xsec_token=ABFj5ZEMW4Gg15cx8I8VC8rwMHCsdaTG7a5SUOWKFjRN0=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"tip":"Spice: even mild (微辣), extra-mild (微微辣) or the supposedly non-spicy broth is very hot for visitors; order the lowest level or ask for a mushroom broth (one post gives the phrase). A Sichuan local, by contrast, found one place not spicy.","refs":[{"ref":"IG 19","url":"https://www.instagram.com/reel/DfaEImsBqRo/"},{"ref":"YT 11","url":"https://www.youtube.com/watch?v=3AzPBk1514w"},{"ref":"TT 33","url":"https://www.tiktok.com/@melsokafounder/video/7687664865728679190"},{"ref":"YT 14","url":"https://www.youtube.com/watch?v=FgmOz0TCsZk"}],"nonspicy":false},{"tip":"Watch for per-table charges: dipping oil billed per table whether used or not, and a soup-base fee (48 yuan a table) on top of a cheap per-head buffet price.","refs":[{"ref":"YT 11","url":"https://www.youtube.com/watch?v=3AzPBk1514w"},{"ref":"TT 30","url":"https://www.tiktok.com/@coffeemantravel/video/7647897367919791367"}],"nonspicy":false},{"tip":"Check what the 'river view' really is before sitting: complaints include a side-on angle with no frontal skyline and a 'view' that was just one window.","refs":[{"ref":"XHS 23","url":"https://www.rednote.com/discovery/item/6abf057e0000000002013a38?xsec_token=ABAv8rWbY-cIOdyp661c1ujFNI4XZpxaVFAWYns-Xtdk4=&xsec_source=pc_search&type=normal"},{"ref":"XHS 32","url":"https://www.rednote.com/discovery/item/69c5552900000000230108a4?xsec_token=ABmtkKTs97tNy0cTzgqX3IAWmQbERQv64N6H-Hk7kQJyw=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"tip":"Price traps in complaint posts: 400-plus yuan for two on Nanbin Road, about 120 yuan a head at a noisy riverside-park shop, and a tripe plate of three slices at a Hongyadong chain branch.","refs":[{"ref":"XHS 23","url":"https://www.rednote.com/discovery/item/6abf057e0000000002013a38?xsec_token=ABAv8rWbY-cIOdyp661c1ujFNI4XZpxaVFAWYns-Xtdk4=&xsec_source=pc_search&type=normal"},{"ref":"XHS 33","url":"https://www.rednote.com/discovery/item/6a1ba438000000003501e3fd?xsec_token=AB2rTqTRehwIsjIMWdBgYQLE8vqBmXqNEeptsykzfoBaw=&xsec_source=pc_search&type=normal"},{"ref":"XHS 31","url":"https://www.rednote.com/discovery/item/68b5c1bd000000001d00280b?xsec_token=ABL9E3KSnvoMJo0AZSrsnJVx1bYyXckoFVyiaeuDx6M4E=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"tip":"Do not let a taxi driver choose the restaurant; one diner ended up at a bad, expensive riverside shop that way.","refs":[{"ref":"XHS 24","url":"https://www.rednote.com/discovery/item/6a746bf30000000005032f67?xsec_token=ABR83ThFulauFeNhD27sKGjEE1hzQ4yCE1goVdHRTKgbk=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"tip":"Hongyadong caution: taxi drivers reportedly advise against it as crowded, full of internet-famous restaurants with mediocre food and tourist-area prices. Other posts still report good-value riverside meals there.","refs":[{"ref":"YT 12","url":"https://www.youtube.com/watch?v=V6jYgQXCaN4"},{"ref":"IG 28","url":"https://www.instagram.com/p/DYt7-QUk1OM/"},{"ref":"YT 9","url":"https://www.youtube.com/watch?v=X2kmDim5nrk"},{"ref":"YT 11","url":"https://www.youtube.com/watch?v=3AzPBk1514w"}],"nonspicy":false},{"tip":"Light-up and drone timings mentioned: Hongyadong lights 19:30-23:30, Qiansimen Bridge lights from 20:30, and a drone show that ran roughly 8:31-8:49 pm; drone nights are tied to Saturdays in one post.","refs":[{"ref":"IG 28","url":"https://www.instagram.com/p/DYt7-QUk1OM/"},{"ref":"XHS 27","url":"https://www.rednote.com/discovery/item/68dfd2100000000003019271?xsec_token=AB9vszn_MsSGXR0uGAGlu0TH-f-rdZfPO5hGCTjQt2yiw=&xsec_source=pc_search&type=video"},{"ref":"XHS 35","url":"https://www.rednote.com/discovery/item/6a12ef51000000003502a5e7?xsec_token=ABFNKwXk-MU3HM0pA_DaF3DQu7jMi2qlF3kXqBv08l9Zo=&xsec_source=pc_search&type=normal"},{"ref":"XHS 7","url":"https://www.rednote.com/discovery/item/6aa8f0b80000000026008f29?xsec_token=AB-wR2SCbkbNwJMx-xuhadreYbov1iFjlN-PjBqQrc3pA=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"tip":"Weather: open-air seating (most seats at the giant Pipa Yuan are outdoors) suits neither rain nor a cold spell; one hill place put up umbrellas in the rain, and Taoyuan has indoor rooms.","refs":[{"ref":"IG 8","url":"https://www.instagram.com/reel/DKrTpgRSYn7/"},{"ref":"TT 32","url":"https://www.tiktok.com/@angelanomz/video/7644388977151102215"},{"ref":"XHS 8","url":"https://www.rednote.com/discovery/item/69fc2f6a000000003502c66a?xsec_token=AB7YDeqaYSu8z0fNdxyT6_OJzPVm9tGBZo7D64Z9jzM5c=&xsec_source=pc_search&type=normal"},{"ref":"IG 19","url":"https://www.instagram.com/reel/DfaEImsBqRo/"}],"nonspicy":false},{"tip":"Access to hill venues: expect a stair climb of ten-plus minutes or a hike, a hard-to-find but signposted entrance, or pay a motorbike rider a small fee to ride up; carry the Chinese address for the taxi.","refs":[{"ref":"XHS 8","url":"https://www.rednote.com/discovery/item/69fc2f6a000000003502c66a?xsec_token=AB7YDeqaYSu8z0fNdxyT6_OJzPVm9tGBZo7D64Z9jzM5c=&xsec_source=pc_search&type=normal"},{"ref":"TT 32","url":"https://www.tiktok.com/@angelanomz/video/7644388977151102215"},{"ref":"IG 19","url":"https://www.instagram.com/reel/DfaEImsBqRo/"},{"ref":"XHS 2","url":"https://www.rednote.com/discovery/item/698c3fb000000000150316ad?xsec_token=AB17eHY3zw0xxrNOFUCIgjRqN5EjjVpUHzYe4Fj7jsa0U=&xsec_source=pc_search&type=video"}],"nonspicy":false},{"tip":"Check opening days: reviewers say the Nanshan night-view park runs only on Saturday and Sunday with the platform opening at 7 pm, and one found it shut on a weekday.","refs":[{"ref":"IG 1","url":"https://www.instagram.com/reel/Derp_MVM5V7/"},{"ref":"IG 4","url":"https://www.instagram.com/reel/DerOTjPseJo/"}],"nonspicy":false},{"tip":"Noise: a shop beside a metro line was too loud for conversation when trains passed; Taoyuan has a live singer from 7 pm and Pipa Yuan also has live singing.","refs":[{"ref":"XHS 33","url":"https://www.rednote.com/discovery/item/6a1ba438000000003501e3fd?xsec_token=AB2rTqTRehwIsjIMWdBgYQLE8vqBmXqNEeptsykzfoBaw=&xsec_source=pc_search&type=normal"},{"ref":"XHS 8","url":"https://www.rednote.com/discovery/item/69fc2f6a000000003502c66a?xsec_token=AB7YDeqaYSu8z0fNdxyT6_OJzPVm9tGBZo7D64Z9jzM5c=&xsec_source=pc_search&type=normal"},{"ref":"YT 13","url":"https://www.youtube.com/watch?v=vNY433aVN4Y"}],"nonspicy":false},{"tip":"Large venues can still be full: the giant Pipa Yuan is hard to seat at without a reservation in summer.","refs":[{"ref":"IG 8","url":"https://www.instagram.com/reel/DKrTpgRSYn7/"}],"nonspicy":false},{"tip":"Not every viral 'view hotpot' clip is a hotpot restaurant; some are barbecue places such as 黄玉明烧烤, so confirm what the venue serves.","refs":[{"ref":"IG 12","url":"https://www.instagram.com/reel/DU-9DqvDDQk/"},{"ref":"IG 17","url":"https://www.instagram.com/reel/DVgVzXak1MN/"},{"ref":"IG 9","url":"https://www.instagram.com/reel/DWRDFiADJME/"}],"nonspicy":false},{"tip":"Cheap deals exist: set menus of 68 yuan for 9 dishes, a 68-yuan-a-head buffet (less with group-buy, plus 48 yuan a table for the soup base), 60 or 70-80 yuan a head river-view spots, and an 80-yuan table at Hongyadong in an older video.","refs":[{"ref":"IG 28","url":"https://www.instagram.com/p/DYt7-QUk1OM/"},{"ref":"TT 30","url":"https://www.tiktok.com/@coffeemantravel/video/7647897367919791367"},{"ref":"XHS 22","url":"https://www.rednote.com/discovery/item/6730ccd9000000003c01ad8d?xsec_token=ABIWmzu2EVvz0aDnFstLEbhjVt0q0iw2KdzKHy78yAedk=&xsec_source=pc_search&type=video"},{"ref":"XHS 7","url":"https://www.rednote.com/discovery/item/6aa8f0b80000000026008f29?xsec_token=AB-wR2SCbkbNwJMx-xuhadreYbov1iFjlN-PjBqQrc3pA=&xsec_source=pc_search&type=normal"}],"nonspicy":false}],"unpinned":[{"en":"Hongjiuge river-view garden","zh":"红九格老火锅·江景火锅花园","note":"Nanbin Road terrace hotpot that an XHS poster calls the best viewing hotpot in Chongqing. View: Outdoor terrace looks straight across to Raffles City and the Grand Theatre; full night-view panorama. On Nanbin Road facing Raffles City. No listing or address was found for this branch; the only listed Hongjiuge is a different branch in Guanyinqiao.","stance":"for","refs":[{"ref":"XHS 20","url":"https://www.rednote.com/discovery/item/6aec943d0000000003038ffa?xsec_token=AB2KahzQvWO62LYccmEQV9QJj5wga3dSkaGCVIzVMi9R8=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Yang Pangmei Hotpot","zh":"杨胖妹火锅","note":"Hongyadong-area hotpot flagged in an XHS warning post. View: Advertised as river view but the poster says it is just a window. Somewhere at Hongyadong. No listing or address was found.","stance":"against","refs":[{"ref":"XHS 32","url":"https://www.rednote.com/discovery/item/69c5552900000000230108a4?xsec_token=ABmtkKTs97tNy0cTzgqX3IAWmQbERQv64N6H-Hk7kQJyw=&xsec_source=pc_search&type=normal"}],"nonspicy":false}],"once":[{"en":"Yinghuadu (Changjiahui)","zh":"莺花渡","note":"Changjiahui river-view hotpot where the seats are the product: fine for the view, disappointing as a hotpot meal. Where: 长嘉汇 (Changjiahui), 南滨路, Nan'an side facing 来福士.","stance":"mixed","refs":[{"ref":"XHS 35","url":"https://www.rednote.com/discovery/item/6a12ef51000000003502a5e7?xsec_token=ABFNKwXk-MU3HM0pA_DaF3DQu7jMi2qlF3kXqBv08l9Zo=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Yuzong Hotpot","zh":"渝宗火锅","note":"Nanbin Road-side hotpot with a viewing platform used to watch the drone show.","stance":"for","refs":[{"ref":"XHS 27","url":"https://www.rednote.com/discovery/item/68dfd2100000000003019271?xsec_token=AB9vszn_MsSGXR0uGAGlu0TH-f-rdZfPO5hGCTjQt2yiw=&xsec_source=pc_search&type=video"}],"nonspicy":false},{"en":"Junyan Liangjiang Hotpot","zh":"君宴两江火锅","note":"View hotpot where the visuals impressed more than the taste.","stance":"mixed","refs":[{"ref":"XHS 25","url":"https://www.rednote.com/discovery/item/6a605ff0000000000f01dcea?xsec_token=ABMzRjV0TJeEgZtRqFEHz4mAWwqkzdq3SFVyKEzjNt7EY=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Yuduoliya Harbour Hotpot","zh":"渝多利亚港湾火锅店","note":"Hotpot shop named in one XHS note title; the research page gives no further detail.","stance":"neutral","refs":[{"ref":"XHS 17","url":"https://www.rednote.com/discovery/item/680397d8000000001c00bcdc?xsec_token=ABU7c2h8EjWcqfwkpwWlw05rGvxYaCVRkTQXd_glRecsQ=&xsec_source=pc_search&type=normal"}],"nonspicy":false},{"en":"Ding Laotou BBQ","zh":"","note":"BBQ restaurant that a quoted remark suggests is the real venue in a viral 'mountain hotpot' reel.","stance":"neutral","refs":[{"ref":"IG 9","url":"https://www.instagram.com/reel/DWRDFiADJME/"}],"nonspicy":false},{"en":"Nanshan Cliff Hotpot (label used in one clip; may be the same as another Nanshan venue)","zh":"","note":"Cliff hotpot on Nanshan shown in a TikTok POV clip with no further details. Where: Nanshan (南山), Nan'an hills - no address given.","stance":"neutral","refs":[{"ref":"TT 18","url":"https://www.tiktok.com/@meetpanda/video/7694947284290637108"}],"nonspicy":false}],"dishes":[]},"photo":{"label":"Photo spots","pages":[],"tips":[],"unpinned":[],"once":[],"dishes":[],"intro":"Where to stand, what is in frame and when, taken from your research posts. 江滩公园拍照点 also has fresh web research. Every line links to its source.","optional":true},"misc":{"label":"Other stops","pages":[],"tips":[],"unpinned":[],"once":[],"dishes":[],"intro":"Places you asked to add on 16 Nov. Notes come from fresh web research, with a link on every line.","optional":true}},"places":[{"id":"md_hongyadong","layers":["mustdo"],"en":"Hongyadong","zh":"洪崖洞","short":"Hongyadong","zhShort":"洪崖洞","amapq":"洪崖洞","nonspicy":false,"n":31,"for":7,"against":7,"mixed":7,"notes":[{"page":"mustdo","from":"","what":{"t":"Famous lit-up landmark, treated as the first-visit core sight at night; mostly recommended as something to look at from outside.","r":["IG 17","YT 17","TT 9","IG 12"]},"good":[{"t":"Treated as the first-visit core sight; called iconic, a must-visit and the city's most popular attraction","r":["YT 5","YT 17","TT 6","IG 17"]},{"t":"Night view praised when seen from Qiansimen Bridge or from across the river","r":["YT 17","XHS 17","TT 9","IG 12"]},{"t":"One XHS tier list puts getting it in the same frame as Jiefangbei in its top 'must check-in' tier","r":["XHS 2"]}],"bad":[{"t":"Crowd warnings on all four platforms: packed, 'nothing but heads', noisy and commercial inside","r":["XHS 12","TT 12","IG 7","YT 7"]},{"t":"Several posts say skip it or call it super overrated / a tourist trap","r":["IG 30","IG 12","TT 30","YT 20"]},{"t":"One visitor found it less pretty than expected","r":["XHS 24"]},{"t":"Overcrowded on holidays an
