<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Runway Month · Month view prototype 3</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../shared.css">
<link rel="stylesheet" href="../month.css">
<style>
main{max-width:1180px;margin:0 auto;padding:12px}
.head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.weeks{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.week{position:relative;border-top:1px solid var(--line)}
.week:first-child{border-top:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:absolute;inset:0}
.day{border-left:1px solid var(--line);padding:3px 5px;font-size:.8rem;font-weight:600;cursor:pointer}
.day:first-child{border-left:0}
.day.we{background:color-mix(in oklab,var(--surface2) 55%,transparent)}
.day.out{color:var(--muted);font-weight:400}
.day.today span{background:var(--ink);color:var(--paper);border-radius:999px;padding:0 6px}
.sp{position:absolute;height:19px;border-radius:6px;cursor:pointer;display:flex;align-items:center;overflow:hidden;font-size:.72rem;white-space:nowrap}
.sp .rw{position:absolute;inset:0;background:color-mix(in oklab,var(--c) 22%,transparent);border:1px dashed color-mix(in oklab,var(--c) 70%,transparent);border-radius:6px}
.sp .wk{position:absolute;top:0;bottom:0;background:var(--c);border-radius:5px}
.sp .lb{position:relative;z-index:1;padding:0 6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;color:var(--ink);text-shadow:0 0 3px var(--surface),0 0 3px var(--surface)}
.sp .fl{position:absolute;right:3px;z-index:1;color:var(--c);font-weight:800;font-size:.8rem}
.sp.cont-l .rw{border-left:0;border-radius:0 6px 6px 0}
.sp.cont-r .rw{border-right:0;border-radius:6px 0 0 6px}
.sp.late .rw{background:var(--danger);border-color:var(--danger)}
.sp.late .lb{color:#fff;text-shadow:none}
.mr{position:absolute;right:6px;font-size:.7rem;color:var(--muted);cursor:pointer}
@media (max-width:640px){.sp{height:16px;font-size:.62rem}.sp .lb{padding:0 3px}.day{font-size:.72rem;padding:2px 3px}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:34px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.toggle{display:flex;align-items:center;gap:6px;font-size:.85rem}
</style>
</head>
<body>
<main id="app"></main>
<script>window.TODOCAL_KEY='todocal.monthproto';try{if(!localStorage.getItem('todocal.monthproto')){var r=localStorage.getItem('todocal.v1');if(r&&JSON.parse(r).tasks.length){localStorage.setItem('todocal.monthproto',r);localStorage.setItem('todocal.monthproto.src','app');}}}catch(e){}</script>
<script src="../../../todo-calendar/core.js"></script>
<script src="../month.js"></script>
<script>
(function(){
  const {h} = TCL;
  TCL.mount('span');
  const app = document.getElementById('app');
  const nav = TCL.monthNav(render);
  const head = h('div', {class: 'head'}, ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d) => h('div', {class: 'm-dow'}, d)));
  const weeks = h('div', {class: 'weeks'});
  app.append(nav.el, head, weeks,
    h('div', {class: 'legend'},
      h('span', null, h('i', {style: {background: 'color-mix(in oklab,var(--accent) 22%,transparent)', border: '1px dashed var(--accent)'}}), 'runway: from now (or your planned day) to the deadline'),
      h('span', null, h('i', {style: {background: 'var(--accent)', width: '14px'}}), 'planned work day, or the deadline day if not planned'),
      h('span', null, '▶ deadline')), TCL.srcNote());
  function render() {
    const m = nav.month(), days = TCL.monthDays(m), now = new Date(), T = TCL.sod(now), tk = TCL.key(T);
    const g0 = days[0], g1 = TCL.addDays(days[41], 1);
    const spans = TCL.openOneOffs().map((o) => {
      const dueD = TCL.sod(o.due), late = o.due < now;
      const planned = o.planDay !== TCL.key(dueD);
      let s = late ? T : planned ? TCL.parse(o.planDay) : (T > dueD ? dueD : T);
      if (!late && s > dueD) s = dueD;
      const e = late ? T : dueD;
      return {o, s, e, work: late ? T : planned ? TCL.parse(o.planDay) : dueD, late};
    }).filter((x) => x.e >= g0 && x.s < g1).sort((a, b) => a.s - b.s || b.e - a.e);
    const LH = innerWidth < 640 ? 18 : 22, MAX = innerWidth < 640 ? 5 : 6;
    weeks.textContent = '';
    for (let w = 0; w < 6; w++) {
      const ws = days[w * 7], we = TCL.addDays(ws, 7);
      const segs = spans.filter((x) => x.e >= ws && x.s < we);
      const lanes = [];
      segs.forEach((x) => {
        const c0 = Math.max(0, TCL.dayDiff(ws, x.s)), c1 = Math.min(6, TCL.dayDiff(ws, x.e));
        let l = lanes.findIndex((end) => end < c0);
        if (l < 0) { l = lanes.length; lanes.push(-1); }
        lanes[l] = c1; Object.assign(x, {c0, c1, lane: l});
      });
      const shown = segs.filter((x) => x.lane < MAX), hiddenN = segs.length - shown.length;
      const rows = Math.min(MAX, lanes.length);
      const week = h('div', {class: 'week', style: {height: (24 + rows * LH + (hiddenN ? 14 : 4)) + 'px', minHeight: '58px'}});
      const dayRow = h('div', {class: 'days'});
      for (let i = 0; i < 7; i++) {
        const d = days[w * 7 + i];
        dayRow.append(h('div', {class: 'day' + (d.getDay() % 6 === 0 ? ' we' : '') + (d.getMonth() !== m.getMonth() ? ' out' : '') + (TCL.key(d) === tk ? ' today' : ''), onclick: () => TCL.openAdd({due: TCL.key(d)})}, h('span', null, d.getDate())));
      }
      week.append(dayRow);
      for (const x of shown) {
        const o = x.o, n = x.c1 - x.c0 + 1;
        const wc = TCL.dayDiff(ws, x.work);
        const sp = h('div', {class: 'sp' + (x.s < ws ? ' cont-l' : '') + (x.e >= we ? ' cont-r' : '') + (x.late ? ' late' : ''), style: {'--c': o.color, left: `calc(${x.c0 / 7 * 100}% + 3px)`, width: `calc(${n / 7 * 100}% - 6px)`, top: (24 + x.lane * LH) + 'px'}, title: `${o.title} · ${TCL.fmtDur(o.dur)} · due ${TCL.relDue(o, now)}`, onclick: () => TCL.openTask(o)},
          h('span', {class: 'rw'}),
          wc >= x.c0 && wc <= x.c1 && !x.late ? h('span', {class: 'wk', style: {left: ((wc - x.c0) / n * 100) + '%', width: (1 / n * 100) + '%'}}) : null,
          h('span', {class: 'lb'}, o.title),
          x.e < we && !x.late ? h('span', {class: 'fl'}, '▶') : null);
        week.append(sp);
      }
      if (hiddenN) week.append(h('div', {class: 'mr', style: {bottom: '2px'}, onclick: () => TCL.sheet('More this week', h('div', null, segs.filter((x) => x.lane >= MAX).map((x) => TCL.itemRow(x.o, now))))}, `+${hiddenN} more`));
      weeks.append(week);
    }
  }
  TCL.onChange(() => { document.querySelectorAll('.tcl-scrim').forEach((s) => s.remove()); render(); });
  addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
