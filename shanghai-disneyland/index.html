<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shanghai Disneyland Day Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
:root{
  /* layout: one-screen app. Column on phones: slim header, map pane, drag handle, scrolling panel. From 900px: map left, 420px panel right.
     The route choice lives in the LAYERS popup on the map. */
  --paper:#eaefec; --surface:#f7faf8; --ink:#172625; --muted:#586a67; --line:#c9d4cf;
  --pine:#1c7658; --warn:#8a5a00; --warn-bg:#f6ecd2; --bad:#b23625; --bad-bg:#f6dfda; --good-bg:#dcefe6;
  --m-land:#f1f3ec; --m-out:#e2e7e2; --m-green:#cfe1c9; --m-water:#a8c8d6; --m-water-ink:#3f6f85; --m-halo:#f7faf8;
  --c-rides:#3a5796; --c-food:#c23f2d; --c-winter:#0d7880; --c-shows:#8a3f8c; --c-services:#5d6470;
  --on-pin:#ffffff; --tint:19%; --shade:0 2px 10px rgba(23,38,37,.14);
  --gps:#1a6be0;   /* the "you are here" dot */
  --display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","Noto Serif SC",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101817; --surface:#182221; --ink:#e4ece8; --muted:#96a8a3; --line:#2b3a37;
    --pine:#52c79d; --warn:#f0c66a; --warn-bg:#2d2613; --bad:#f27a66; --bad-bg:#3a1c17; --good-bg:#16302a;
    --m-land:#18211f; --m-out:#0d1413; --m-green:#1c3528; --m-water:#1d3b4b; --m-water-ink:#8fbdd3; --m-halo:#101817;
    --c-rides:#8eaaf0; --c-food:#f27a66; --c-winter:#5cc7cf; --c-shows:#d58ad8; --c-services:#aab3c2;
    --on-pin:#101817; --tint:17%; --shade:0 2px 12px rgba(0,0,0,.5);
    --gps:#5ea2ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101817; --surface:#182221; --ink:#e4ece8; --muted:#96a8a3; --line:#2b3a37;
  --pine:#52c79d; --warn:#f0c66a; --warn-bg:#2d2613; --bad:#f27a66; --bad-bg:#3a1c17; --good-bg:#16302a;
  --m-land:#18211f; --m-out:#0d1413; --m-green:#1c3528; --m-water:#1d3b4b; --m-water-ink:#8fbdd3; --m-halo:#101817;
  --c-rides:#8eaaf0; --c-food:#f27a66; --c-winter:#5cc7cf; --c-shows:#d58ad8; --c-services:#aab3c2;
  --on-pin:#101817; --tint:17%; --shade:0 2px 12px rgba(0,0,0,.5);
  --gps:#5ea2ff;
  color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);
  font:400 16px/1.45 var(--body);
  overflow:hidden;display:flex;flex-direction:column;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--pine);outline-offset:2px}
[lang="zh"]{letter-spacing:.01em}
.vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.pill{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 15px;border:1.5px solid var(--ink);border-radius:999px;
  background:transparent;color:var(--ink);font:500 14px/1.1 var(--body);
  text-decoration:none;white-space:nowrap;
}
.pill.solid{background:var(--ink);color:var(--paper)}
.pill:active{transform:translateY(1px)}

/* ---------- header: eyebrow and a one-line title, nothing else ---------- */
.chrome{flex:none}
.top{padding:5px 14px 6px}
.eyebrow{font:500 10px/1.35 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{min-width:0;font:400 clamp(19px,5.7vw,22px)/1.12 var(--display);letter-spacing:.005em}
h1 .zh{display:none;font:400 12px/1.3 var(--body);color:var(--muted);white-space:nowrap;margin-left:3px;letter-spacing:.04em}
@media (min-width:420px){ h1 .zh{display:inline-block} .eyebrow{font-size:10.5px;letter-spacing:.07em} }

/* ---------- pictograms: one drawn set, used on pins, in rows, in the sheet and in the key ---------- */
.pic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.pic .f{fill:currentColor}
.pic .fo{fill:currentColor;stroke:none}
svg.pic{display:block;flex:none;width:16px;height:16px}
.pchip{
  flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:var(--lc,var(--c-services));color:var(--on-pin);
}
.pchip .pic{stroke-width:2.1}
.pchip.sm{width:20px;height:20px}
.pchip.sm .pic{width:14px;height:14px;stroke-width:2.3}
.pchip.lg{width:34px;height:34px}
.pchip.lg .pic{width:23px;height:23px;stroke-width:1.9}

/* ---------- app frame ---------- */
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.mapPane{position:relative;flex:none;height:44%;min-height:250px;background:var(--m-out);border-top:1px solid var(--line)}
#map{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;-webkit-touch-callout:none}
#map.grabbing{cursor:grabbing}
.handle{
  flex:none;position:relative;height:24px;background:var(--surface);
  border-top:1px solid var(--line);touch-action:none;cursor:ns-resize;
  display:flex;align-items:center;justify-content:center;z-index:3;
}
.handle::before{content:"";position:absolute;left:0;right:0;top:-9px;bottom:-7px}
.handle .grip{width:46px;height:4px;border-radius:2px;background:var(--muted);opacity:.55;position:relative}
.handle:focus-visible .grip{opacity:1;background:var(--pine)}
.handle button{
  position:absolute;right:6px;top:-9px;width:44px;height:40px;border:0;background:transparent;
  display:grid;place-items:center;padding:0;color:var(--ink);
}
.handle button svg{width:18px;height:18px;transition:transform .2s}
.handle button[aria-pressed="true"] svg{transform:rotate(180deg)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.tabs{flex:none;display:flex;padding:0 10px;border-bottom:1px solid var(--line)}
.tabs a{
  flex:1 1 0;min-width:0;min-height:40px;display:flex;align-items:center;justify-content:center;
  font:500 14px/1.1 var(--body);color:var(--muted);text-decoration:none;
  border-bottom:2.5px solid transparent;margin-bottom:-1px;
}
.tabs a[aria-current]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tabs a:focus-visible{outline-offset:-3px}
#view{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:12px 14px 30px;position:relative;overflow-wrap:anywhere;
}
#view:focus-visible{outline:none}
@media (min-width:900px){
  .chrome{border-bottom:1px solid var(--line)}
  .top{padding:8px 20px 9px}
  h1{font-size:26px}
  h1 .zh{font-size:13px;margin-left:8px}
  #app{flex-direction:row}
  .mapPane{flex:1;height:auto!important;min-height:0;border-top:0;border-right:1px solid var(--line)}
  .handle{display:none}
  .panel{flex:none;width:420px}
  #view{padding:18px 18px 36px}
}

/* ---------- map overlay controls ---------- */
.mctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mbtn{
  width:46px;min-height:40px;border:1.5px solid var(--ink);border-radius:13px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;
  font:500 20px/1 var(--body);box-shadow:var(--shade);
}
.mbtn.txt{font:600 12.5px/1 var(--body)}
.mbtn.lay{min-height:46px;font:600 9px/1 var(--body);letter-spacing:.07em}
.mbtn.lay b{font:600 14px/1 var(--body);letter-spacing:0;font-variant-numeric:tabular-nums}
.mbtn[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.mbtn:disabled{opacity:.4;cursor:default}
/* The popup may be taller than a small map pane: it is allowed to hang over the panel below (z-index above the handle). */
.laypanel{
  position:absolute;top:8px;right:62px;z-index:5;width:252px;max-width:calc(100% - 70px);
  background:var(--surface);border:1.5px solid var(--ink);border-radius:14px;padding:5px;box-shadow:var(--shade);
  overflow-y:auto;overscroll-behavior:contain;
}
.lp-h{padding:6px 8px 2px;font:600 10.5px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lp-routes{padding-bottom:5px;margin-bottom:3px;border-bottom:1px solid var(--line)}
.laypanel button{
  display:flex;align-items:center;gap:9px;width:100%;min-height:40px;padding:4px 8px;border:0;border-radius:9px;
  background:transparent;font:500 14px/1.2 var(--body);text-align:left;
}
.laypanel button:focus-visible{outline-offset:-2px}
.laypanel .lbl{flex:1;min-width:0}
.laypanel .rad{flex:none;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.laypanel .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);opacity:0}
.laypanel [role="radio"][aria-checked="true"]{background:var(--good-bg);font-weight:600}
.laypanel [role="radio"][aria-checked="true"] .rad::after{opacity:1}
.laypanel [role="radio"] .tag{flex:none;background:var(--paper)}
.laypanel [role="radio"] .tag.good{background:var(--good-bg)}
.laypanel [role="radio"][aria-checked="true"] .tag{background:var(--surface)}
.laypanel .box{flex:none;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:6px;display:grid;place-items:center}
.laypanel .box svg{width:13px;height:13px;opacity:0}
.laypanel button[aria-checked="true"] .box{background:var(--ink);color:var(--paper)}
.laypanel button[aria-checked="true"] .box svg{opacity:1}
.laypanel [role="switch"][aria-checked="false"] .lbl{color:var(--muted)}
.laypanel [role="switch"][aria-checked="false"] .pchip{opacity:.5}
.phases{
  position:absolute;left:6px;bottom:23px;z-index:1;max-width:calc(100% - 12px);height:40px;display:flex;gap:4px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;
}
.phases::-webkit-scrollbar{display:none}
.phases button{flex:none;height:40px;padding:0;border:0;background:transparent;display:flex;align-items:center}
.phases button span{
  display:block;padding:0 9px;border:1.5px solid var(--ink);border-radius:14px;background:var(--surface);
  font:500 12.5px/25px var(--body);white-space:nowrap;box-shadow:var(--shade);
}
.phases button[aria-pressed="true"] span{background:var(--ink);color:var(--paper);font-weight:600}
.phases button:focus-visible{outline:none}
.phases button:focus-visible span{outline:2.5px solid var(--pine);outline-offset:1px}
.mfoot{
  position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);z-index:1;pointer-events:none;
  display:flex;align-items:center;gap:8px;padding:3px 7px 3px 6px;border-radius:7px;background:var(--surface);opacity:.93;
  font:500 10.5px/1.25 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;
}
.scalebar{flex:none;display:flex;align-items:center;gap:5px;white-space:nowrap}
.scalebar i{display:block;height:5px;border:1.5px solid var(--muted);border-top:0}
.mfoot .apx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.north{
  position:absolute;left:6px;top:6px;z-index:1;pointer-events:none;width:26px;height:26px;border-radius:50%;
  background:var(--surface);opacity:.93;color:var(--ink);display:grid;place-items:center;
}
.north svg{width:20px;height:20px}
.north text{font:600 7.5px var(--body);fill:currentColor;text-anchor:middle}

/* ---------- map SVG ---------- */
#map text{font-family:var(--body);pointer-events:none}
.L-rides{--lc:var(--c-rides)} .L-food{--lc:var(--c-food)} .L-winter{--lc:var(--c-winter)}
.L-shows{--lc:var(--c-shows)} .L-services{--lc:var(--c-services)} .L-other{--lc:var(--c-services)} .L-route{--lc:var(--ink)}
.pchip.L-route{color:var(--paper)}
.m-ground{fill:var(--m-out)}
.m-water{fill:var(--m-water);stroke:var(--m-water-ink);stroke-width:1;stroke-opacity:.55;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.land{fill:var(--m-land);stroke:var(--line);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.land.t0{fill:color-mix(in srgb,var(--m-land),#d08a2e var(--tint))}
.land.t1{fill:color-mix(in srgb,var(--m-land),#5a9a4a var(--tint))}
.land.t2{fill:color-mix(in srgb,var(--m-land),#c85a7a var(--tint))}
.land.t3{fill:color-mix(in srgb,var(--m-land),#4f8fd0 var(--tint))}
.land.t4{fill:color-mix(in srgb,var(--m-land),#8a66c8 var(--tint))}
.land.t5{fill:color-mix(in srgb,var(--m-land),#2aa198 var(--tint))}
.land.t6{fill:color-mix(in srgb,var(--m-land),#7c9a2e var(--tint))}
.land.t7{fill:color-mix(in srgb,var(--m-land),#b8683a var(--tint))}
.mpath{fill:none;stroke:var(--muted);stroke-opacity:.5;stroke-width:1.2;stroke-dasharray:2 4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.parade{fill:none;stroke:var(--c-winter);stroke-width:2;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.parade-arrow{fill:none;stroke:var(--c-winter);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.r-case{fill:none;stroke:var(--m-halo);stroke-width:7;stroke-opacity:.92;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r-leg{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
.r-leg.calm{stroke-width:2;stroke-opacity:.55}
.r-leg.on{stroke:var(--pine);stroke-width:4.5}
.r-leg.out{stroke:var(--pine);stroke-width:3}
.r-chev{fill:var(--ink);stroke:var(--m-halo);stroke-width:1;stroke-linejoin:round}
.r-chev.calm{fill-opacity:.62;stroke-opacity:.5}
.r-chev.on,.r-chev.out{fill:var(--pine)}
.r-leg.hide,.r-chev.hide{display:none}
#map.crowded .pin.is-minor .badge,#map.crowded .pin.is-minor .approx{display:none}
#map.route-on .pin.is-minor{opacity:.6}
.pin.is-far{opacity:.62}
.pin.is-far .dot{stroke:var(--m-halo);stroke-width:1.5}
.pin.is-far .num{font-size:8.5px}
#map .pin.focus,#map .pin.sel{opacity:1}
.mlabel{paint-order:stroke;stroke:var(--m-halo);stroke-linejoin:round}
.landlabel{font-size:10px;font-weight:600;letter-spacing:.09em;fill:var(--muted);stroke-width:2.5px;stroke-opacity:.8}
.landlabel.zh{font-size:11px;letter-spacing:.16em}
.glabel{font-size:10.5px;font-weight:500;fill:var(--muted);stroke-width:2.5px}
.glabel.water{fill:var(--m-water-ink);font-style:italic;stroke:none}
.glabel.parade-l{fill:var(--c-winter);font-weight:600}
.plabel{font-size:12px;font-weight:600;fill:var(--ink);stroke-width:3.5px}
.plabel.minor{font-size:11px;font-weight:500}
.plabel.sel{fill:var(--pine)}
.glyph .ic{fill:var(--ink);stroke:var(--m-halo);stroke-width:1.5;stroke-linejoin:round;paint-order:stroke}
.glyph .ic.castle{stroke-width:2.2}
.glyph .ring{fill:var(--c-services);stroke:var(--m-halo);stroke-width:1.5}
.glyph .pic{color:var(--on-pin);stroke-width:2.2}
.pin{cursor:pointer}
.pin .hit{fill:transparent;stroke:none}
.pin .dot{fill:var(--lc);stroke:var(--m-halo);stroke-width:1.5}
.pin.is-stop .dot{stroke:var(--ink);stroke-width:2}
.pin .halo{fill:none;stroke:var(--m-halo);stroke-width:2}
.pin .approx{fill:none;stroke:var(--lc);stroke-width:1.5;stroke-dasharray:3 3}
.pin .num{fill:var(--on-pin);font-size:12.5px;font-weight:600;text-anchor:middle;font-variant-numeric:tabular-nums}
.pin .num.sm{font-size:10.5px}
.pin .pic{color:var(--on-pin);stroke-width:2.15;pointer-events:none}
/* a stop keeps its number; its pictogram rides along as a small badge once the map is zoomed in */
.pin .ibadge{display:none}
#map.zin .pin.is-stop .ibadge{display:inline}
.pin .ibadge circle{fill:var(--surface);stroke:var(--lc);stroke-width:1.5}
.pin .ibadge .pic{color:var(--lc);stroke-width:2.3}
.pin .plus{fill:var(--ink);stroke:var(--m-halo);stroke-width:2.5px;paint-order:stroke;font-size:13px;font-weight:600;text-anchor:middle}
.pin .badge circle{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.5}
.pin .badge text{fill:var(--warn);font-size:10.5px;font-weight:600;text-anchor:middle}
.pin .badge.x circle{fill:var(--bad-bg);stroke:var(--bad)}
.pin .badge.x text{fill:var(--bad)}
.pin .ring{fill:none;stroke:none}
.pin.sel .ring,.pin.focus .ring{stroke:var(--pine);stroke-width:3}
.pin .pulse{fill:none;stroke:var(--pine);stroke-width:0;opacity:0}
.pin.pulsing .pulse{animation:pulse .9s ease-out 1}
.pin:focus-visible{outline:none}
.pin:focus-visible .ring{stroke:var(--pine);stroke-width:3}
@keyframes pulse{0%{stroke-width:2;opacity:.9}100%{stroke-width:30;opacity:0}}

/* ---------- shared view pieces ---------- */
.vh{font:400 26px/1.1 var(--display)}
.lede{color:var(--muted);font-size:14.5px;margin-top:5px}
#view h3{font:600 12px/1.3 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
#view h3 .zh{letter-spacing:.04em;font-weight:500;margin-left:6px;text-transform:none}
.chip{
  display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:2px 9px;border-radius:12px;
  border:1px solid var(--line);font:500 12.5px/1.25 var(--body);color:var(--ink);background:var(--surface);max-width:100%;
}
.chip.kind{white-space:nowrap}
.chip.kind::before{flex:none}
.chip.kind::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--kc,var(--muted))}
.chip.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.chip.off{color:var(--muted)}
.tag{
  display:inline-flex;align-items:center;min-height:22px;padding:2px 8px;border-radius:6px;
  font:600 11.5px/1.3 var(--body);background:var(--paper);color:var(--muted);max-width:100%;
}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.good{background:var(--good-bg);color:var(--pine)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.refs{display:inline;white-space:normal}
.ref{
  display:inline-block;position:relative;margin:1px 0 1px 4px;padding:1px 6px;border-radius:5px;
  font:500 11px/1.45 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap;
  color:var(--pine);background:var(--good-bg);text-decoration:none;vertical-align:1px;
}
.ref::after{content:"";position:absolute;inset:-11px -3px}
.ref.dead{color:var(--muted);background:var(--paper)}
.foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);padding:20px 0}
.k-ride,.k-early,.k-premier{--kc:var(--c-rides)}
.k-food{--kc:var(--c-food)} .k-show{--kc:var(--c-shows)} .k-winter{--kc:var(--c-winter)}
.k-enter,.k-exit{--kc:var(--c-services)} .k-walk,.k-buffer{--kc:var(--muted)}

/* ---------- plan: head, day strip ---------- */
.rtitle{display:flex;align-items:flex-start;gap:10px}
.rhead h2{flex:1;min-width:0;font:400 24px/1.06 var(--display)}
.textbtn{
  flex:none;min-height:40px;margin:-8px -6px -8px 0;padding:0 6px;border:0;border-radius:8px;background:transparent;
  font:500 13px/1.1 var(--body);color:var(--pine);text-decoration:underline;text-underline-offset:3px;white-space:nowrap;
}
.rhead .sum{margin-top:4px;font-size:14px;line-height:1.36}
.costs{min-width:0}
.costs summary{list-style:none;display:inline-flex;align-items:center;gap:3px;min-height:40px;margin:-9px 0;cursor:pointer;color:var(--ink);font:500 13px/1 var(--body);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.costs summary::-webkit-details-marker{display:none}
.costs summary svg{width:14px;height:14px;transition:transform .2s}
.costs[open]{flex-basis:100%}
.costs[open] summary svg{transform:rotate(180deg)}
.costs p{margin-top:8px;font-size:13.5px;line-height:1.42;color:var(--muted)}
@media (min-width:900px){ .rhead h2{font-size:27px} .rhead .sum{font-size:15px} }
.rhead .meta{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;color:var(--muted)}
.stripwrap{position:relative;margin:9px -14px 0}
.rhead .meta .span{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.rhead .costs[open] ~ .span{display:none}
@media (max-width:371px){ .rhead .meta .span{display:none} }
.stripwrap::after{content:"";position:absolute;top:0;right:0;bottom:8px;width:22px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--surface))}
.strip{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:4px}
.strip svg{display:block}
.strip text{font-family:var(--body);font-variant-numeric:tabular-nums;pointer-events:none}
.strip .hr{font-size:10.5px;fill:var(--muted);text-anchor:middle}
.strip .tick{stroke:var(--line);stroke-width:1}
.strip .track{fill:var(--paper);stroke:var(--line);stroke-width:1}
.strip .band{fill:var(--ink);fill-opacity:0}
.strip .band.alt{fill-opacity:.05}
.strip .band.on{fill:var(--pine);fill-opacity:.16}
.strip .bandname{font-size:9.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted);text-transform:uppercase}
.strip .blk{cursor:pointer}
.strip .blk .b{fill:var(--kc);stroke:var(--surface);stroke-width:1}
.strip .blk.k-walk .b,.strip .blk.k-buffer .b{fill:var(--muted);fill-opacity:.38}
.strip .blk .hatch{fill:url(#sp-hatch);pointer-events:none}
.strip .hatchfill{fill:var(--on-pin);fill-opacity:.42}
.strip .blk .n{font-size:11px;font-weight:600;fill:var(--on-pin);text-anchor:middle}
.strip .blk.k-walk .n,.strip .blk.k-buffer .n{fill:var(--ink)}
.strip .blk .hitr{fill:transparent}
.strip .blk .selr{fill:none;stroke:none}
.strip .blk.sel .selr{stroke:var(--ink);stroke-width:2.5}
.strip .blk.sel .cur{fill:var(--pine)}
.strip .blk .cur{fill:none}
.strip .blk:focus-visible{outline:none}
.strip .blk:focus-visible .selr{stroke:var(--pine);stroke-width:2.5}
.strip .hl line{stroke:var(--bad);stroke-width:1.5}
.strip .hl text{font-size:10.5px;font-weight:600;fill:var(--bad);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.strip .hl circle{fill:var(--bad)}
.strip .now line{stroke:var(--pine);stroke-width:2}
.strip .now rect{fill:var(--pine)}
.strip .now text{font-size:10.5px;font-weight:600;fill:var(--surface);text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:6px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--kc)}
.legend .k-walk i{opacity:.4}
.legend .k-premier i{background:repeating-linear-gradient(135deg,var(--kc) 0 2.5px,color-mix(in srgb,var(--kc),var(--on-pin) 45%) 2.5px 5px)}
.legend .hlk i{width:2px;height:12px;border-radius:0;background:var(--bad)}

/* ---------- plan: timeline ---------- */
.tl{margin:14px -8px 0;position:relative}
.stop{
  display:grid;grid-template-columns:40px 28px minmax(0,1fr) 40px;column-gap:7px;align-items:start;
  position:relative;padding:11px 4px 12px 8px;border-radius:12px;
}
.stop::before{content:"";position:absolute;left:68px;top:0;bottom:0;width:2px;background:var(--line)}
.stop.first::before{top:24px}
.stop.last::before{bottom:auto;height:24px}
.stop.first.last::before{display:none}
.st-time{font:600 13.5px/26px var(--body);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.st-time small{display:block;font:600 10px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--pine);margin-top:-2px}
.mk{
  position:relative;z-index:1;width:26px;height:26px;margin:0 1px;border-radius:50%;display:grid;place-items:center;
  background:var(--kc);color:var(--on-pin);border:1.5px solid var(--ink);
  font:600 12px/1 var(--body);font-variant-numeric:tabular-nums;
}
.k-walk .mk,.k-buffer .mk{background:var(--surface);color:var(--ink);border-style:dashed;border-color:var(--muted)}
.st-body{min-width:0;cursor:pointer;border-radius:8px;padding-top:2px}
.st-head{display:flex;align-items:flex-start;gap:7px}
.st-head .pic{width:17px;height:17px;margin-top:1.5px;color:var(--muted)}
.st-title{flex:1;min-width:0;font:600 16px/1.25 var(--body)}
.st-zh{font-size:13.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.st-chips{display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px;margin-top:7px;font-size:12.5px;color:var(--muted)}
.st-chips .dur{font-variant-numeric:tabular-nums;white-space:nowrap}
.st-why{margin-top:7px;font-size:14.5px;line-height:1.42}
.st-if{margin-top:7px;padding:6px 9px;border-radius:8px;background:var(--warn-bg);font-size:13.5px;line-height:1.4}
.st-if b{color:var(--warn);font-weight:600}
.st-next{margin-top:7px;font-size:13px;color:var(--muted);line-height:1.35}
.st-next b{color:var(--ink);font-weight:600}
.st-next .amap{position:relative;color:var(--pine);font-weight:600;white-space:nowrap;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--pine),transparent 50%);text-underline-offset:2px}
.st-next .amap::after{content:"";position:absolute;inset:-12px -8px}     /* about 40px to tap, no extra height in the line */
.st-open{
  width:40px;height:40px;margin-top:-6px;display:grid;place-items:center;border-radius:50%;color:var(--ink);text-decoration:none;
}
.st-open svg{width:18px;height:18px}
/* play link at the end of a stop's title row: opens the place's first watch link. Small to look at, about 40px to tap */
.st-watch{position:relative;flex:none;display:grid;place-items:center;width:24px;height:22px;margin:-1px -3px 0 0;border-radius:50%;color:var(--pine);text-decoration:none}
.st-watch::after{content:"";position:absolute;inset:-9px -8px}
.st-head .st-watch .pic{width:19px;height:19px;margin:0;color:inherit;stroke-width:1.8}
.stop.sel{background:var(--good-bg);box-shadow:inset 3px 0 0 var(--pine)}
.stop.sel .mk{box-shadow:0 0 0 3px var(--pine)}
.stop.sel .ref{background:var(--surface)}
.stop.sel .chip{background:transparent;border-color:color-mix(in srgb,var(--pine),transparent 55%)}
.stop.now .st-time{color:var(--pine)}
.phase{margin:10px 0 2px}
.phase:first-child{margin-top:0}
.phase button{
  display:flex;align-items:baseline;gap:8px;width:100%;min-height:40px;padding:9px 8px 7px;border:0;border-top:1.5px solid var(--ink);
  background:transparent;text-align:left;font:500 13px/1.3 var(--body);color:var(--muted);
}
.phase .ph-name{font:600 12px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.phase .ph-meta{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.phase .ph-go{color:var(--pine);font-weight:600;white-space:nowrap}
.phase.wide button{flex-wrap:wrap;row-gap:2px}                       /* a long heading sits above its times */
.phase.wide .ph-name{flex:1 0 100%;white-space:normal}
.phase button[aria-pressed="true"]{border-top-color:var(--pine)}
.phase button[aria-pressed="true"] .ph-name{color:var(--pine)}
.hard{
  display:grid;grid-template-columns:40px 28px minmax(0,1fr);column-gap:7px;align-items:center;position:relative;
  margin:3px 0;padding:7px 8px;border-radius:9px;background:var(--bad-bg);color:var(--bad);
  font:600 13.5px/1.3 var(--body);
}
.hard .h-t{text-align:right;font-variant-numeric:tabular-nums}
.hard .h-m{justify-self:center;width:9px;height:9px;background:var(--bad);transform:rotate(45deg)}
.slip > div{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:44px minmax(0,1fr);gap:3px 8px;font-size:14.5px}
.slip dt{font:600 11px/1.9 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.slip dt.then{color:var(--pine)}
.plain li{position:relative;padding:5px 0 5px 16px;font-size:14.5px}
.plain li::before{content:"";position:absolute;left:3px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--muted)}

/* ---------- place sheet ---------- */
.backbtn{
  display:inline-flex;align-items:center;gap:4px;min-height:40px;margin:-8px 0 2px -8px;padding:0 12px 0 6px;
  border:0;background:transparent;border-radius:999px;font:500 14px/1 var(--body);color:var(--muted);
}
.backbtn svg{width:18px;height:18px}
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-head .pchip{margin-top:-1px}
.sh-title{flex:1;min-width:0;font:400 28px/1.08 var(--display)}
.sh-zh{font:500 19px/1.3 var(--body);margin-top:4px;-webkit-user-select:text;user-select:text}
/* Live wait · Show in Amap · Copy 中文 name: three pills do not fit one 380px row, so they sit on the same
   two columns as the extra live links below instead of wrapping raggedly */
.sh-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.sh-btns .pill{padding:0 10px}
/* Watch: opens the first watch link. "Watch on YouTube · 2:45" does not fit half a 380px row on one line, so the
   length sits under the name inside the pill. Search pages get a magnifier instead of the play mark. */
.sh-btns .pill.watch{gap:7px;white-space:normal}
.pill.watch .pic{width:18px;height:18px}
.pill.watch .w-t{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.pill.watch .w-len{font:500 11.5px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--muted)}
/* the other ways to see the ride, as one muted line of small links, and one line of help under it */
.sh-also{margin-top:6px;font-size:13px;line-height:24px;color:var(--muted)}
.sh-also a{position:relative;color:var(--pine);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--pine),transparent 50%);text-underline-offset:2px}
.sh-also a::after{content:"";position:absolute;inset:-12px -5px}     /* about 40px to tap */
.sh-also .w-tag{font-size:12.5px}
.sh-help{font-size:12.5px;line-height:1.35;color:var(--muted)}
.sh-help + .sh-live{margin-top:10px}
.sh-live{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sh-apx{margin-top:7px;font-size:13px;line-height:1.35;color:var(--muted)}
.whereami p{font-size:14.5px;line-height:1.42}
.pill.sm{min-width:0;padding:5px 12px;border-color:var(--muted);border-radius:20px;font:500 13px/1.2 var(--body);white-space:normal;text-align:center}
.tag.nolink{font-weight:500}
.stopline{
  display:flex;align-items:center;gap:8px;width:100%;min-height:42px;margin-top:8px;padding:6px 12px;
  border:0;border-radius:11px;background:var(--good-bg);color:var(--ink);font:500 14px/1.25 var(--body);text-align:left;
}
.stopline:first-of-type{margin-top:14px}
.stopline .mk{flex:none}
.stopline .go{margin-left:auto;color:var(--pine);font-weight:600;white-space:nowrap;font-size:13px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.verdict{margin-top:14px;font-size:14.5px;font-variant-numeric:tabular-nums}
.verdict b{font-weight:600}
.verdict .for{color:var(--pine)} .verdict .against{color:var(--bad)} .verdict .mixed{color:var(--warn)}
.verdict .tag{margin-left:6px}
.notes li{position:relative;padding:6px 0 6px 16px;font-size:15px;line-height:1.42;border-top:1px solid var(--line)}
.notes li:first-child{border-top:0}
.notes li::before{content:"";position:absolute;left:2px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.notes.t-good li::before{background:var(--pine)}
.notes.t-watch li::before{background:var(--warn);border-radius:1px;transform:rotate(45deg)}
.notes.t-timing li::before{background:var(--c-rides)}
details.posts{margin-top:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
details.posts summary{
  list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;cursor:pointer;
  font:600 12px/1.3 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
}
details.posts summary::-webkit-details-marker{display:none}
details.posts summary svg{width:16px;height:16px;transition:transform .2s}
details.posts[open] summary svg{transform:rotate(180deg)}
.postlist li{border-top:1px solid var(--line)}
.postlist a,.postlist .nolink{display:block;padding:9px 0;text-decoration:none}
.postlist .pt{font-size:14.5px;font-weight:500;line-height:1.35}
.postlist a .pt{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.postlist .pm{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}

/* ---------- list, waits, info ---------- */
.plist li{border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.plist a{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:2px 10px;align-items:center;min-height:48px;padding:8px 0;text-decoration:none}
.plist .pchip{grid-row:1 / span 2}
details.mapkey{margin-top:12px;border:1.5px solid var(--ink);border-radius:14px}
details.mapkey summary{
  list-style:none;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 10px 0 12px;cursor:pointer;border-radius:13px;
  font:600 14px/1.2 var(--body);
}
details.mapkey summary::-webkit-details-marker{display:none}
details.mapkey summary .prev{display:flex;gap:3px;margin-left:2px}
details.mapkey summary .n{margin-left:auto;font:500 12.5px/1.2 var(--body);color:var(--muted);white-space:nowrap}
details.mapkey summary > svg{flex:none;width:16px;height:16px;transition:transform .2s}
details.mapkey[open] summary > svg{transform:rotate(180deg)}
details.mapkey[open] summary .prev{display:none}
.mapkey .kbody{padding:0 6px 8px;border-top:1px solid var(--line)}
.mapkey h4{margin:0;padding:10px 6px 2px;font:600 10.5px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mapkey h4 .zh{letter-spacing:.04em;font-weight:500;margin-left:6px;text-transform:none}
.mapkey ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 6px}
.mapkey li{min-width:0}
.mapkey li > *{display:grid;grid-template-columns:24px minmax(0,1fr);gap:0 8px;align-items:center;min-height:42px;padding:3px 6px;border-radius:9px;text-decoration:none}
.mapkey .pchip{grid-row:1 / span 2}
/* kept short so the key stays compact: one line of Chinese, at most two of English; the full names are in the place sheet */
.mapkey .z{font:600 13.5px/1.25 var(--body);align-self:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapkey .e,.mapkey .one{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.mapkey .e{grid-column:2;font:400 11.5px/1.25 var(--body);color:var(--muted);align-self:start}
.mapkey .one{grid-row:1 / span 2;font:500 13px/1.25 var(--body);align-self:center}
.mapkey .knote{padding:8px 6px 0;font-size:12.5px;line-height:1.4;color:var(--muted)}
.plist .nm{font-weight:600;font-size:15px;line-height:1.25}
.plist .nm{grid-column:2}
.plist .sub{grid-column:2;font-size:12.5px;color:var(--muted);line-height:1.3}
.plist .rt{grid-row:1 / span 2;grid-column:3;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.plist .rt .tag{white-space:nowrap}
.plist .rt svg{width:16px;height:16px;color:var(--muted)}
.tips li{padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.tips li:first-child{border-top:0}
.tips b{font-weight:600}
.unp{padding:9px 0;border-top:1px solid var(--line)}
.unp .nm{font-weight:600;font-size:15px}
.unp .sub{font-size:13px;color:var(--muted)}
.unp .notes li{font-size:14px;border-top:0;padding:3px 0 3px 16px}
.unp .notes li::before{top:11px}
.srcs a{color:var(--pine);text-underline-offset:3px}
.bigl li{margin-top:8px}
.bigl a,.bigl .row{
  display:grid;grid-template-columns:minmax(0,1fr) 20px;gap:2px 10px;align-items:center;
  padding:11px 12px 11px 14px;border:1.5px solid var(--ink);border-radius:14px;text-decoration:none;min-height:56px;
}
.bigl .nm{font-weight:600;font-size:16px;line-height:1.25}
.bigl .sub{grid-column:1;font-size:13.5px;color:var(--muted);line-height:1.35}
.bigl .nt{grid-column:1;margin-top:5px;font-size:12.5px;line-height:1.35;color:var(--muted)}
.bigl .nt .tag{font-weight:500}
.bigl svg{grid-row:1 / span 3;grid-column:2;width:18px;height:18px}
.bigl .nolink{border-style:dashed;border-color:var(--muted)}
table.hd{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
table.hd th:nth-child(1){width:46%} table.hd th:nth-child(3){width:54px}
table.hd th{font:600 11px/1.3 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px 6px 0;border-bottom:1.5px solid var(--ink)}
table.hd td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.hd td:last-child,table.hd th:last-child{padding-right:0;text-align:right}
table.hd .nm{font-weight:600;text-decoration:none;display:block;line-height:1.25}
table.hd .zh{display:block;font-size:12.5px;color:var(--muted)}
table.hd .w{font-variant-numeric:tabular-nums;font-size:13.5px;line-height:1.35}
table.hd .lv{color:var(--pine);font-weight:600;white-space:nowrap;display:inline-block;padding:6px 0 6px 10px;margin:-6px 0;text-underline-offset:3px}
table.hd .none{color:var(--muted)}
.ops li{padding:9px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.42}
.ops li:first-child{border-top:0}
.ops .srcline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.ops .srcline a{color:var(--pine);text-underline-offset:3px;padding:4px 0}

/* ---------- live location: "you are here". Built by the engine only where the browser offers geolocation ---------- */
/* Locate button: off (ink target) · locating (blinking blue) · on (blue, centre filled) · following (filled blue) */
.mbtn.loc svg{width:22px;height:22px;stroke-width:2}
.mbtn.loc .lc{fill:none}
.mbtn.loc[data-state="locating"] svg{color:var(--gps);animation:locblink 1.2s ease-in-out infinite}
.mbtn.loc[data-state="on"] svg{color:var(--gps)}
.mbtn.loc[data-state="on"] .lc,.mbtn.loc[data-state="following"] .lc{fill:currentColor}
.mbtn.loc[data-state="following"]{background:var(--gps);border-color:var(--gps);color:var(--on-pin)}
@keyframes locblink{50%{opacity:.3}}
#g-gps{pointer-events:none}
.gps-acc{fill:var(--gps);fill-opacity:.13;stroke:var(--gps);stroke-opacity:.5;stroke-width:1;vector-effect:non-scaling-stroke}
.gps-dot{fill:var(--gps);stroke:#fff;stroke-width:3}
.gps-pulse{fill:var(--gps);opacity:0;transform-box:fill-box;transform-origin:center;animation:gpspulse 2.4s ease-out infinite}
.gps-cone{fill:var(--gps);opacity:.3}
#map .gps-label{font:600 11.5px/1 var(--body);fill:var(--ink);text-anchor:middle}
.gps-lbg{fill:var(--surface);stroke:var(--muted);stroke-opacity:.5;stroke-width:1}
#g-gps.stale .gps-dot{fill:#8e9a97}
#g-gps.stale .gps-acc{fill:#8e9a97;stroke:#8e9a97}
#g-gps.stale .gps-pulse,#g-gps.stale .gps-cone{display:none}
@keyframes gpspulse{0%{transform:scale(1);opacity:.42}100%{transform:scale(3.3);opacity:0}}
/* the user is off the map: a marker on its edge points at them; a tap fits both */
.gps-edge{
  position:absolute;z-index:3;display:flex;align-items:center;gap:5px;height:30px;padding:0 11px 0 8px;
  border:1.5px solid var(--gps);border-radius:15px;background:var(--surface);color:var(--ink);box-shadow:var(--shade);

  var srcs = arr(D.meta.sources).filter(Boolean);
  if (srcs.length) {
    h += '<section><h3>Sources</h3><ul class="plain srcs">';
    srcs.forEach(function (s) {
      var url = safeUrl(s.url), label = esc(str(s.label) || 'Source');
      h += '<li>' + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + label + '</a>' : label) + (isNum(s.posts) ? ' · ' + s.posts + (s.posts === 1 ? ' post' : ' posts') : '') + '</li>';
    });
    h += '</ul></section>';
  }
  if (str(D.map.approx_note)) h += '<section><h3>About the map</h3><ul class="plain"><li>' + esc(str(D.map.approx_note)) + '</li></ul></section>';
  return h + footHtml();
}

function viewWaits() {
  var h = '<h2 class="vh">Live waits</h2><p class="lede">This page cannot fetch live wait times. Open one of these and read the number there.</p>';
  if (D.liveWaits.length) {
    h += '<ul class="bigl">';
    D.liveWaits.forEach(function (l) {
      var url = safeUrl(l.url);
      var inner = '<span class="nm">' + esc(str(l.label) || 'Wait times') + '</span>' + (url ? ICON.out : '') +
        (str(l.shows) ? '<span class="sub">' + esc(str(l.shows)) + '</span>' : '') + (str(l.notes) ? '<span class="nt"><span class="tag">' + esc(str(l.notes)) + '</span></span>' : '');
      h += '<li>' + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div class="row nolink">' + inner + '</div>') + '</li>';
    });
    h += '</ul>';
  } else h += '<p class="empty">No live wait links in the data yet.</p>';

  var heads = D.places.filter(function (p) { return layerKey(p) === 'rides' && (str(obj(p.facts).typical_wait) || arr(p.live).length); });
  heads.sort(function (a, b) { return (b.mentions || 0) - (a.mentions || 0); });
  if (heads.length) {
    h += '<section><h3>Headliners</h3><table class="hd"><thead><tr><th>Ride</th><th>Typical wait</th><th>Live</th></tr></thead><tbody>';
    heads.slice(0, 12).forEach(function (p) {
      var live = arr(p.live).filter(function (l) { return l && safeUrl(l.url); })[0];
      h += '<tr><td><a class="nm" href="' + esc(placeHref(p)) + '">' + esc(placeName(p)) + '</a>' + (str(p.zh) ? '<span class="zh" lang="zh">' + esc(str(p.zh)) + '</span>' : '') + '</td>' +
        '<td class="w">' + (esc(str(obj(p.facts).typical_wait)) || '<span class="none">not known</span>') + '</td>' +
        '<td>' + (live ? '<a class="lv" href="' + esc(safeUrl(live.url)) + '" target="_blank" rel="noopener" aria-label="Live wait for ' + esc(placeName(p)) + '">Open</a>' : '<span class="none">none</span>') + '</td></tr>';
    });
    h += '</tbody></table></section>';
  }
  return h + footHtml();
}

var CONF = { 'confirmed-official': ['Official', 'good'], 'reported': ['Reported', ''], 'unconfirmed': ['Unconfirmed', 'warn'] };
function viewInfo() {
  var h = '<h2 class="vh">Before you go</h2><p class="lede">What is known for Thu 19 Nov 2026, and where each line comes from.</p>';
  h += '<section class="whereami"><h3>Where am I?</h3><p>On the Claude page this map cannot read your phone\'s location. Tap Show in Amap on any place to see it ' +
    'next to your own blue dot in Amap. On the hosted copy, opened in your phone\'s browser, tap the Locate button (the target below the minus button on the map) ' +
    'to put your blue dot on this map; tap it again to follow you, and once more to turn it off. Positions on this map are good to about 30 m for pins, ' +
    'or 60 to 150 m where marked ≈. The outlines are drawn by hand, so judge your dot against the pins, not the outlines.</p></section>';
  var topics = [], by = {};
  D.ops.forEach(function (o) { var t = str(o.topic) || 'Other'; if (!by[t]) { by[t] = []; topics.push(t); } by[t].push(o); });
  /* early entry stays as reference facts; when no route has an early-entry stop the heading says the plan does not use it */
  var noEarly = D.routes.length > 0 && !D.routes.some(function (r) { return arr(r.stops).some(function (s) { return s && str(s.kind) === 'early'; }); });
  topics.forEach(function (t) {
    h += '<section><h3>' + (noEarly && /^early entry$/i.test(t) ? 'Not used today: ' : '') + esc(t) + '</h3><ul class="ops">';
    by[t].forEach(function (o) {
      var c = CONF[str(o.confidence)] || [str(o.confidence), ''], url = safeUrl(o.source_url), title = esc(str(o.source_title) || 'Source');
      h += '<li>' + esc(str(o.claim)) + '<div class="srcline">' + (c[0] ? '<span class="tag ' + c[1] + '">' + esc(c[0]) + '</span>' : '') +
        (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + title + '</a>' : (str(o.source_title) ? '<span>' + title + '</span>' : '') + '<span class="tag nolink">no public link</span>') +
        (str(o.source_date) ? '<span>' + esc(str(o.source_date)) + '</span>' : '') + '</div></li>';
    });
    h += '</ul></section>';
  });
  if (!topics.length) h += '<p class="empty">No before-you-go facts in the data yet.</p>';
  return h + footHtml();
}

/* =====================================================================
   9. VIEWS AND HASH ROUTER
   ===================================================================== */
var VIEWS = ['plan', 'list', 'waits', 'info'];
function parseHash() {
  var h = location.hash.replace(/^#/, '');
  try { h = decodeURIComponent(h); } catch (e) {}
  if (h.indexOf('p-') === 0 && placeById.has(h.slice(2))) return { name: 'place', id: h.slice(2) };
  if (VIEWS.indexOf(h) >= 0) return { name: h, id: null };
  return { name: 'plan', id: null };
}
function renderView(keepScroll) {
  var v = S.view, top = view.scrollTop;
  view.innerHTML = v.name === 'place' ? viewPlace(v.id) : v.name === 'list' ? viewList() : v.name === 'waits' ? viewWaits() : v.name === 'info' ? viewInfo() : viewPlan();
  var tab = v.name === 'place' ? (S.prev.name === 'place' ? 'plan' : S.prev.name) : v.name;
  $$('#tabs a').forEach(function (a) {
    if (a.getAttribute('data-tab') === tab) a.setAttribute('aria-current', v.name === 'place' ? 'true' : 'page'); else a.removeAttribute('aria-current');
  });
  if (v.name === 'plan') { fitText($('.rhead h2', view), 2, 18); markPlanSelection(); markPhaseUi(); updateNow(false); }
  if (keepScroll) view.scrollTop = top;
}
function onRoute(initial) {
  var next = parseHash(), cur = S.view;
  if (!initial) {
    if (cur.name !== 'place') S.scroll[cur.name] = view.scrollTop;
    if (cur.name !== 'place' || next.name !== 'place') S.prev = cur;
  }
  S.view = next;
  renderView();
  view.scrollTop = next.name === 'place' ? 0 : (S.scroll[next.name] || 0);
  var placeChanged = (cur.name === 'place') !== (next.name === 'place') || cur.id !== next.id;
  if (placeChanged && !initial) { renderPins(); applyTransform(); }
  if (next.name === 'place') { var p = placeById.get(String(next.id)); if (p && vw) ensureVisible(p); }
  if (next.name === 'plan') {
    if (S.pendingStop != null) { var n = S.pendingStop; S.pendingStop = null; selectStop(n, { reveal: 'jump' }); }
    else if (initial) updateNow(true);
  }
  if (!initial) { try { view.focus({ preventScroll: true }); } catch (e) {} }
}
function openPlace(id) {
  if (id == null || !placeById.has(String(id))) return;
  var h = '#p-' + encodeURIComponent(String(id));
  if (location.hash !== h) location.hash = h;      /* one history entry; Back returns to the previous view */
}
function goBack() {
  var first = false; try { first = !!(history.state && history.state.sdlFirst); } catch (e) {}
  if (first || history.length <= 1) location.hash = '#plan'; else history.back();
}
window.addEventListener('hashchange', function () { onRoute(false); });

view.addEventListener('click', function (e) {
  var t = e.target, act = t.closest('[data-act]');
  if (act) {
    var a = act.getAttribute('data-act');
    if (a === 'back') goBack();
    else if (a === 'phase') { var pid = act.getAttribute('data-phase'); setPhase(activePhase() === pid ? 'all' : pid); }
    else if (a === 'copy') copyZh(act);
    else if (a === 'routes') { if (layersOpen() && layFromPlan) closeLayers(); else openLayers(true); }
    else if (a === 'goto-stop') {
      S.pendingStop = +act.getAttribute('data-n');
      if (S.prev.name === 'plan' && !(history.state && history.state.sdlFirst)) history.back(); else location.hash = '#plan';
    }
    return;
  }
  if (t.closest('a')) return;                       /* links keep their own behaviour */
  var blk = t.closest('.blk'); if (blk) { selectStop(+blk.getAttribute('data-n'), { reveal: 'top' }); return; }
  var body = t.closest('.st-body'); if (body) selectStop(+body.parentNode.getAttribute('data-n'), { reveal: 'near' });
});
view.addEventListener('toggle', function (e) { if (e.target && e.target.id === 'mapKey') S.keyOpen = e.target.open; }, true);
view.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var t = e.target;
  if (t.classList && t.classList.contains('st-body')) { e.preventDefault(); selectStop(+t.parentNode.getAttribute('data-n'), { reveal: 'near' }); }
  else if (t.classList && t.classList.contains('blk')) { e.preventDefault(); selectStop(+t.getAttribute('data-n'), { reveal: 'top' }); }
});

/* =====================================================================
   10. BOOT
   ===================================================================== */
function boot() {
  try { history.replaceState({ sdlFirst: true }, '', location.href); } catch (e) {}
  S.view = parseHash();
  /* on the visit day the map opens on the part of the day it is now */
  var nowMin = shanghaiNowMin(), R0 = curInfo();
  if (nowMin != null && R0 && R0.phases.some(function (p) { return p.id === phaseAt(nowMin); })) S.phase = phaseAt(nowMin);
  buildLayerPanel(); buildPhaseChips(); updateLangBtn();
  /* a long note would be cut off on the map: show a short flag there and the full text in the List view */
  var note = str(D.map.approx_note);
  $('#apx').textContent = note.length > 34 ? '≈ approximate map' : note;
  if (!note && !(obj(D.map.scale).px > 0)) $('#mfoot').hidden = true;
  /* map.north: clockwise degrees from "up" on the drawing to true north (0 when missing) */
  var north = isNum(D.map.north) ? D.map.north : 0;
  $('#northArrow').setAttribute('transform', 'rotate(' + north + ')');
  $('#northN').setAttribute('transform', 'rotate(' + (-north) + ' 0 6.1)');   /* the letter stays upright at the tail of the arrow */
  $('#north').setAttribute('aria-label', 'North is ' + (Math.abs(((north % 360) + 540) % 360 - 180) < 8 ? 'up' : Math.round(((north % 360) + 360) % 360) + ' degrees clockwise from up') + ' on this map');
  buildMapStatic(); renderRoute(); renderPins();
  gpsInit();      /* adds the Locate button only where the browser offers geolocation; asks for nothing yet */
  applySplit(); onMapResize();
  onRoute(true);
  if (window.ResizeObserver) {
    new ResizeObserver(function () { onMapResize(); }).observe(mapPane);
    /* the header can change height (fonts arriving, rotation): keep the default split in proportion */
    new ResizeObserver(function () { if (S.mapMode !== 'custom') applySplit(); }).observe(app);
  }
  function fitHeads() { fitText($('h1'), 1, 16); fitText($('.rhead h2', view), 2, 18); }
  fitHeads();
  window.addEventListener('resize', function () { fitHeads(); applySplit(); onMapResize(); });
  if (WIDE.addEventListener) WIDE.addEventListener('change', function () { applySplit(); onMapResize(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitHeads(); measCache.clear(); layoutLabels(); });
}
boot();
})();
</script>
