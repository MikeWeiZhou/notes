<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ring Month · Month view prototype 5</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../shared.css">
<link rel="stylesheet" href="../month.css">
<style>
main{max-width:1000px;margin:0 auto;padding:12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.summary b{display:block;font:600 1.3rem Georgia,serif}
.summary span{font-size:.75rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:12px;cursor:pointer;border:1.5px solid transparent}
.cell.out{opacity:.35}
.cell.sel{border-color:var(--ink);background:var(--surface)}
.cell .n{font-size:.75rem;color:var(--muted);font-weight:600}
.cell.today .n{background:var(--ink);color:var(--paper);border-radius:999px;padding:0 6px}
.cell svg{width:100%;max-width:74px;aspect-ratio:1;overflow:visible}
.trk{fill:none;stroke:var(--surface2)}
.ctr{font:700 15px system-ui;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.ctr.none{fill:var(--muted);font-weight:400;font-size:12px}
.ovr{fill:none;stroke:var(--danger);stroke-dasharray:2 3}
.agenda{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.agenda h3{margin:0;font:600 1.15rem Georgia,serif}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin-top:10px;align-items:center}
</style>
</head>
<body>
<main id="app"></main>
<script>window.TODOCAL_KEY='todocal.monthproto';try{if(!localStorage.getItem('todocal.monthproto')){var r=localStorage.getItem('todocal.v1');if(r&&JSON.parse(r).tasks.length){localStorage.setItem('todocal.monthproto',r);localStorage.setItem('todocal.monthproto.src','app');}}}catch(e){}</script>
<script src="../../../todo-calendar/core.js"></script>
<script src="../month.js"></script>
<script>
(function(){
  const {h} = TCL;
  TCL.mount('rings');
  const NS = 'http://www.w3.org/2000/svg', CAP = TCL.CAP;
  const app = document.getElementById('app');
  const nav = TCL.monthNav(render);
  let sel = TCL.key(new Date());
  const summary = h('div', {class: 'summary'}), grid = h('div', {class: 'grid'}), agenda = h('div', {class: 'agenda'});
  app.append(nav.el, summary, grid,
    h('div', {class: 'legend'}, h('span', null, 'Full ring = 6h. Solid = done, light = still to do. Number = deadlines that day. Dashed red = over capacity.')),
    agenda, TCL.srcNote());
  const svgEl = (tag, at, text) => { const e = document.createElementNS(NS, tag); for (const a in at) e.setAttribute(a, at[a]); if (text != null) e.textContent = text; return e; };
  function ring(list, deadlines) {
    const r = 28, C = 2 * Math.PI * r, svg = svgEl('svg', {viewBox: '0 0 74 74'});
    const g = svgEl('g', {transform: 'rotate(-90 37 37)'});
    g.append(svgEl('circle', {cx: 37, cy: 37, r, class: 'trk', 'stroke-width': 8}));
    let off = 0;
    const total = list.reduce((s, o) => s + o.dur, 0), scale = Math.min(1, CAP / Math.max(total, 1));
    const sorted = list.slice().sort((a, b) => b.done - a.done || a.project.localeCompare(b.project));
    for (const o of sorted) {
      const len = o.dur / CAP * C * scale;
      if (len <= 0) continue;
      g.append(svgEl('circle', {cx: 37, cy: 37, r, fill: 'none', stroke: o.color, 'stroke-width': 8, 'stroke-opacity': o.done ? 1 : .38, 'stroke-dasharray': `${Math.max(0, len - 1.2)} ${C}`, 'stroke-dashoffset': -off}));
      off += len;
    }
    svg.append(g);
    if (total > CAP) svg.append(svgEl('circle', {cx: 37, cy: 37, r: 35, class: 'ovr', 'stroke-width': 1.5}));
    svg.append(svgEl('text', {x: 37, y: 37, class: 'ctr' + (deadlines ? '' : ' none')}, deadlines ? deadlines : '·'));
    return svg;
  }
  function render() {
    const m = nav.month(), days = TCL.monthDays(m), now = new Date(), tk = TCL.key(now);
    const occs = TCL.expand(days[0], TCL.addDays(days[41], 1));
    const inMonth = occs.filter((o) => TCL.parse(o.planDay).getMonth() === m.getMonth());
    const plannedM = inMonth.reduce((s, o) => s + o.dur, 0), doneM = inMonth.filter((o) => o.done).reduce((s, o) => s + o.dur, 0);
    const overdue = TCL.openOneOffs().filter((o) => o.due < now).length;
    summary.textContent = '';
    summary.append(h('div', null, h('b', null, TCL.fmtHours(plannedM)), h('span', null, 'planned this month')), h('div', null, h('b', null, TCL.fmtHours(doneM)), h('span', null, 'done')), h('div', null, h('b', {style: {color: overdue ? 'var(--danger)' : ''}}, overdue), h('span', null, 'overdue now')));
    grid.textContent = '';
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((d) => grid.append(h('div', {class: 'm-dow'}, d)));
    for (const d of days) {
      const k = TCL.key(d);
      const list = occs.filter((o) => o.planDay === k);
      const dl = occs.filter((o) => !o.recurring && !o.done && TCL.key(o.due) === k).length;
      grid.append(h('div', {class: 'cell' + (d.getMonth() !== m.getMonth() ? ' out' : '') + (k === sel ? ' sel' : '') + (k === tk ? ' today' : ''), onclick: () => { sel = k; render(); if (innerWidth < 700) agenda.scrollIntoView({behavior: 'smooth', block: 'nearest'}); }},
        ring(list, dl), h('span', {class: 'n'}, d.getDate())));
    }
    const d = TCL.parse(sel);
    const list = TCL.expand(d, TCL.addDays(d, 1)).filter((o) => o.planDay === sel).sort((a, b) => a.done - b.done || (a.start || a.due) - (b.start || b.due));
    const dues = TCL.expand(TCL.addDays(d, -60), TCL.addDays(d, 1)).filter((o) => !o.recurring && TCL.key(o.due) === sel && o.planDay !== sel);
    const L = list.filter((o) => !o.done).reduce((s, o) => s + o.dur, 0);
    agenda.textContent = '';
    agenda.append(h('h3', null, TCL.fmtDay(d)), h('div', {class: 'tcl-muted'}, `${TCL.fmtHours(L)} still to do · ${TCL.fmtHours(list.filter((o) => o.done).reduce((s, o) => s + o.dur, 0))} done`),
      h('div', null, list.length ? list.map((o) => TCL.itemRow(o, now)) : h('p', {class: 'tcl-muted'}, 'Nothing planned.'),
      dues.length ? [h('div', {class: 'tcl-muted', style: {marginTop: '10px'}}, 'Also due this day, worked on earlier'), dues.map((o) => TCL.itemRow(o, now))] : null));
  }
  TCL.onChange(render);
  render();
})();
</script>
</body>
</html>
