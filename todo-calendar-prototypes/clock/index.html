<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Day Clock · Todo Calendar prototype 7</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared.css">
<style>
main{max-width:1100px;margin:0 auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){main{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.controls{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.controls h2{margin:0 auto 0 0;font:600 1.25rem Georgia,serif}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 10px}
.mini{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);cursor:pointer;border-radius:10px;padding:4px 0;border:1px solid transparent;background:none}
.mini.sel{border-color:var(--ink);background:var(--surface)}
.mini svg{width:100%;max-width:64px;aspect-ratio:1}
.mini b{color:var(--ink);font-size:.8rem}
.dialwrap{max-width:560px;margin:0 auto;position:relative}
.dialwrap svg{width:100%;aspect-ratio:1;display:block;overflow:visible}
.face{fill:var(--surface);stroke:var(--line)}
.hr{stroke:var(--line);stroke-width:1}
.hrl{font-size:13px;fill:var(--muted);text-anchor:middle;dominant-baseline:middle}
.night{fill:var(--surface2)}
.arc{cursor:pointer;stroke-linecap:round;transition:opacity .15s}
.arc:hover{opacity:.8}
.arc.done{opacity:.3}
.gap{fill:none;stroke:color-mix(in oklab,var(--accent) 45%,transparent);stroke-width:6;stroke-dasharray:2 5}
.tick{stroke-width:3;cursor:pointer}
.hand{stroke:var(--danger);stroke-width:3;stroke-linecap:round}
.ctext{text-anchor:middle}
.ctext .big{font:600 30px Georgia,serif;fill:var(--ink)}
.ctext .small{font-size:14px;fill:var(--muted)}
aside{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
aside h3{margin:0 0 4px;font:600 1.05rem Georgia,serif}
.sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.row .st{height:30px;border-radius:2px}
.row .t{font-weight:500;font-size:.9rem}
.row .m{font-size:.75rem;color:var(--muted)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.fit{font-size:.78rem;padding:4px 9px}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:.76rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:16px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<main>
  <section>
    <div class="controls">
      <h2 id="title"></h2>
      <div class="tcl-seg"><button id="prev" aria-label="Previous day">‹</button><button id="today">Today</button><button id="next" aria-label="Next day">›</button></div>
    </div>
    <div class="week" id="week"></div>
    <div class="dialwrap" id="dial"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>scheduled work</span><span><i style="background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 6px);opacity:.6"></i>free gap (30m+)</span><span><i style="background:var(--ink);width:3px;height:12px"></i>deadline</span><span><i style="background:var(--danger)"></i>now</span></div>
  </section>
  <aside id="side"></aside>
</main>
<script src="../shared.js"></script>
<script>
(function(){
  const {h} = TCL;
  TCL.mount('clock');
  const NS = 'http://www.w3.org/2000/svg';
  const WAKE = 7 * 60, SLEEP = 23 * 60;
  let day = TCL.sod(new Date());
  const svgEl = (tag, at, text) => { const e = document.createElementNS(NS, tag); for (const a in at) e.setAttribute(a, at[a]); if (text != null) e.textContent = text; return e; };
  const ang = (min) => min / 1440 * 2 * Math.PI - Math.PI / 2;
  const pt = (c, r, min) => [c + Math.cos(ang(min)) * r, c + Math.sin(ang(min)) * r];
  const arc = (c, r, m0, m1) => { const [x0, y0] = pt(c, r, m0), [x1, y1] = pt(c, r, Math.max(m0 + 1, m1)); return `M${x0} ${y0} A${r} ${r} 0 ${m1 - m0 > 720 ? 1 : 0} 1 ${x1} ${y1}`; };
  const sector = (c, r, m0, m1) => { const [x0, y0] = pt(c, r, m0), [x1, y1] = pt(c, r, m1); return `M${c} ${c} L${x0} ${y0} A${r} ${r} 0 ${m1 - m0 > 720 ? 1 : 0} 1 ${x1} ${y1} Z`; };
  const mins = (d) => d.getHours() * 60 + d.getMinutes();

  function dayData(d) {
    const k = TCL.key(d);
    const occs = TCL.expand(d, TCL.addDays(d, 1));
    const sched = occs.filter((o) => o.start && TCL.key(o.start) === k).sort((a, b) => a.start - b.start);
    const dues = occs.filter((o) => !o.recurring && TCL.key(o.due) === k);
    const floating = TCL.openOneOffs().filter((o) => !o.start && o.planDay <= k && TCL.key(o.due) >= k && (o.planDay === k || TCL.key(o.due) === k));
    // free gaps in waking hours
    const busy = sched.filter((o) => !o.done).map((o) => [mins(o.start), mins(o.start) + o.dur]);
    const gaps = []; let cur = WAKE;
    const isToday = k === TCL.key(new Date());
    if (isToday) cur = Math.max(cur, Math.ceil(mins(new Date()) / 15) * 15);
    for (const [s, e] of busy.sort((a, b) => a[0] - b[0])) { if (s - cur >= 30) gaps.push([cur, s]); cur = Math.max(cur, e); }
    if (SLEEP - cur >= 30) gaps.push([cur, SLEEP]);
    return {k, sched, dues, floating, gaps};
  }

  function drawDial(d, size, mini) {
    const {sched, dues, gaps} = dayData(d);
    const c = size / 2, R = c - (mini ? 2 : 34);
    const svg = svgEl('svg', {viewBox: `0 0 ${size} ${size}`});
    svg.append(svgEl('circle', {cx: c, cy: c, r: R, class: 'face'}));
    svg.append(svgEl('path', {d: sector(c, R, SLEEP, 1440), class: 'night'}), svgEl('path', {d: sector(c, R, 0.01, WAKE), class: 'night'}));
    if (!mini) for (let i = 0; i < 24; i++) {
      const [x0, y0] = pt(c, R, i * 60), [x1, y1] = pt(c, R - (i % 6 ? 6 : 12), i * 60);
      svg.append(svgEl('line', {x1: x0, y1: y0, x2: x1, y2: y1, class: 'hr'}));
      if (i % 3 === 0) { const [lx, ly] = pt(c, R + 16, i * 60); svg.append(svgEl('text', {x: lx, y: ly, class: 'hrl'}, i === 0 ? '12am' : i === 12 ? 'noon' : (i % 12) + (i < 12 ? 'am' : 'pm'))); }
    }
    const bw = mini ? 6 : 26;
    // lanes for overlaps
    const ends = [];
    sched.forEach((o) => { const s = mins(o.start); let l = ends.findIndex((e) => e <= s); if (l < 0) { l = ends.length; ends.push(0); } ends[l] = s + o.dur; o._l = l; });
    if (!mini) gaps.forEach(([s, e]) => svg.append(svgEl('path', {d: arc(c, R - 22 - bw, s + 4, e - 4), class: 'gap'})));
    sched.forEach((o) => {
      const s = mins(o.start), r = R - (mini ? 6 : 22) - o._l * (bw + 3);
      const p = svgEl('path', {d: arc(c, r, s, s + o.dur), stroke: o.color, 'stroke-width': bw, fill: 'none', class: 'arc' + (o.done ? ' done' : '')});
      if (!mini) { p.append(svgEl('title', {}, `${o.title} · ${TCL.fmtTime(o.start)} · ${TCL.fmtDur(o.dur)}`)); p.addEventListener('click', () => TCL.openTask(o)); }
      svg.append(p);
    });
    dues.forEach((o) => {
      const m = mins(o.due);
      const [x0, y0] = pt(c, R + (mini ? 0 : 2), m), [x1, y1] = pt(c, R - (mini ? 8 : 16), m);
      const t = svgEl('line', {x1: x0, y1: y0, x2: x1, y2: y1, stroke: o.done ? 'var(--muted)' : o.color, class: 'tick', 'stroke-width': mini ? 2 : 4});
      if (!mini) { t.append(svgEl('title', {}, `Due: ${o.title}${o.hasTime ? ' at ' + TCL.fmtTime(o.due) : ' (end of day)'}`)); t.addEventListener('click', () => TCL.openTask(o)); }
      svg.append(t);
    });
    const now = new Date();
    if (TCL.key(d) === TCL.key(now)) {
      const [x, y] = pt(c, R - (mini ? 2 : 8), mins(now));
      const [hx, hy] = pt(c, mini ? 0 : R * .42, mins(now));
      svg.append(svgEl('line', {x1: hx, y1: hy, x2: x, y2: y, class: 'hand', 'stroke-width': mini ? 1.5 : 3}), svgEl('circle', {cx: mini ? c : x, cy: mini ? c : y, r: mini ? 2 : 6, fill: 'var(--danger)'}));
    }
    return svg;
  }

  function render() {
    const now = new Date(), T = TCL.sod(now);
    const isToday = TCL.key(day) === TCL.key(now);
    document.getElementById('title').textContent = isToday ? 'Today' : TCL.fmtDay(day);
    const wk = document.getElementById('week'); wk.textContent = '';
    for (let i = 0; i < 7; i++) {
      const d = TCL.addDays(T, i);
      wk.append(h('button', {class: 'mini' + (TCL.key(d) === TCL.key(day) ? ' sel' : ''), onclick: () => { day = d; render(); }}, drawDial(d, 64, true), h('b', null, i === 0 ? 'Today' : TCL.DOW[d.getDay()]), d.getDate()));
    }
    const {sched, dues, floating, gaps} = dayData(day);
    const dial = document.getElementById('dial'); dial.textContent = '';
    const svg = drawDial(day, 560, false);
    const planned = sched.filter((o) => !o.done).reduce((s, o) => s + o.dur, 0) + floating.reduce((s, o) => s + o.dur, 0);
    const free = gaps.reduce((s, [a, b]) => s + b - a, 0);
    const g = svgEl('g', {class: 'ctext'});
    g.append(svgEl('text', {x: 280, y: 262, class: 'big'}, isToday ? TCL.fmtTime(now) : TCL.DOW[day.getDay()]));
    g.append(svgEl('text', {x: 280, y: 292, class: 'small'}, `${TCL.fmtHours(planned)} of work · ${TCL.fmtHours(free)} free`));
    g.append(svgEl('text', {x: 280, y: 314, class: 'small'}, `${dues.filter((o) => !o.done).length} deadline${dues.filter((o) => !o.done).length === 1 ? '' : 's'}`));
    svg.append(g);
    dial.append(svg);
    // side panel
    const side = document.getElementById('side'); side.textContent = '';
    side.append(h('h3', null, isToday ? 'Today' : TCL.fmtDay(day)));
    const row = (o, extra) => h('div', {class: 'row' + (o.done ? ' done' : ''), onclick: () => TCL.openTask(o)},
      h('span', {class: 'st', style: {background: o.color}}),
      h('div', null, h('div', {class: 't'}, o.title), h('div', {class: 'm'}, extra)), h('span'));
    side.append(h('div', {class: 'sec'}, `Needs a slot · ${floating.length}`));
    if (!floating.length) side.append(h('p', {class: 'tcl-muted'}, 'Everything due here has a time on the clock.'));
    floating.forEach((o) => {
      const gap = gaps.find(([s, e]) => e - s >= o.dur);
      const r = row(o, `${TCL.fmtDur(o.dur)} · due ${TCL.relDue(o, now)}`);
      r.lastChild.replaceWith(gap ? h('button', {class: 'tcl-btn fit', title: 'Put it in the first free gap', onclick: (e) => { e.stopPropagation(); const st = new Date(day); st.setHours(0, gap[0]); TCL.setStart(o, st); }}, 'Fit at ' + TCL.fmtTime(new Date(2000, 0, 1, 0, gap[0]))) : h('span', {class: 'tcl-muted'}, 'no gap'));
      side.append(r);
    });
    side.append(h('div', {class: 'sec'}, 'On the clock'));
    if (!sched.length) side.append(h('p', {class: 'tcl-muted'}, 'Nothing scheduled.'));
    sched.forEach((o) => side.append(row(o, `${TCL.fmtTime(o.start)} · ${TCL.fmtDur(o.dur)}${o.recurring ? ' · repeats' : ''}`)));
  }
  document.getElementById('prev').onclick = () => { day = TCL.addDays(day, -1); render(); };
  document.getElementById('next').onclick = () => { day = TCL.addDays(day, 1); render(); };
  document.getElementById('today').onclick = () => { day = TCL.sod(new Date()); render(); };
  TCL.onChange(render);
  TCL.every(render);
  render();
})();
</script>
</body>
</html>
