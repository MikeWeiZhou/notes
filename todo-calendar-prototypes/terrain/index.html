<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Workload Terrain · Todo Calendar prototype 8</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared.css">
<style>
main{max-width:1180px;margin:0 auto;padding:12px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.controls h2{margin:0 auto 0 0;font:600 1.25rem Georgia,serif}
.controls h2 small{display:block;font:400 .82rem system-ui;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 6px 4px;touch-action:pan-y;user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.ax{font-size:11px;fill:var(--muted)}
.ax.we{fill:color-mix(in oklab,var(--muted) 60%,transparent)}
.grid{stroke:var(--line);stroke-width:1}
.cap{stroke:var(--danger);stroke-width:1.5;stroke-dasharray:6 5}
.caplab{font-size:11px;fill:var(--danger);font-weight:600}
.crunch{fill:color-mix(in oklab,var(--danger) 12%,transparent)}
.cursor{stroke:var(--ink);stroke-width:1.5}
.pinline{stroke-width:1.5}
.pin{stroke:var(--surface);stroke-width:2;cursor:pointer}
.today{fill:color-mix(in oklab,var(--accent) 10%,transparent)}
.tip{font-size:12px;font-weight:600;fill:var(--ink)}
.tipbg{fill:var(--surface);stroke:var(--line)}
.day{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.day h3{margin:0 0 2px;font:600 1.1rem Georgia,serif}
.bars{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2);margin:8px 0}
.it{display:grid;grid-template-columns:22px 4px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.it input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.it .st{height:26px;border-radius:2px}
.it .t{font-weight:500;font-size:.9rem}
.it .m{font-size:.75rem;color:var(--muted)}
.it.done .t{text-decoration:line-through;color:var(--muted)}
.it .d{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <div class="controls">
    <h2>Next 30 days<small id="sub"></small></h2>
  </div>
  <div class="chips" id="chips"></div>
  <div class="chart" id="chart"></div>
  <p class="tcl-muted" style="margin:6px 4px 0">Work without a time slot is spread evenly from today up to its deadline, so hills show pressure building.</p>
  <div class="day" id="day"></div>
</main>
<script src="../shared.js"></script>
<script>
(function(){
  const {h} = TCL;
  TCL.mount('terrain');
  const NS = 'http://www.w3.org/2000/svg', N = 30, CAP = 6 * 60;
  const hidden = new Set();
  let sel = 0, geo = null, dragging = false;
  const chartBox = document.getElementById('chart');
  const pick = (e) => { const svg = chartBox.querySelector('svg'); if (!svg || !geo) return; const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * geo.W; const i = Math.max(0, Math.min(N - 1, Math.floor((px - geo.L) / ((geo.W - geo.L - geo.Rm) / N)))); if (i !== sel) { sel = i; render(); } };
  chartBox.addEventListener('pointerdown', (e) => { if (e.target.classList && e.target.classList.contains('pin')) return; dragging = true; chartBox.setPointerCapture(e.pointerId); pick(e); });
  chartBox.addEventListener('pointermove', (e) => { if (dragging) pick(e); });
  chartBox.addEventListener('pointerup', () => (dragging = false));
  chartBox.addEventListener('pointercancel', () => (dragging = false));
  const svgEl = (tag, at, text) => { const e = document.createElementNS(NS, tag); for (const a in at) e.setAttribute(a, at[a]); if (text != null) e.textContent = text; return e; };
  function data(now) {
    const T = TCL.sod(now), tk = TCL.key(T);
    const occs = TCL.expand(T, TCL.addDays(T, N)).filter((o) => !hidden.has(o.project));
    const overdue = TCL.openOneOffs().filter((o) => o.planDay < tk && !hidden.has(o.project));
    const keys = Object.keys(TCL.PROJECTS);
    const days = Array.from({length: N}, (_, i) => ({d: TCL.addDays(T, i), k: TCL.key(TCL.addDays(T, i)), by: Object.fromEntries(keys.map((p) => [p, 0])), list: [], pins: []}));
    const idx = Object.fromEntries(days.map((x, i) => [x.k, i]));
    for (const o of occs.concat(overdue)) {
      const i = o.planDay < tk ? 0 : idx[o.planDay];
      if (i == null) continue;
      days[i].list.push(o);
      if (o.done) continue;
      if (!o.recurring && !o.start && !o.task.plan && i > 0) { // spread unscheduled work evenly up to its deadline
        for (let j = 0; j <= i; j++) days[j].by[o.project] += o.dur / (i + 1);
      } else days[i].by[o.project] += o.dur;
    }
    for (const o of occs) if (!o.recurring && !o.done && idx[TCL.key(o.due)] != null) days[idx[TCL.key(o.due)]].pins.push(o);
    days.forEach((x) => (x.total = keys.reduce((s, p) => s + x.by[p], 0)));
    return {days, keys};
  }

  function render() {
    const now = new Date();
    const chips = document.getElementById('chips'); chips.textContent = '';
    for (const [k, p] of Object.entries(TCL.PROJECTS)) chips.append(h('button', {class: 'tcl-chip' + (hidden.has(k) ? ' off' : ''), onclick: () => { hidden.has(k) ? hidden.delete(k) : hidden.add(k); render(); }}, h('span', {class: 'tcl-dot', style: {background: p.color}}), p.name));
    const {days, keys} = data(now);
    const crunch = days.filter((x) => x.total > CAP).length;
    document.getElementById('sub').textContent = `${TCL.fmtHours(days.reduce((s, x) => s + x.total, 0))} of work · ${crunch} crunch day${crunch === 1 ? '' : 's'} over ${TCL.fmtHours(CAP)}`;
    const box = document.getElementById('chart');
    const W = Math.max(320, box.clientWidth - 12), H = innerWidth < 600 ? 260 : 340;
    const L = 30, Rm = 10, top = 46, bottom = H - 24;
    const maxM = Math.max(CAP * 1.4, ...days.map((x) => x.total)) ;
    const x = (i) => L + (i + .5) * (W - L - Rm) / N;
    const y = (m) => bottom - m / maxM * (bottom - top);
    const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, height: H});
    svg.append(svgEl('rect', {x: x(0) - (W - L - Rm) / N / 2, y: top - 40, width: (W - L - Rm) / N, height: bottom - top + 40, class: 'today'}));
    for (let hr = 0; hr <= maxM / 60; hr += 2) { svg.append(svgEl('line', {x1: L, x2: W - Rm, y1: y(hr * 60), y2: y(hr * 60), class: 'grid'})); svg.append(svgEl('text', {x: L - 6, y: y(hr * 60) + 4, class: 'ax', 'text-anchor': 'end'}, hr + 'h')); }
    // crunch shading above capacity
    days.forEach((d, i) => { if (d.total > CAP) { const w = (W - L - Rm) / N; svg.append(svgEl('rect', {x: x(i) - w / 2, y: y(d.total), width: w, height: y(CAP) - y(d.total), class: 'crunch'})); } });
    // stacked areas (bottom to top)
    const acc = days.map(() => 0);
    const layers = [];
    for (const p of keys) {
      const lo = acc.slice(); days.forEach((d, i) => (acc[i] += d.by[p])); const hi = acc.slice();
      layers.push({p, lo, hi});
    }
    for (const {p, lo, hi} of layers.reverse()) {
      if (hi.every((v, i) => v === lo[i])) continue;
      const topPts = hi.map((v, i) => [x(i), y(v)]);
      const pts = [[x(0) - 6, y(hi[0])], ...topPts, [x(N - 1) + 6, y(hi[N - 1])]];
      const botPts = [[x(0) - 6, bottom], [x(N - 1) + 6, bottom]];
      svg.append(svgEl('path', {d: 'M' + pts.map((p) => p.join(' ')).join(' L') + ` L${x(N - 1) + 6} ${bottom} L${x(0) - 6} ${bottom} Z`, fill: TCL.PROJECTS[p].color, 'fill-opacity': .85, stroke: 'var(--surface)', 'stroke-width': 1.5}));
    }
    svg.append(svgEl('line', {x1: L, x2: W - Rm, y1: y(CAP), y2: y(CAP), class: 'cap'}), svgEl('text', {x: W - Rm, y: y(CAP) - 5, class: 'caplab', 'text-anchor': 'end'}, `capacity ${TCL.fmtHours(CAP)}`));
    // pins
    days.forEach((d, i) => d.pins.forEach((o, j) => {
      const base = y(d.total), py = Math.max(10, base - 16 - j * 13);
      svg.append(svgEl('line', {x1: x(i), x2: x(i), y1: base, y2: py, stroke: o.color, class: 'pinline'}));
      const c = svgEl('circle', {cx: x(i), cy: py, r: 6, fill: o.color, class: 'pin'});
      c.append(svgEl('title', {}, `Due: ${o.title}`));
      c.addEventListener('click', (e) => { e.stopPropagation(); TCL.openTask(o); });
      svg.append(c);
    }));
    // axis labels
    let lastM = days[0].d.getMonth();
    days.forEach((d, i) => { if (i % (innerWidth < 600 ? 5 : 2) !== 0) return; const nm = d.d.getMonth() !== lastM; lastM = d.d.getMonth(); svg.append(svgEl('text', {x: x(i), y: H - 6, class: 'ax' + (d.d.getDay() % 6 === 0 ? ' we' : ''), 'text-anchor': 'middle'}, i === 0 ? 'Today' : `${nm ? TCL.MON[d.d.getMonth()] + ' ' : ''}${d.d.getDate()}`)); });
    // cursor
    const s = days[sel];
    svg.append(svgEl('line', {x1: x(sel), x2: x(sel), y1: top - 36, y2: bottom, class: 'cursor'}));
    const label = `${sel === 0 ? 'Today' : TCL.fmtDay(s.d)} · ${TCL.fmtHours(s.total)}`;
    const tw = label.length * 6.6 + 14, tx = Math.min(W - Rm - tw, Math.max(L, x(sel) - tw / 2));
    svg.append(svgEl('rect', {x: tx, y: top - 44, width: tw, height: 22, rx: 8, class: 'tipbg'}), svgEl('text', {x: tx + tw / 2, y: top - 29, class: 'tip', 'text-anchor': 'middle'}, label));
    geo = {W, L, Rm};
    box.textContent = ''; box.append(svg);
    // selected day list
    const day = document.getElementById('day'); day.textContent = '';
    const list = s.list.slice().sort((a, b) => a.done - b.done || (a.start || a.due) - (b.start || b.due));
    day.append(h('h3', null, sel === 0 ? 'Today' : TCL.fmtDay(s.d)), h('div', {class: 'tcl-muted'}, `${TCL.fmtHours(s.total)} planned · ${s.pins.length} deadline${s.pins.length === 1 ? '' : 's'}`),
      h('div', {class: 'bars'}, keys.filter((p) => s.by[p]).map((p) => h('span', {style: {width: s.by[p] / Math.max(CAP, s.total) * 100 + '%', background: TCL.PROJECTS[p].color}}))));
    list.forEach((o) => day.append(h('div', {class: 'it' + (o.done ? ' done' : ''), onclick: () => TCL.openTask(o)},
      h('input', {type: 'checkbox', checked: o.done, onclick: (e) => { e.stopPropagation(); TCL.toggle(o); }}),
      h('span', {class: 'st', style: {background: o.color}}),
      h('div', null, h('div', {class: 't'}, o.title), h('div', {class: 'm'}, o.start ? TCL.fmtTime(o.start) + (o.recurring ? ' · repeats' : ` · due ${TCL.relDue(o, now)}`) : o.recurring ? 'repeats' : `due ${TCL.relDue(o, now)}`)),
      h('span', {class: 'd'}, TCL.fmtDur(o.dur)))));
    if (!list.length) day.append(h('p', {class: 'tcl-muted'}, 'A flat stretch. Nothing planned.'));
  }
  TCL.onChange(render);
  addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
