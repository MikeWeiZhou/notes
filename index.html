<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Notes</title>
<style>
/* Layout idea: a plain index, one row per note. */
:root{--paper:#eaefec;--surface:#f7faf8;--ink:#172625;--muted:#586a67;--line:#c9d4cf;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#101817;--surface:#182221;--ink:#e4ece8;--muted:#96a8a3;--line:#2b3a37;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC",sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 16px}
h1{font:400 2rem/1.1 Georgia,"Songti SC",serif;margin:0 0 20px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a{display:block;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;text-decoration:none}
a:hover,a:focus-visible{border-color:var(--ink);outline:none}
a strong{display:block;font-weight:600}
a span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Notes</h1>
<ul>
<li><a href="shanghai-disneyland/"><strong>Shanghai Disneyland Day Plan</strong><span>Thu 19 Nov 2026 · map, routes, live location</span></a></li>
</ul>
</main>
</body>
</html>
